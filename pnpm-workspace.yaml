packages:
  - "apps/*"
  - "packages/*/*"
  - "backends/python/*"
  - "backends/gateway"

# Supply-chain guardrails.
# - Wait 24h before resolving newly published package versions. This matches
#   pnpm 11's hardened default while keeping security hotfixes usable.
# - Fail installs when a dependency with a lifecycle script is not explicitly
#   reviewed in `allowBuilds` below.
# - Ignore pnpmfile hooks so dependency resolution cannot execute project-local
#   JavaScript during install.
minimumReleaseAge: 1440
# Security hotfixes may land <24h; allow these override targets immediately.
minimumReleaseAgeExclude:
  - next
  - better-auth
  - "@better-auth/*"
  - axios
  - js-yaml
  - brace-expansion
  - fast-uri
  - linkify-it
  - protobufjs
  - sharp
  - adm-zip
  - "@opentelemetry/*"
  - "@hono/node-server"
  - dompurify
  - body-parser
  - tar
trustPolicy: no-downgrade
# next-auth@5.0.0-beta.32 patches critical Auth.js CVEs but ships without the
# provenance attestation present on beta.31 (upstream CI change, not takeover).
trustPolicyExclude:
  # semver@6.3.1 is a 2023 backport published after 7.5.x had gained provenance;
  # 6.x never carried it. Reached when @babel/core's subtree re-resolves.
  - "semver@6.3.1"
  - "next-auth@5.0.0-beta.32"
  - "@auth/core@0.41.3"
  # chokidar@4.0.3 (via tsup) lost provenance attestation vs earlier 4.x — not a takeover.
  - "chokidar@4.0.3"
  # undici-types@6.21.0 (via @types/node) dropped provenance vs earlier 6.x — not a takeover.
  - "undici-types@6.21.0"
  - "undici-types"
  # Sanity SDK 2.11.1 pins this experimental TypeGen build. Its reviewed JS
  # only interpolates strings and adds a no-op defineProjection; no dependencies
  # or install scripts. Stable 3.88.1 lacks the SDK's projection/schema types.
  - "groq@3.88.1-typegen-experimental.0"
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
ignorePnpmfile: true
verifyDepsBeforeRun: error
publicHoistPattern:
  - "*"

# =============================================================================
# pnpm Catalog — single source of truth for shared dependency versions.
# Reference in any package.json as: "typescript": "catalog:"
# Run `pnpm install` after editing to regenerate the lockfile.
# =============================================================================
catalog:
  # ── Language & build tools ─────────────────────────────────────────────────
  typescript: ^5.9.3
  tsup: ^8.5.1
  tsx: ^4.21.0

  # ── Node types ─────────────────────────────────────────────────────────────
  "@types/node": ^25.9.1

  # ── React ──────────────────────────────────────────────────────────────────
  # Most apps use ^19.2.4 (caret); a few pin to 19.2.4 — standardizing to caret.
  react: ^19.2.4
  react-dom: ^19.2.4
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3

  # ── Next.js ────────────────────────────────────────────────────────────────
  next: ~16.3.8
  next-themes: ^0.4.6
  next-intl: ^4.12.0
  "@next/bundle-analyzer": ^16.2.11

  # ── Fonts ──────────────────────────────────────────────────────────────────
  geist: ^1.3.1

  # ── Styling ────────────────────────────────────────────────────────────────
  tailwindcss: ^4.2.1
  "@tailwindcss/postcss": ^4.2.1
  "@tailwindcss/vite": ^4.2.1
  framer-motion: ^12.35.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.5.0

  # ── Validation ─────────────────────────────────────────────────────────────
  zod: ^4.3.6

  # ── Database ───────────────────────────────────────────────────────────────
  "@prisma/client": ^7.4.2
  "@prisma/adapter-pg": ^7.4.2
  prisma: ^7.4.2

  # ── Testing ────────────────────────────────────────────────────────────────
  vite: 8.0.16
  vitest: ^4.1.11
  "@vitest/coverage-v8": ^4.1.11
  "@vitejs/plugin-react-swc": ^4.3.1
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/react": ^16.3.2
  jsdom: ^29.1.1

  # ── Linting ────────────────────────────────────────────────────────────────
  "@biomejs/biome": ^2.4.8

  # ── UI primitives ──────────────────────────────────────────────────────────
  "@radix-ui/react-slot": ^1.2.4

  # ── Forms & UI utilities ───────────────────────────────────────────────────
  react-hook-form: ^7.71.2
  react-resizable-panels: ^4.7.1

  # ── AI ─────────────────────────────────────────────────────────────────────
  "@ai-sdk/react": ^3.0.118
  ai: ^6.0.116

  # ── Docs / MDX ─────────────────────────────────────────────────────────────
  fumadocs-core: ^16.6.12
  fumadocs-mdx: ^14.2.10
  fumadocs-ui: ^16.6.12
  "@types/mdx": ^2.0.13
  mermaid: ^11.16.1

  # ── Backend / infra ────────────────────────────────────────────────────────
  hono: ^4.13.7 # Current CORS / request validation security fixes
  ioredis: ^5.4.2

  # ── Observability / analytics ──────────────────────────────────────────────
  "@vercel/analytics": ^1.6.1
  "@vercel/speed-insights": ^1.3.1

