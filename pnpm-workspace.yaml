  # in the pnpm 10 lockfile; preserve no-downgrade instead of exempting them.
  "express-rate-limit@8.3.0": "8.3.2"
  "react-redux@9.2.0": "9.3.0"
  "reselect@5.1.1": "5.2.0"
  # GHSA (2026-09-02): browserslist <=4.28.6 unbounded memory growth / prototype
  # write via crafted queries; mysql2 <3.22.0 auth plugin downgrade. Both reach
  # us transitively (Babel targets; better-auth's optional MySQL driver).
  browserslist: ">=4.28.7"
  mysql2: ">=3.22.0"
  # GHSA (2026-09-09): four highs landed in the production graph, and in every
  # case an override below was already pinning the package at the exact version
  # the advisory names — a floor written before the advisory existed. Each was
  # raised in place: sharp >=0.35.0 -> >=0.35.4 (libheif, via next and
  # apps/forge), nodemailer >=9.0.1 -> >=9.1.0 (quadratic address parsing),
  # svgo 4.0.2 -> >=4.1.0 (removeScripts allows executable links, both the
  # @svgr-scoped pin and the loose floor), gray-matter's js-yaml >=3.15.1 ->
  # >=3.15.2 (unbounded merge-key CPU; kept on the 3.x line, which sailor-docs
  # is the only consumer of). A raised floor, not a new entry — a second entry
  # for the same key is a duplicate mapping and pnpm refuses the file.
  "@actions/github>undici": ">=7.29.1 <8"
  "@actions/http-client>undici": ">=7.29.1 <8"
  "@babel/core": "7.29.6"
  "@babel/plugin-transform-modules-systemjs": ">=7.29.4"
