# Thin edge gateway. Separate Worker from nebutra-gateway, not a variant of it.
#
# No Hyperdrive binding and no cron: this entry never touches Postgres. Both
# belong to the full gateway, which runs on ECS Origin. Giving the edge a
# database connection would invite exactly the duplicated logic the split
# exists to avoid.
#
# ORIGIN_URL must be a hostname that is NOT proxied through this Worker.
# Pointing it at the hostname the Worker serves loops the request back into
# itself, so it is set per-environment as a var rather than defaulted here.

name = "nebutra-gateway-edge"
main = "src/worker-edge.ts"
compatibility_date = "2026-06-04"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Requests per minute per IP before shedding. Set far above real usage — this
# sheds floods, it is not the per-key limit, which stays at the origin where
# the plan is known.
EDGE_IP_RATE_LIMIT = "600"
