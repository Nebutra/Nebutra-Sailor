name = "nebutra-gateway"
main = "src/worker.ts"
compatibility_date = "2026-06-04"
compatibility_flags = ["nodejs_compat"]

# Edge connection pool in front of Postgres. Without it every Worker isolate
# opens its own connection and the database runs out of slots long before the
# Worker runs out of capacity. `localConnectionString` is what `wrangler dev`
# uses, so local development still talks to a local/Supabase database directly.
#
# `id` is filled in per environment by `wrangler hyperdrive create` — see
# docs/ops/postgres-to-planetscale-via-cloudflare.md. Left empty here so a
# missing binding fails loudly at deploy rather than silently pointing a
# production Worker at someone else's database.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = ""
localConnectionString = "postgresql://postgres:postgres@localhost:5432/nebutra"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
DEPLOY_TARGET_GATEWAY = "cloudflare-workers"
