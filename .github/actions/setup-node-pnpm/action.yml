name: Setup Node and pnpm
description: Shared Nebutra workflow setup for Node.js, pnpm cache, and optional install.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "22"
  install:
    description: Run the install command after setup.
    required: false
    default: "true"
  cache:
    description: >-
      setup-node cache mode. Default caches the pnpm store. Pass "" in jobs that
      never install: setup-node's post step fails the job when it tries to save
      a store directory that no install created — which is exactly what happens
      on the first run after any lockfile change, when no cache exists yet.
    required: false
    default: pnpm
  install-command:
    description: Dependency install command.
    required: false
    default: pnpm install --frozen-lockfile
  verify-supply-chain:
    description: Verify repository supply-chain policy before lifecycle scripts run.
    required: false
    default: "false"
  registry-url:
    description: Optional package registry URL for npm publishing.
    required: false
    default: ""
  scope:
    description: Optional package scope for scoped registry publishing.
    required: false
    default: ""
  turbo-cache:
    description: >-
      Share Turbo's local cache (.turbo/cache) between CI jobs and runs.
      "restore" reads the newest entry; "save" also writes this job's cache
      when it ends. Only jobs whose Turbo work stops at packages save: package
      builds are ~60 MB, an app's .next output is not, and the repository's
      Actions cache is already at GitHub's 10 GB ceiling. "" (default) skips it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Restore Turbo cache
      if: inputs.turbo-cache == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .turbo/cache
        key: turbo-pkgs-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-pkgs-${{ runner.os }}-

    - name: Restore and save Turbo cache
      if: inputs.turbo-cache == 'save'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .turbo/cache
        key: turbo-pkgs-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-pkgs-${{ runner.os }}-

    # The policy verifier uses the pinned YAML parser. Bootstrap it with all
    # lifecycle scripts disabled, then gate the normal install and rebuild.
    - name: Bootstrap policy dependencies without lifecycle scripts
      if: inputs.verify-supply-chain == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Verify supply-chain policy
      if: inputs.verify-supply-chain == 'true'
      shell: bash
      run: node scripts/verify-supply-chain-policy.mjs

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: ${{ inputs.install-command }}

    - name: Build approved pending dependencies
      if: inputs.install == 'true' && inputs.verify-supply-chain == 'true' && !contains(inputs.install-command, '--ignore-scripts')
      shell: bash
      run: pnpm rebuild --pending
