name: Point status DNS to Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Upsert status.nebutra.com → Vercel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          bash infra/ops/scripts/point-status-dns-vercel.sh
      - name: Smoke status host (must stay on status.nebutra.com)
        run: |
          set -euo pipefail
          host_of() { printf '%s' "$1" | sed -E 's#^https?://([^/]+).*#\1#'; }
          for i in 1 2 3 4 5 6 7 8; do
            read -r code final < <(curl -sSL -o /tmp/status.html \
              -w '%{http_code} %{url_effective}\n' --max-time 25 https://status.nebutra.com/ 2>/dev/null || echo "000 -")
            echo "try $i -> $code $final"
            if [ "$code" = "200" ] && [ "$(host_of "$final")" = "status.nebutra.com" ]; then
              head -c 400 /tmp/status.html; echo
              exit 0
            fi
            if [ "$code" = "200" ]; then
              echo "::warning::status left its host: ended on $final"
            fi
            sleep 12
          done
          echo "::warning::DNS may be set but Vercel domain binding not ready yet"
          curl -sSI --max-time 15 https://status.nebutra.com/ || true
          exit 0
