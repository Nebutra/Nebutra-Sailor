name: Deploy Auth Center (Cloudflare Workers)

# Production path for auth.nebutra.com: OpenNext → Worker + Assets.
# Replaces Vercel Hobby as the overseas host for Google OAuth token exchange.
# PlanetScale Postgres via Hyperdrive binding (same config as gateway).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/auth/**"
      - "packages/iam/auth/**"
      - "packages/platform/db/**"
      - "packages/platform/i18n/**"
      - "packages/design/brand/**"
      - "packages/design/ui/**"
      - "packages/design/tokens/**"
      - "packages/design/icons/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-auth-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: deploy-auth-cloudflare-production
  cancel-in-progress: true

jobs:
  cloudflare:
    name: OpenNext → Cloudflare Workers
    runs-on: ubuntu-latest
    # Default production path when DEPLOY_TARGET_AUTH is cloudflare-* or unset
    # after cutover. Vercel remains optional via deploy-auth-vercel.yml only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.DEPLOY_TARGET_AUTH == 'cloudflare-workers' ||
      vars.DEPLOY_TARGET_AUTH == 'cloudflare-pages' ||
      vars.DEPLOY_TARGET_AUTH == ''
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-node-pnpm

      # Workspace packages export dist/ (gitignored). Same as typelens / sailor-docs.
      - name: Build workspace dependencies
        run: pnpm turbo build --filter="@nebutra/auth-center^..."

      - name: Build OpenNext worker
        working-directory: apps/auth
        env:
          # Build-time placeholders; runtime uses Hyperdrive + wrangler secrets.
          DATABASE_URL: "postgresql://build-placeholder:placeholder@localhost:5432/build"
          BETTER_AUTH_SECRET: "build-placeholder-secret-not-for-production-use-32b"
          BETTER_AUTH_URL: "https://auth.nebutra.com"
          NEXT_PUBLIC_AUTH_URL: "https://auth.nebutra.com"
          NEXT_PUBLIC_APP_URL: "https://app.nebutra.com"
          AUTH_COOKIE_DOMAIN: ".nebutra.com"
          AUTH_PROVIDER: "better-auth"
          NEXT_PUBLIC_AUTH_PROVIDER: "better-auth"
          OPEN_NEXT_BUILD: "true"
          CI: "true"
        run: |
          set -euo pipefail
          pnpm exec opennextjs-cloudflare build

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/auth
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_WORKERS_API_TOKEN missing"; exit 1; }
          set +e
          out=$(pnpm exec wrangler deploy --config wrangler.jsonc 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            if echo "$out" | grep -qiE 'size limit of 3 MiB|code: 10027'; then
              echo "::error::Worker gzip size exceeds Free plan 3 MiB (auth OpenNext ~8–9 MiB)."
              echo "::error::Enable Workers Paid (\$5/mo → 10 MiB limit) for account a4248a5738df319996a70092fe598d37:"
              echo "::error::  https://dash.cloudflare.com/a4248a5738df319996a70092fe598d37/workers/plans"
              echo "::error::Then re-run: gh workflow run deploy-auth-cloudflare.yml"
            fi
            exit "$code"
          fi

      # Runtime secrets (Hyperdrive covers DB when bound; secrets are OAuth + session).
      # Prefer GitHub secrets; if BETTER_AUTH_SECRET missing, pull once from the
      # legacy Vercel project so session crypto matches existing cookies / RPs.
      - name: Sync Worker secrets from GitHub (+ Vercel fallback for session secret)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID || secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET || secrets.GITHUB_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY || secrets.TURNSTILE_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_AUTH_PROJECT_ID: ${{ secrets.VERCEL_AUTH_PROJECT_ID || vars.VERCEL_AUTH_PROJECT_ID }}
          ECS_HOST: ${{ vars.ECS_HOST || '106.15.4.31' }}
          ECS_USER: ${{ vars.ECS_USER || 'root' }}
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_SSH_KNOWN_HOSTS: ${{ secrets.ECS_SSH_KNOWN_HOSTS }}
        working-directory: apps/auth
        run: |
          set -euo pipefail
          # Bridge session secret from legacy hosts when GH secret is absent.
          if [ -z "${BETTER_AUTH_SECRET:-}" ] && [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_AUTH_PROJECT_ID:-}" ]; then
            echo "BETTER_AUTH_SECRET missing in GH — try Vercel env decrypt"
            BETTER_AUTH_SECRET=$(
              python3 <<'PY'
          import json, os, urllib.error, urllib.request
          token = os.environ["VERCEL_TOKEN"]
          project = os.environ["VERCEL_AUTH_PROJECT_ID"]
          team = os.environ.get("VERCEL_ORG_ID") or ""
          q = f"?teamId={team}" if team.startswith("team_") else ""
          headers = {"Authorization": f"Bearer {token}"}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          try:
              data = get(f"https://api.vercel.com/v9/projects/{project}/env{q}")
          except Exception as e:
              print("", end="")
              raise SystemExit(0) from e
          for row in data.get("envs") or []:
              if row.get("key") != "BETTER_AUTH_SECRET":
                  continue
              val = (row.get("value") or "").strip()
              if val:
                  print(val, end="")
                  raise SystemExit(0)
              eid = row.get("id")
              if not eid:
                  continue
              # Encrypted env values need decrypt=true
              sep = "&" if q else "?"
              try:
                  dec = get(f"https://api.vercel.com/v1/env/{eid}{q}{sep}decrypt=true")
                  val = (dec.get("value") or "").strip()
                  if val:
                      print(val, end="")
                      raise SystemExit(0)
              except Exception:
                  pass
              try:
                  dec = get(f"https://api.vercel.com/v9/projects/{project}/env/{eid}{q}{sep}decrypt=true")
                  val = (dec.get("value") or "").strip()
                  if val:
                      print(val, end="")
              except Exception:
                  pass
              break
          PY
            ) || true
            if [ -n "${BETTER_AUTH_SECRET:-}" ]; then
              echo "recovered BETTER_AUTH_SECRET from Vercel (length=${#BETTER_AUTH_SECRET})"
            else
              echo "Vercel decrypt did not yield BETTER_AUTH_SECRET"
            fi
          fi
          if [ -z "${BETTER_AUTH_SECRET:-}" ] && [ -n "${ECS_SSH_PRIVATE_KEY:-}" ]; then
            echo "try ECS /var/www/nebutra/auth .env for BETTER_AUTH_SECRET"
            mkdir -p ~/.ssh
            printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > ~/.ssh/ecs_key
            chmod 600 ~/.ssh/ecs_key
            if [ -n "${ECS_SSH_KNOWN_HOSTS:-}" ]; then
              printf '%s\n' "$ECS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            else
              ssh-keyscan -T 10 -H "$ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            fi
            BETTER_AUTH_SECRET=$(
              ssh -i ~/.ssh/ecs_key -o BatchMode=yes -o ConnectTimeout=15 \
                "${ECS_USER}@${ECS_HOST}" \
                "set -e; for f in /var/www/nebutra/auth/current/.env /var/www/nebutra/auth/.env /var/www/nebutra/apps/auth/.env; do
                   [ -f \"\$f\" ] || continue
                   grep -E '^BETTER_AUTH_SECRET=' \"\$f\" | head -1 | cut -d= -f2- | tr -d '\"' | tr -d \"'\"
                   break
                 done" 2>/dev/null || true
            )
            rm -f ~/.ssh/ecs_key
            if [ -n "${BETTER_AUTH_SECRET:-}" ]; then
              echo "recovered BETTER_AUTH_SECRET from ECS (length=${#BETTER_AUTH_SECRET})"
            else
              echo "ECS did not yield BETTER_AUTH_SECRET"
            fi
          fi
          put() {
            local name="$1" value="${2:-}"
            if [ -z "$value" ]; then
              echo "skip secret $name (empty)"
              return 0
            fi
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --config wrangler.jsonc
            echo "set secret $name"
          }
          put BETTER_AUTH_SECRET "${BETTER_AUTH_SECRET:-}"
          put GOOGLE_CLIENT_ID "${GOOGLE_CLIENT_ID:-}"
          put GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET:-}"
          put GITHUB_CLIENT_ID "${GITHUB_CLIENT_ID:-}"
          put GITHUB_CLIENT_SECRET "${GITHUB_CLIENT_SECRET:-}"
          put DATABASE_URL "${DATABASE_URL:-}"
          put TURNSTILE_SECRET_KEY "${TURNSTILE_SECRET_KEY:-}"
          if [ -z "${BETTER_AUTH_SECRET:-}" ]; then
            echo "::warning::BETTER_AUTH_SECRET still unset — Worker session crypto will fail until set"
          fi

      - name: Smoke workers.dev + optional custom host
        run: |
          set -euo pipefail
          # workers.dev can lag a few seconds after first deploy
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/ah.json -w '%{http_code}' --max-time 30 \
              https://nebutra-auth.nebutra.workers.dev/health || echo 000)
            echo "try $i workers.dev/health -> $code"
            if [ "$code" = "200" ]; then
              head -c 500 /tmp/ah.json || true
              echo
              break
            fi
            sleep 8
          done
          code=$(curl -sS -o /tmp/ag.json -w '%{http_code}' --max-time 45 \
            'https://nebutra-auth.nebutra.workers.dev/health?probe=google' || echo 000)
          echo "GET workers.dev health?probe=google -> $code"
          if [ "$code" = "200" ]; then
            python3 -c 'import json; d=json.load(open("/tmp/ag.json")); print(json.dumps((d.get("oauth") or {}).get("googlePairing"), indent=2))' || true
          fi
          # Custom host only healthy after DNS points at Worker (not Vercel).
          code=$(curl -sS -o /tmp/ac.json -w '%{http_code}' --max-time 20 \
            https://auth.nebutra.com/health || echo 000)
          echo "GET auth.nebutra.com/health -> $code (may still be Vercel until DNS cutover)"

      - name: Point DNS auth → Worker (soft-fail if token lacks DNS Edit)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bash infra/ops/scripts/point-auth-dns-cloudflare-worker.sh
