name: i18n Translate (SenseNova)

# Global concurrent localization for ALL product message catalogs.
# Language wheel SSOT: packages/platform/i18n PRODUCT_LANGUAGES (~34 langs).
# Chinese is CLDR script-split: zh-Hans + zh-Hant (never bare zh catalogs).
#
# Catalogs:
#   - apps/landing/messages
#   - packages/platform/i18n/locales
#   - apps/tsekaluk-dev/messages
#   - apps/forge/messages
#   - apps/router/messages
#
# Provider: SenseNova Token Plan small model
#   Base:  https://token.sensenova.cn/v1
#   Model: sensenova-6.7-flash-lite (+ thinking.disabled)
#   Docs:  https://github.com/OpenSenseNova/SenseNova6.7/blob/main/API_CN.md
#
# Secrets: SENSENOVA_API_KEY
#
# Concurrency knobs (workflow_dispatch overridable):
#   CATALOG_CONCURRENCY=3  LOCALE_CONCURRENCY=6  CONCURRENCY=24  BATCH_SIZE=20

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate all strings"
        required: false
        default: "false"
      catalog:
        description: "Catalog filter (landing|web|tsekaluk-dev|forge|router|all)"
        required: false
        default: "all"
      concurrency:
        description: "Per-locale batch concurrency"
        required: false
        default: "24"
      batch_size:
        description: "Strings per request"
        required: false
        default: "20"
  push:
    branches: [main]
    paths:
      - "apps/landing/messages/en.json"
      - "packages/platform/i18n/locales/en.json"
      - "apps/tsekaluk-dev/messages/en.json"
      - "apps/forge/messages/en.json"
      - "apps/router/messages/en.json"
      - "scripts/i18n-translate-sensenova.mjs"
      - "scripts/i18n-seed-product-locales.mjs"
      - ".github/workflows/i18n-translate.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-translate-global
  cancel-in-progress: true

jobs:
  translate:
    name: Translate all product catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Require SENSENOVA_API_KEY
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
        run: |
          if [ -z "${SENSENOVA_API_KEY:-}" ]; then
            echo "::error::SENSENOVA_API_KEY secret is not set"
            exit 1
          fi

      - name: Smoke SenseNova Token Plan (flash-lite, thinking off)
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
        run: |
          code=$(curl -sS -m 45 -o /tmp/sn-smoke.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SENSENOVA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"model":"sensenova-6.7-flash-lite","max_tokens":64,"temperature":0.2,"thinking":{"type":"disabled"},"messages":[{"role":"user","content":"Translate to zh-Hans, output only: Hello"}]}' \
            "https://token.sensenova.cn/v1/chat/completions")
          echo "smoke HTTP=$code"
          head -c 800 /tmp/sn-smoke.json; echo
          test "$code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/sn-smoke.json"))
          c=d["choices"][0]["message"].get("content") or ""
          assert c.strip(), "empty content"
          print("smoke content:", c.strip()[:80])
          PY

      - name: Seed missing PRODUCT_LANGUAGES catalogs
        run: node scripts/i18n-seed-product-locales.mjs

      - name: Concurrent global translate (full wheel)
        # continue-on-error: Token Plan quota may exhaust mid-run; still commit partial catalogs.
        continue-on-error: true
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          SENSENOVA_BASE_URL: https://token.sensenova.cn/v1
          SENSENOVA_TRANSLATE_MODEL: sensenova-6.7-flash-lite
          # Conservative defaults so forge/router shell catalogs finish before quota dies
          CATALOG_CONCURRENCY: "2"
          LOCALE_CONCURRENCY: "4"
          CONCURRENCY: ${{ github.event.inputs.concurrency || '8' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '16' }}
          MAX_RETRIES: "3"
        run: |
          EXTRA=()
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA+=(--force)
          fi
          CAT="${{ github.event.inputs.catalog || 'all' }}"
          if [ -n "$CAT" ] && [ "$CAT" != "all" ]; then
            EXTRA+=(--catalog "$CAT")
          fi
          # Prefer product shell catalogs first when running "all"
          if [ "$CAT" = "all" ] || [ -z "$CAT" ]; then
            node scripts/i18n-translate-sensenova.mjs --catalog forge --catalog router "${EXTRA[@]}" || true
            node scripts/i18n-translate-sensenova.mjs --catalog web --catalog tsekaluk-dev --catalog landing "${EXTRA[@]}" || true
          else
            node scripts/i18n-translate-sensenova.mjs "${EXTRA[@]}"
          fi

      - name: Enable pnpm + install for i18n verify
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm install --frozen-lockfile --filter @nebutra/landing...

      - name: Verify landing i18n integrity
        run: pnpm --filter @nebutra/landing check:i18n

      - name: Push locale updates (branch + best-effort PR)
        uses: peter-evans/create-pull-request@v7
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(i18n): global auto-translate via SenseNova flash-lite"
          branch: chore/i18n-auto-translate
          delete-branch: false
          title: "chore(i18n): global auto-translate (PRODUCT_LANGUAGES wheel)"
          body: |
            Automated **global** localization across product message catalogs.

            Language wheel SSOT: `@nebutra/i18n` `PRODUCT_LANGUAGES` (~34 locales).
            Chinese: **zh-Hans** + **zh-Hant** (CLDR multi-script; never bare `zh`).

            | Catalog | Path |
            |---|---|
            | landing | `apps/landing/messages` |
            | web | `packages/platform/i18n/locales` |
            | tsekaluk-dev | `apps/tsekaluk-dev/messages` |
            | forge | `apps/forge/messages` |
            | router | `apps/router/messages` |

            - Provider: SenseNova Token Plan (`https://token.sensenova.cn/v1`)
            - Model: `sensenova-6.7-flash-lite` (`thinking.disabled`)
            - Runner: concurrent `scripts/i18n-translate-sensenova.mjs`
              (`CATALOG_CONCURRENCY` × `LOCALE_CONCURRENCY` × `CONCURRENCY` × `BATCH_SIZE`)
            - Docs: https://github.com/OpenSenseNova/SenseNova6.7/blob/main/API_CN.md
            - If PR creation is blocked by org policy, merge branch `chore/i18n-auto-translate` manually.
          labels: i18n, automated
