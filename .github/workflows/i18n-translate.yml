name: i18n Translate (SenseNova)

# Auto-localize apps/landing message catalogs when English source changes.
# High-concurrency translator → SenseNova Token Plan small model.
#
# Docs:
#   https://platform.sensenova.cn/docs
#   https://github.com/OpenSenseNova/SenseNova6.7/blob/main/API_CN.md
#   Base: https://token.sensenova.cn/v1
#   Model: sensenova-6.7-flash-lite (+ thinking disabled)
#
# Secrets:
#   SENSENOVA_API_KEY — Token Plan API key
#
# Concurrency env (defaults tuned for Token Plan free tier + GH runner):
#   CONCURRENCY=24          parallel batches per locale
#   LOCALE_CONCURRENCY=6    locales in parallel
#   BATCH_SIZE=20           strings per API call

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate all strings (ignore lock / existing)"
        required: false
        default: "false"
      concurrency:
        description: "Per-locale batch concurrency"
        required: false
        default: "24"
      batch_size:
        description: "Strings per request"
        required: false
        default: "20"
  push:
    branches: [main]
    paths:
      - "apps/landing/messages/en.json"
      - "apps/landing/scripts/translate-sensenova.mjs"
      - ".github/workflows/i18n-translate.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-translate-landing
  cancel-in-progress: true

jobs:
  translate:
    name: Translate landing locales
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install workspace (landing only)
        run: pnpm install --frozen-lockfile --filter @nebutra/landing...

      - name: Require SENSENOVA_API_KEY
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
        run: |
          if [ -z "${SENSENOVA_API_KEY:-}" ]; then
            echo "::error::SENSENOVA_API_KEY secret is not set"
            exit 1
          fi

      - name: Smoke SenseNova Token Plan (flash-lite, thinking off)
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
        run: |
          code=$(curl -sS -m 45 -o /tmp/sn-smoke.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SENSENOVA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"model":"sensenova-6.7-flash-lite","max_tokens":64,"temperature":0.2,"thinking":{"type":"disabled"},"messages":[{"role":"user","content":"Translate to zh, output only: Hello"}]}' \
            "https://token.sensenova.cn/v1/chat/completions")
          echo "smoke HTTP=$code"
          head -c 800 /tmp/sn-smoke.json; echo
          test "$code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/sn-smoke.json"))
          c=d["choices"][0]["message"].get("content") or ""
          assert c.strip(), "empty content"
          print("smoke content:", c.strip()[:80])
          PY

      - name: Concurrent translate (SenseNova flash-lite)
        working-directory: apps/landing
        env:
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          SENSENOVA_BASE_URL: https://token.sensenova.cn/v1
          SENSENOVA_TRANSLATE_MODEL: sensenova-6.7-flash-lite
          CONCURRENCY: ${{ github.event.inputs.concurrency || '24' }}
          LOCALE_CONCURRENCY: "6"
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
          MAX_RETRIES: "4"
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA="--force"
          fi
          node scripts/translate-sensenova.mjs $EXTRA

      - name: Verify i18n key integrity
        run: pnpm --filter @nebutra/landing check:i18n

      - name: Open PR with locale updates
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(i18n): auto-translate landing locales via SenseNova flash-lite"
          branch: chore/i18n-auto-translate
          delete-branch: true
          title: "chore(i18n): auto-translate landing locales (SenseNova flash-lite)"
          body: |
            Automated localization for `apps/landing/messages/*`.

            - Provider: SenseNova **Token Plan** (`https://token.sensenova.cn/v1`)
            - Model: `sensenova-6.7-flash-lite` (small, `thinking.disabled`)
            - Runner: concurrent `scripts/translate-sensenova.mjs`
              (`CONCURRENCY` batches × `LOCALE_CONCURRENCY` locales × `BATCH_SIZE` strings)
            - Source: `en.json` → zh / ja / ko / es / fr / de
            - Docs: https://github.com/OpenSenseNova/SenseNova6.7/blob/main/API_CN.md

            Triggered by English source changes or manual `workflow_dispatch`.
          labels: i18n, automated
