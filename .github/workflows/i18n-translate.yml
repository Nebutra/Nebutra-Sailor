name: i18n Translate (Router)

# Fills every catalog's untranslated and stale strings through our own Router —
# never part of the main CI gate.
#
#   main CI / pre-push  → pnpm i18n:check (structure: ICU, copies, dead keys)
#   this workflow       → pnpm i18n:sync, then scripts/i18n-translate.mjs, then a PR
#
# Work per locale = keys absent from <locale>.json + keys i18n.lock.json marks
# stale because their English changed. Nothing else is re-sent, so a run after
# a one-line en.json edit makes ~33 small calls.
#
# Credential: SERVICE_SECRET — the secret the gateway and Router already share.
# The script mints a 5-minute service token and calls Router's internal relay
# (apps/router/src/app/api/internal/v1/chat/completions). No provider key, no
# new secret. Model pool: repo variable I18N_TRANSLATE_MODELS, else the
# script's default.
#
# Catalog list and language wheel: scripts/i18n-catalogs.mjs and
# @nebutra/i18n PRODUCT_LANGUAGES — nothing to keep in sync here except the
# push paths below, which are every catalog's en.json.

on:
  workflow_dispatch:
    inputs:
      catalog:
        description: "Catalog id (landing|web|forge|boot-log|ui|router) or all"
        required: false
        default: "all"
      locales:
        description: "Space-separated locales, e.g. 'ja zh-Hans'. Empty = the whole wheel."
        required: false
        default: ""
      max_batches:
        description: "Cap batches per locale (empty = no cap). A capped run resumes next time."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "apps/landing/messages/en.json"
      - "packages/platform/i18n/locales/en.json"
      - "packages/platform/i18n/boot-log/en.json"
      - "packages/platform/i18n/ui-labels/en.json"
      - "apps/forge/messages/en.json"
      - "apps/router/messages/en.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-translate
  # Queue, never kill: two quick pushes used to cancel each other and leave no
  # run that finished. Each run only translates what is still missing, so a
  # queued run after a finished one is cheap.
  cancel-in-progress: false

jobs:
  translate:
    name: Translate missing and stale strings
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: Require SERVICE_SECRET
        env:
          SERVICE_SECRET: ${{ secrets.SERVICE_SECRET }}
        run: |
          if [ -z "${SERVICE_SECRET:-}" ]; then
            echo "::error::SERVICE_SECRET is not set — it is the gateway/Router shared secret."
            exit 1
          fi

      - name: Normalise catalogs and mark stale translations
        run: pnpm i18n:sync

      - name: Translate through Router
        env:
          SERVICE_SECRET: ${{ secrets.SERVICE_SECRET }}
          I18N_TRANSLATE_MODELS: ${{ vars.I18N_TRANSLATE_MODELS }}
          CATALOG: ${{ github.event.inputs.catalog || 'all' }}
          LOCALES: ${{ github.event.inputs.locales }}
          MAX_BATCHES: ${{ github.event.inputs.max_batches }}
          # Stop starting batches at 200 min: the job cap is 240, and gate + PR
          # must still run. A run cut off by timeout-minutes loses everything.
          I18N_DEADLINE_MINUTES: "200"
          LOCALE_CONCURRENCY: "4"
        run: |
          set -uo pipefail
          ARGS=()
          if [ -n "$CATALOG" ] && [ "$CATALOG" != "all" ]; then ARGS+=(--catalog "$CATALOG"); fi
          for loc in $LOCALES; do ARGS+=(--locale "$loc"); done
          if [ -n "$MAX_BATCHES" ]; then ARGS+=(--max-batches "$MAX_BATCHES"); fi
          # Exit 1 = refused credential or crash before anything was written:
          # fail. Exit 2 = nothing could be translated this run; exit 3 = stopped
          # early with finished locales on disk. Both keep going — what was done
          # still deserves the PR, and the next run resumes from what is absent.
          code=0
          node scripts/i18n-translate.mjs "${ARGS[@]}" || code=$?
          echo "translate exit=$code"
          if [ "$code" = "1" ]; then exit 1; fi
          if [ "$code" = "3" ]; then echo "::warning::Translation stopped early; opening a PR with the locales it finished."; fi

      # The PR must never carry something the gate would reject.
      - name: Gate the result
        run: pnpm i18n:check

      - name: Open or update the locale PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing translated."
            exit 0
          fi
          BRANCH=chore/i18n-auto-translate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A apps packages i18n.lock.json i18n-confirmed-identical.json
          git commit -m "chore(i18n): translate missing and stale strings via Router"
          # Replace the branch: it is regenerated from main on every run, and a
          # stale one would carry an older main's workflow files, which
          # GITHUB_TOKEN may not push.
          git push -f origin "$BRANCH"
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing updated."
            exit 0
          fi
          if ! gh pr create --base main --head "$BRANCH" \
              --title "chore(i18n): translate missing and stale strings" \
              --label i18n --label automated \
              --body "Filled by the i18n Translate workflow through Router. Gated by \`pnpm i18n:check\` before push." 2>/tmp/pr-err; then
            if grep -qi "not permitted to create or approve pull requests" /tmp/pr-err; then
              echo "::warning::Actions may not open PRs in this org — merge '$BRANCH' by hand."
            else
              cat /tmp/pr-err
              exit 1
            fi
          fi
