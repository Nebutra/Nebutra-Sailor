name: Point leak DNS zone (authoritative)

# Delegates leak.nebutra.com → ECS authoritative forge-dns-leak (DNS-only glue).
# Never orange-cloud ns1.leak — that hides recursive source IPs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Upsert NS + glue for leak.nebutra.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_NAME: nebutra.com
          ORIGIN_IP: ${{ vars.ECS_HOST || vars.VM_HOST || '106.15.4.31' }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          bash infra/ops/scripts/point-leak-zone-dns.sh
      - name: Verify delegation (public dig)
        run: |
          set -euo pipefail
          ORIGIN="${{ vars.ECS_HOST || vars.VM_HOST || '106.15.4.31' }}"
          echo "=== NS leak.nebutra.com ==="
          dig NS leak.nebutra.com +short || true
          echo "=== A ns1.leak.nebutra.com ==="
          dig A ns1.leak.nebutra.com +short || true
          echo "=== SOA @origin (may fail until forge-dns-leak listens on :53) ==="
          dig @"$ORIGIN" SOA leak.nebutra.com +norecurse +time=3 || true
