name: Ops — copy landing runtime env from Vercel to Fly

# One-shot migration helper (2026-09-22). Landing's runtime secrets lived only
# in the nebutra-landing Vercel project; this reads the whitelisted server keys
# and imports them onto the nebutra-landing Machine. Values are never printed —
# the step summary lists key names and whether a value was found.
#
# Delete this workflow once the Vercel projects are gone.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Copy whitelisted env to the Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          # Fallbacks that already live in GitHub and are known-good on Fly.
          GH_UPSTASH_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          GH_UPSTASH_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # The Fly docs origin is the value this deployment must carry; the
          # Vercel project's copy pointed at the old Vercel-hosted docs.
          DOCS_UPSTREAM_ORIGIN: https://nebutra-docs.fly.dev
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN missing"; exit 1; }
          python3 <<'PY' > /tmp/landing-secrets.env
          import json, os, urllib.request, urllib.error

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ.get("VERCEL_ORG_ID") or ""
          api = "https://api.vercel.com"

          def get(path):
              req = urllib.request.Request(
                  api + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)

          # Resolve the landing project by name.
          q = f"?teamId={team}&limit=100" if team else "?limit=100"
          projects = get(f"/v9/projects{q}").get("projects") or []
          candidates = ("nebutra-landing", "landing", "nebutra-landing-page", "landing-page")
          project = next((p for p in projects if p.get("name") in candidates), None)
          if not project:
              raise SystemExit("landing Vercel project not found: " + ", ".join(p.get("name","") for p in projects))

          sep = "&" if q else "?"
          envs = get(f"/v10/projects/{project['id']}/env{q}").get("envs") or []

          WANTED = {
              "RESEND_API_KEY", "RESEND_AUDIENCE_ID", "CONTACT_FORM_TO",
              "UPSTASH_REDIS_REST_URL", "UPSTASH_REDIS_REST_TOKEN",
              "STATUS_ADMIN_TOKEN", "SANITY_API_TOKEN",
          }

          def value_of(row):
              val = (row.get("value") or "").strip()
              if val:
                  return val
              if row.get("type") != "encrypted" or not row.get("id"):
                  return ""
              for path in (
                  f"/v1/env/{row['id']}{q}{sep}decrypt=true",
                  f"/v9/projects/{project['id']}/env/{row['id']}{q}{sep}decrypt=true",
              ):
                  try:
                      val = (get(path).get("value") or "").strip()
                      if val:
                          return val
                  except Exception:
                      continue
              return ""

          found, missing = {}, []
          for key in sorted(WANTED):
              rows = [r for r in envs if r.get("key") == key]
              # Prefer the production target when a key is scoped.
              rows.sort(key=lambda r: 0 if "production" in (r.get("target") or []) else 1)
              val = next((value_of(r) for r in rows if value_of(r)), "")
              if val:
                  found[key] = val
              else:
                  missing.append(key)

          # GitHub fallbacks for the shared Upstash credentials.
          found.setdefault("UPSTASH_REDIS_REST_URL", os.environ.get("GH_UPSTASH_URL", ""))
          found.setdefault("UPSTASH_REDIS_REST_TOKEN", os.environ.get("GH_UPSTASH_TOKEN", ""))
          # This deployment's own docs origin wins over whatever Vercel had.
          found["DOCS_UPSTREAM_ORIGIN"] = os.environ["DOCS_UPSTREAM_ORIGIN"]

          def dotenv(value):
              if value and all(c.isalnum() or c in "_./:+-" for c in value):
                  return value
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'

          for key, val in found.items():
              if not val or "\n" in val:
                  continue
              print(f"{key}={dotenv(val)}")

          import sys
          print("FOUND " + ",".join(sorted(k for k, v in found.items() if v)), file=sys.stderr)
          print("MISSING " + ",".join(missing), file=sys.stderr)
          PY
          echo "--- keys to import (names only) ---"
          cut -d= -f1 /tmp/landing-secrets.env
          if [ ! -s /tmp/landing-secrets.env ]; then
            echo "::warning::nothing to import"
            exit 0
          fi
          flyctl secrets import -a nebutra-landing < /tmp/landing-secrets.env
          rm -f /tmp/landing-secrets.env
