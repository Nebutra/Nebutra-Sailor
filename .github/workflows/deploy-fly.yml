name: Deploy origin apps to Fly

# Replaces the Aliyun ECS PM2 product edges with Fly Machines (Singapore).
# The Hono api-gateway is a different image — see deploy-fly-gateway.yml.
# Landing, gateway-edge, and auth-edge stay where they are.
# SSO / admin / docs ship as Next Machines here. Carina, New-API, and
# leak DNS are separate Fly apps (deploy-carina-fly.yml,
# deploy-new-api-fly.yml, deploy-dns-leak-fly.yml).
# This workflow deploys Machines; DNS cutover is a separate workflow_dispatch
# input so a failed image cannot take production down.
#
# REQUIRED: repository secret FLY_API_TOKEN (deploy-scoped). There is no
# fallback. The leaked chat tokens were revoked and must not be reused.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to deploy (space-separated: forge router web pebble design kuanlan idp admin sailor-docs gateway cache carina new-api dns-leak). Empty = Next edges. gateway is the Hono origin. cache only sets Upstash on the origin. carina / new-api / dns-leak are the remaining ECS leftovers."
        required: false
        default: ""
      cutover:
        description: "After a healthy Fly URL, point Cloudflare DNS at <app>.fly.dev"
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main]
    paths:
      - "apps/forge/**"
      - "apps/router/**"
      - "apps/web/**"
      - "apps/pebble/**"
      - "apps/design/**"
      - "apps/kuanlan/**"
      - "apps/idp/**"
      - "apps/admin/**"
      - "apps/sailor-docs/**"
      - "packages/ai/forge-runtime/**"
      - "packages/platform/router-supply/**"
      - "packages/design/**"
      - "infra/fly/**"
      - "infra/runtime/docker/Dockerfile.standalone"
      - ".github/workflows/deploy-fly.yml"

permissions:
  contents: read

concurrency:
  group: deploy-fly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Resolve apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.resolve.outputs.apps }}
      want_gateway: ${{ steps.resolve.outputs.want_gateway }}
      want_cache: ${{ steps.resolve.outputs.want_cache }}
      want_carina: ${{ steps.resolve.outputs.want_carina }}
      want_new_api: ${{ steps.resolve.outputs.want_new_api }}
      want_dns_leak: ${{ steps.resolve.outputs.want_dns_leak }}
    steps:
      - id: resolve
        env:
          INPUT_APPS: ${{ github.event.inputs.apps }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          all_apps = [
            {"app":"forge","package":"@nebutra/forge","workspace":"apps/forge","build_command":"build","fly_app":"nebutra-forge","host":"forge","site":"https://forge.nebutra.com"},
            {"app":"router","package":"@nebutra/router","workspace":"apps/router","build_command":"build","fly_app":"nebutra-router","host":"router","site":"https://router.nebutra.com"},
            {"app":"web","package":"@nebutra/web","workspace":"apps/web","build_command":"build:next","fly_app":"nebutra-web","host":"app","site":"https://app.nebutra.com"},
            {"app":"pebble","package":"@nebutra/pebble-site","workspace":"apps/pebble","build_command":"build","fly_app":"nebutra-pebble","host":"pebble","site":"https://pebble.nebutra.com"},
            {"app":"design","package":"@nebutra/design","workspace":"apps/design","build_command":"build","fly_app":"nebutra-design","host":"design","site":"https://design.nebutra.com"},
            {"app":"kuanlan","package":"@nebutra/kuanlan","workspace":"apps/kuanlan","build_command":"build","fly_app":"nebutra-kuanlan","host":"kuanlan","site":"https://kuanlan.nebutra.com"},
            {"app":"idp","package":"@nebutra/idp","workspace":"apps/idp","build_command":"build","fly_app":"nebutra-idp","host":"sso","site":"https://sso.nebutra.com"},
            {"app":"admin","package":"@nebutra/admin","workspace":"apps/admin","build_command":"build","fly_app":"nebutra-admin","host":"admin","site":"https://admin.nebutra.com"},
            {"app":"sailor-docs","package":"@nebutra/sailor-docs","workspace":"apps/sailor-docs","build_command":"build:vm","fly_app":"nebutra-docs","host":"docs","site":"https://docs.nebutra.com"},
          ]
          wanted = [w for w in os.environ.get("INPUT_APPS", "").split() if w]
          known = {row["app"] for row in all_apps} | {"gateway", "cache", "carina", "new-api", "dns-leak"}
          missing = set(wanted) - known
          if missing:
              raise SystemExit(f"unknown apps: {sorted(missing)}")
          apps = all_apps if not wanted else [row for row in all_apps if row["app"] in wanted]
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write("apps<<EOF\n")
              fh.write(json.dumps(apps))
              fh.write("\nEOF\n")
              fh.write(f"want_gateway={'true' if 'gateway' in wanted else 'false'}\n")
              fh.write(f"want_cache={'true' if ('cache' in wanted or 'gateway' in wanted) else 'false'}\n")
              fh.write(f"want_carina={'true' if 'carina' in wanted else 'false'}\n")
              fh.write(f"want_new_api={'true' if 'new-api' in wanted else 'false'}\n")
              fh.write(f"want_dns_leak={'true' if 'dns-leak' in wanted else 'false'}\n")
          PY

  deploy:
    name: Fly ${{ matrix.app }}
    needs: matrix
    if: needs.matrix.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.apps) }}
    steps:
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Set repository secret FLY_API_TOKEN (deploy token). Chat tokens were revoked."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Ensure Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          org="$(bash infra/ops/scripts/resolve-fly-org.sh)"
          echo "FLY_ORG=$org" >> "$GITHUB_ENV"
          echo "using Fly org $org"
          if flyctl apps list --json | python3 -c "import json,sys; names={a.get('Name') or a.get('name') for a in json.load(sys.stdin)}; sys.exit(0 if '${{ matrix.fly_app }}' in names else 1)"; then
            echo "app ${{ matrix.fly_app }} exists"
          else
            flyctl apps create "${{ matrix.fly_app }}" --machines --org "$org" --yes
          fi

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build workspace dependencies
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm turbo build --filter="${{ matrix.package }}^..."

      - name: Build standalone
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_OUTPUT: standalone
          NEXT_PUBLIC_SITE_URL: ${{ matrix.site }}
          NEXT_PUBLIC_DOCS_ORIGIN_URL: ${{ matrix.site }}
          OIDC_ISSUER: "https://sso.nebutra.com"
          NEXT_PUBLIC_APP_URL: "https://app.nebutra.com"
          NEXT_PUBLIC_API_URL: "https://api.nebutra.com"
          NEXT_PUBLIC_API_GATEWAY_URL: "https://api.nebutra.com"
          NEXT_PUBLIC_AUTH_PROVIDER: "better-auth"
          DATABASE_URL: "postgresql://build-placeholder:placeholder@localhost:5432/build"
          REDIS_URL: "redis://localhost:6379"
        run: pnpm --filter ${{ matrix.package }} ${{ matrix.build_command }}

      - name: Assemble image context
        run: bash infra/ops/scripts/assemble-next-standalone.sh "${{ matrix.workspace }}" "$RUNNER_TEMP/stage-${{ matrix.app }}" "${{ matrix.app }}"

      - name: Import ECS env if present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VM_HOST: ${{ vars.VM_HOST || vars.ECS_HOST }}
          VM_USER: ${{ vars.VM_USER || vars.ECS_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY || secrets.ECS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VM_HOST:-}" ] || [ -z "${VM_SSH_PRIVATE_KEY:-}" ]; then
            echo "No VM SSH — skip secret import. Set fly secrets later."
            exit 0
          fi
          env_path="/var/www/nebutra/${{ matrix.app }}/.env"
          if [ "${{ matrix.app }}" = "web" ]; then env_path="/var/www/nebutra/web/.env"; fi
          if [ "${{ matrix.app }}" = "design" ]; then env_path="/var/www/nebutra/design/.env"; fi
          install -m 600 /dev/null "$RUNNER_TEMP/vm_key"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm_key"
          if ssh -i "$RUNNER_TEMP/vm_key" -o StrictHostKeyChecking=accept-new \
            "${VM_USER}@${VM_HOST}" "test -f $env_path"; then
            ssh -i "$RUNNER_TEMP/vm_key" -o StrictHostKeyChecking=accept-new \
              "${VM_USER}@${VM_HOST}" "cat $env_path" \
              | python3 -c '
          import sys
          skip = {"HOSTNAME", "PORT", "HOST", "PWD"}
          for line in sys.stdin:
              raw = line.strip()
              if not raw or raw.startswith("#"):
                  continue
              key = raw.split("=", 1)[0].strip()
              if key.startswith("export "):
                  key = key[7:].strip()
              if key in skip:
                  continue
              sys.stdout.write(line)
          ' | flyctl secrets import -a "${{ matrix.fly_app }}" --stage \
              || echo "::warning::fly secrets import failed for ${{ matrix.fly_app }}"
          else
            echo "No $env_path on VM — skip."
          fi
          rm -f "$RUNNER_TEMP/vm_key"
          flyctl secrets unset HOSTNAME PORT HOST -a "${{ matrix.fly_app }}" --stage \
            || echo "no leftover bind secrets"
          flyctl secrets set HOSTNAME=0.0.0.0 PORT=8080 -a "${{ matrix.fly_app }}" --stage

      - name: Set kuanlan consume secrets
        if: matrix.app == 'kuanlan'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ROUTER_API_KEY: ${{ secrets.KUANLAN_ROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          args=()
          [ -n "${ROUTER_API_KEY:-}" ] && args+=(ROUTER_API_KEY="$ROUTER_API_KEY")
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && args+=(CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID")
          [ -n "${R2_ACCESS_KEY_ID:-}" ] && args+=(R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID")
          [ -n "${R2_SECRET_ACCESS_KEY:-}" ] && args+=(R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY")
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::warning::No GitHub kuanlan secrets — relying on VM .env import."
            exit 0
          fi
          flyctl secrets set "${args[@]}" -a nebutra-kuanlan --stage

      - name: Deploy Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy "$RUNNER_TEMP/stage-${{ matrix.app }}" \
            --config "$GITHUB_WORKSPACE/infra/fly/${{ matrix.app }}.toml" \
            --dockerfile "$RUNNER_TEMP/stage-${{ matrix.app }}/Dockerfile" \
            --build-arg "APP_WORKSPACE=${{ matrix.workspace }}" \
            --ha=false \
            --remote-only \
            --yes

      - name: Smoke Fly URL
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          url="https://${{ matrix.fly_app }}.fly.dev/"
          code="000"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -L "$url" || echo 000)
            echo "GET $url try $i -> $code"
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "302" ]; then
              exit 0
            fi
            sleep 10
          done
          flyctl status -a "${{ matrix.fly_app }}" || true
          flyctl logs -a "${{ matrix.fly_app }}" --no-tail || true
          echo "::error::$url is not healthy ($code). DNS will not cut over."
          exit 1

      - name: Cut over Cloudflare DNS
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.cutover == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOST: ${{ matrix.host }}
          FLY_APP: ${{ matrix.fly_app }}
        run: bash infra/ops/scripts/point-host-dns-fly.sh

  deploy-gateway:
    name: Fly Hono origin
    needs: matrix
    if: needs.matrix.outputs.want_gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Set repository secret FLY_API_TOKEN (deploy token). Chat tokens were revoked."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Ensure Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          org="$(bash infra/ops/scripts/resolve-fly-org.sh)"
          echo "FLY_ORG=$org" >> "$GITHUB_ENV"
          echo "using Fly org $org"
          if flyctl apps list --json | python3 -c "import json,sys; names={a.get('Name') or a.get('name') for a in json.load(sys.stdin)}; sys.exit(0 if 'nebutra-gateway' in names else 1)"; then
            echo "app nebutra-gateway exists"
          else
            flyctl apps create nebutra-gateway --machines --org "$org" --yes
          fi

      - name: Import ECS api env if present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VM_HOST: ${{ vars.VM_HOST || vars.ECS_HOST }}
          VM_USER: ${{ vars.VM_USER || vars.ECS_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY || secrets.ECS_SSH_PRIVATE_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VM_HOST:-}" ] || [ -z "${VM_SSH_PRIVATE_KEY:-}" ]; then
            echo "No VM SSH — skip secret import. Set fly secrets later."
            exit 0
          fi
          env_path="/var/www/nebutra/api/.env"
          install -m 600 /dev/null "$RUNNER_TEMP/vm_key"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm_key"
          if ssh -i "$RUNNER_TEMP/vm_key" -o StrictHostKeyChecking=accept-new \
            "${VM_USER}@${VM_HOST}" "test -f $env_path"; then
            ssh -i "$RUNNER_TEMP/vm_key" -o StrictHostKeyChecking=accept-new \
              "${VM_USER}@${VM_HOST}" "cat $env_path" \
              | python3 -c '
          import sys
          skip = {"HOSTNAME", "PORT", "HOST", "PWD"}
          for line in sys.stdin:
              raw = line.strip()
              if not raw or raw.startswith("#"):
                  continue
              key = raw.split("=", 1)[0].strip()
              if key.startswith("export "):
                  key = key[7:].strip()
              if key in skip:
                  continue
              sys.stdout.write(line)
          ' | flyctl secrets import -a nebutra-gateway --stage \
              || echo "::warning::fly secrets import failed for nebutra-gateway"
          else
            echo "No $env_path on VM — skip."
          fi
          rm -f "$RUNNER_TEMP/vm_key"
          flyctl secrets unset HOSTNAME PORT HOST -a nebutra-gateway --stage \
            || echo "no leftover bind secrets"
          flyctl secrets set HOST=0.0.0.0 PORT=8080 -a nebutra-gateway --stage
          if [ -n "${UPSTASH_REDIS_REST_URL:-}" ] && [ -n "${UPSTASH_REDIS_REST_TOKEN:-}" ]; then
            flyctl secrets set \
              UPSTASH_REDIS_REST_URL="$UPSTASH_REDIS_REST_URL" \
              UPSTASH_REDIS_REST_TOKEN="$UPSTASH_REDIS_REST_TOKEN" \
              UPSTASH_REDIS_URL="$UPSTASH_REDIS_REST_URL" \
              UPSTASH_REDIS_TOKEN="$UPSTASH_REDIS_REST_TOKEN" \
              -a nebutra-gateway --stage
          else
            echo "::warning::UPSTASH_REDIS_* secrets missing — origin cache stays degraded"
          fi

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build Hono bundle
        run: |
          set -euo pipefail
          pnpm turbo build --filter="@nebutra/gateway^..." --filter=@nebutra/ui
          pnpm --filter @nebutra/gateway build
          STAGE="$RUNNER_TEMP/stage-gateway"
          rm -rf "$STAGE"
          pnpm --config.trust-policy=permissive deploy \
            --filter @nebutra/gateway --prod --legacy "$STAGE"
          node scripts/prepare-pnpm-deploy-node-runtime.mjs "$STAGE"
          node --check "$STAGE/dist/node.js"
          mkdir -p "$STAGE/node_modules/@nebutra/ui"
          cp packages/design/ui/package.json "$STAGE/node_modules/@nebutra/ui/"
          cp -R packages/design/ui/dist "$STAGE/node_modules/@nebutra/ui/dist"
          cp infra/runtime/docker/Dockerfile.gateway "$STAGE/Dockerfile"
          bash infra/ops/scripts/materialize-pnpm-deploy-bundle.sh "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Deploy Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy "$STAGE" \
            --config "$GITHUB_WORKSPACE/infra/fly/gateway.toml" \
            --dockerfile "$STAGE/Dockerfile" \
            --ha=false \
            --remote-only \
            --yes

      - name: Smoke Fly URL
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          url="https://nebutra-gateway.fly.dev/api/misc/health"
          code="000"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "GET $url try $i -> $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          flyctl status -a nebutra-gateway || true
          flyctl logs -a nebutra-gateway --no-tail || true
          echo "::error::$url is not healthy ($code). DNS will not cut over."
          exit 1

      - name: Cut over grey-cloud origin DNS
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.cutover == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOST: origin
          FLY_APP: nebutra-gateway
        run: bash infra/ops/scripts/point-origin-dns-fly.sh

  sync-gateway-cache:
    name: Fly origin cache (Upstash)
    needs: matrix
    if: needs.matrix.outputs.want_cache == 'true' && needs.matrix.outputs.want_gateway != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Point origin cache at Upstash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UPSTASH_REDIS_REST_URL:-}" ] || [ -z "${UPSTASH_REDIS_REST_TOKEN:-}" ]; then
            echo "::error::UPSTASH_REDIS_REST_URL / TOKEN secrets are not set"
            exit 1
          fi
          # ECS .env imported REDIS_URL=localhost and sometimes CACHE_BACKEND=ioredis.
          # Those win the health ping and keep the origin degraded.
          flyctl secrets unset REDIS_URL CACHE_BACKEND -a nebutra-gateway || true
          flyctl secrets set \
            UPSTASH_REDIS_REST_URL="$UPSTASH_REDIS_REST_URL" \
            UPSTASH_REDIS_REST_TOKEN="$UPSTASH_REDIS_REST_TOKEN" \
            UPSTASH_REDIS_URL="$UPSTASH_REDIS_REST_URL" \
            UPSTASH_REDIS_TOKEN="$UPSTASH_REDIS_REST_TOKEN" \
            -a nebutra-gateway

  deploy-carina:
    name: Fly carina static
    needs: matrix
    if: needs.matrix.outputs.want_carina == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Set repository secret FLY_API_TOKEN (deploy token)."
            exit 1
          fi

      - name: Checkout Sailor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Ensure Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          org="$(bash infra/ops/scripts/resolve-fly-org.sh)"
          echo "using Fly org $org"
          if flyctl apps list --json | python3 -c "import json,sys; names={a.get('Name') or a.get('name') for a in json.load(sys.stdin)}; sys.exit(0 if 'nebutra-carina' in names else 1)"; then
            echo "app nebutra-carina exists"
          else
            flyctl apps create nebutra-carina --machines --org "$org" --yes
          fi

      - name: Stage live dist from the VM
        env:
          VM_HOST: ${{ vars.VM_HOST || vars.ECS_HOST }}
          VM_USER: ${{ vars.VM_USER || vars.ECS_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY || secrets.ECS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Live site is the Nebutra/carina apps/docs dist already on the box.
          STAGE="$RUNNER_TEMP/stage-carina"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/html"
          if [ -n "${VM_HOST:-}" ] && [ -n "${VM_SSH_PRIVATE_KEY:-}" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/vm_key"
            printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm_key"
            ssh -i "$RUNNER_TEMP/vm_key" -o StrictHostKeyChecking=accept-new \
              "${VM_USER}@${VM_HOST}" \
              "tar -C /var/www/nebutra/carina/current -czf - ." \
              > "$RUNNER_TEMP/carina-dist.tgz"
            rm -f "$RUNNER_TEMP/vm_key"
            tar -C "$STAGE/html" -xzf "$RUNNER_TEMP/carina-dist.tgz"
            rm -f "$RUNNER_TEMP/carina-dist.tgz"
          fi
          if [ ! -f "$STAGE/html/index.html" ]; then
            echo "::error::No live carina dist on the VM. Fix Nebutra/carina main build, then retry."
            exit 1
          fi
          cp infra/fly/Dockerfile.carina "$STAGE/Dockerfile"
          cp infra/fly/carina.nginx.conf "$STAGE/nginx.conf"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Deploy Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy "$STAGE" \
            --config "$GITHUB_WORKSPACE/infra/fly/carina.toml" \
            --dockerfile "$STAGE/Dockerfile" \
            --ha=false \
            --remote-only \
            --yes

      - name: Smoke Fly URL
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          url="https://nebutra-carina.fly.dev/"
          llms="https://nebutra-carina.fly.dev/llms.txt"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            lcode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$llms" || echo 000)
            echo "try $i home=$code llms=$lcode"
            if [ "$code" = "200" ] && [ "$lcode" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          flyctl status -a nebutra-carina || true
          flyctl logs -a nebutra-carina --no-tail || true
          echo "::error::$url is not healthy. DNS will not cut over."
          exit 1

      - name: Cut over Cloudflare DNS
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.cutover == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOST: carina
          FLY_APP: nebutra-carina
        run: bash infra/ops/scripts/point-host-dns-fly.sh

  deploy-new-api:
    name: Fly new-api private
    needs: matrix
    if: needs.matrix.outputs.want_new_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Set repository secret FLY_API_TOKEN (deploy token)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Ensure Fly app and volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          org="$(bash infra/ops/scripts/resolve-fly-org.sh)"
          echo "using Fly org $org"
          if flyctl apps list --json | python3 -c "import json,sys; names={a.get('Name') or a.get('name') for a in json.load(sys.stdin)}; sys.exit(0 if 'nebutra-new-api' in names else 1)"; then
            echo "app nebutra-new-api exists"
          else
            flyctl apps create nebutra-new-api --machines --org "$org" --yes
          fi
          if flyctl volumes list -a nebutra-new-api --json | python3 -c 'import json,sys; vols=json.load(sys.stdin); sys.exit(0 if any((v.get("Name") or v.get("name"))=="new_api_data" for v in vols) else 1)'; then
            echo "volume new_api_data exists"
          else
            flyctl volumes create new_api_data -a nebutra-new-api --region sin --size 3 --yes
          fi
          flyctl ips list -a nebutra-new-api --json | python3 -c '
          import json, sys, subprocess
          for ip in json.load(sys.stdin):
              addr = ip.get("Address") or ip.get("address") or ""
              kind = (ip.get("Type") or ip.get("type") or "").lower()
              if not addr:
                  continue
              if "private" in kind or "privatenetwork" in kind or addr.startswith("fdaa:"):
                  continue
              print("releasing public", addr)
              subprocess.check_call(["flyctl", "ips", "release", addr, "-a", "nebutra-new-api", "--yes"])
          '

      - name: Import SESSION_SECRET from VM
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VM_HOST: ${{ vars.VM_HOST || vars.ECS_HOST }}
          VM_USER: ${{ vars.VM_USER || vars.ECS_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY || secrets.ECS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VM_HOST:-}" ] || [ -z "${VM_SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning::No VM SSH — set SESSION_SECRET on nebutra-new-api by hand."
            exit 0
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/vm_key"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm_key"
          secret=""
          if ssh -i "$RUNNER_TEMP/vm_key" -o StrictHostKeyChecking=accept-new \
            "${VM_USER}@${VM_HOST}" "test -f /var/www/nebutra/new-api/session.secret"; then
            secret="$(ssh -i "$RUNNER_TEMP/vm_key" -o StrictHostKeyChecking=accept-new \
              "${VM_USER}@${VM_HOST}" "cat /var/www/nebutra/new-api/session.secret")"
          fi
          rm -f "$RUNNER_TEMP/vm_key"
          if [ -z "$secret" ]; then
            echo "::warning::No session.secret on VM — New-API will generate its own."
            exit 0
          fi
          flyctl secrets set SESSION_SECRET="$secret" -a nebutra-new-api --stage
          unset secret

      - name: Deploy Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config "$GITHUB_WORKSPACE/infra/fly/new-api.toml" \
            --image calciumion/new-api:v0.8.7.4 \
            --ha=false \
            --remote-only \
            --yes

      - name: Copy VM /data onto the volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VM_HOST: ${{ vars.VM_HOST || vars.ECS_HOST }}
          VM_USER: ${{ vars.VM_USER || vars.ECS_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY || secrets.ECS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VM_HOST:-}" ] || [ -z "${VM_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Need VM SSH to copy New-API data."
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/vm_key"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm_key"
          ssh -i "$RUNNER_TEMP/vm_key" -o StrictHostKeyChecking=accept-new \
            "${VM_USER}@${VM_HOST}" \
            "tar -C /var/www/nebutra/new-api/data -czf - ." \
            > "$RUNNER_TEMP/new-api-data.tgz"
          rm -f "$RUNNER_TEMP/vm_key"
          test -s "$RUNNER_TEMP/new-api-data.tgz"
          flyctl ssh sftp put -a nebutra-new-api \
            "$RUNNER_TEMP/new-api-data.tgz" /tmp/new-api-data.tgz
          flyctl ssh console -a nebutra-new-api --pty=false -C \
            "sh -c 'tar -C /data -x -z -f /tmp/new-api-data.tgz && rm -f /tmp/new-api-data.tgz && ls /data'"
          rm -f "$RUNNER_TEMP/new-api-data.tgz"
          flyctl apps restart nebutra-new-api

      - name: Smoke 6PN from this org
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if flyctl ssh console -a nebutra-new-api --pty=false -C \
              "sh -c 'wget -qO- --timeout=5 http://127.0.0.1:3000/api/status || wget -qO- --timeout=5 http://127.0.0.1:3000/ || true'" \
              | tee "$RUNNER_TEMP/new-api-smoke.txt" | grep -q .; then
              echo "new-api answered on try $i"
              exit 0
            fi
            sleep 8
          done
          flyctl status -a nebutra-new-api || true
          flyctl logs -a nebutra-new-api --no-tail || true
          echo "::error::nebutra-new-api did not answer on :3000"
          exit 1

      - name: Point Fly router at 6PN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl secrets set \
            NEW_API_BASE_URL=http://nebutra-new-api.internal:3000/v1 \
            -a nebutra-router
          echo "router now consumes New-API over 6PN"

  deploy-dns-leak:
    name: Fly dns-leak
    needs: matrix
    if: needs.matrix.outputs.want_dns_leak == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Set repository secret FLY_API_TOKEN (deploy token)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Ensure Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          org="$(bash infra/ops/scripts/resolve-fly-org.sh)"
          echo "using Fly org $org"
          if flyctl apps list --json | python3 -c "import json,sys; names={a.get('Name') or a.get('name') for a in json.load(sys.stdin)}; sys.exit(0 if 'nebutra-dns-leak' in names else 1)"; then
            echo "app nebutra-dns-leak exists"
          else
            flyctl apps create nebutra-dns-leak --machines --org "$org" --yes
          fi

      - name: Allocate dedicated IPv4
        id: ip
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          pick_v4() {
            python3 -c '
          import json, re, sys
          raw = json.load(sys.stdin)
          rows = raw if isinstance(raw, list) else raw.get("ips") or raw.get("Addresses") or raw.get("data") or []
          for ip in rows:
              addr = ip.get("Address") or ip.get("address") or ip.get("IP") or ip.get("ip") or ""
              kind = str(ip.get("Type") or ip.get("type") or "").lower()
              if re.match(r"^\d{1,3}(\.\d{1,3}){3}$", addr) and "shared" not in kind:
                  print(addr)
                  break
          '
          }
          ns_ip="$(flyctl ips list -a nebutra-dns-leak --json | pick_v4)"
          if [ -z "$ns_ip" ]; then
            flyctl ips allocate-v4 -a nebutra-dns-leak --yes
            ns_ip="$(flyctl ips list -a nebutra-dns-leak --json | pick_v4)"
          fi
          test -n "$ns_ip"
          echo "ns_ip=$ns_ip" >> "$GITHUB_OUTPUT"
          echo "dedicated IPv4 $ns_ip"
          flyctl secrets set FORGE_DNS_LEAK_NS_IP="$ns_ip" -a nebutra-dns-leak --stage

      - name: Assemble image context
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage-dns-leak"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/src"
          cp packages/ai/forge-dns-leak/package.json "$STAGE/"
          cp -R packages/ai/forge-dns-leak/src/. "$STAGE/src/"
          cp infra/fly/Dockerfile.dns-leak "$STAGE/Dockerfile"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Deploy Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy "$STAGE" \
            --config "$GITHUB_WORKSPACE/infra/fly/dns-leak.toml" \
            --dockerfile "$STAGE/Dockerfile" \
            --ha=false \
            --remote-only \
            --yes

      - name: Smoke control API on the Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if flyctl ssh console -a nebutra-dns-leak --pty=false -C \
              "sh -c 'wget -qO- --timeout=5 http://127.0.0.1:3953/health'" \
              | tee "$RUNNER_TEMP/leak-health.txt" | grep -q '"ok":true'; then
              echo "control API healthy on try $i"
              exit 0
            fi
            sleep 8
          done
          flyctl status -a nebutra-dns-leak || true
          flyctl logs -a nebutra-dns-leak --no-tail || true
          echo "::error::leak control API did not answer"
          exit 1

      - name: Point Forge at 6PN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set \
            FORGE_DNS_LEAK_URL=http://nebutra-dns-leak.internal:3953 \
            -a nebutra-forge
