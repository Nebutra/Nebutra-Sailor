name: Deploy KCQ to Fly

# The chart library lives in its own repository. Build Nebutra's product shell,
# ships the static product surface to a dedicated Fly app, and optionally cuts
# over kcq.nebutra.com after the Fly URL is healthy.

on:
  workflow_dispatch:
    inputs:
      cutover:
        description: "After a healthy Fly URL, point kcq.nebutra.com at it"
        required: false
        default: "false"
        type: boolean
      diagnostics:
        description: "Read existing KCQ proxy diagnostics without deploying"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-kcq-fly${{ github.event.inputs.cutover == 'true' && '-cutover' || '' }}
  cancel-in-progress: ${{ github.event.inputs.cutover != 'true' }}

jobs:
  diagnostics:
    if: inputs.diagnostics == true
    name: Inspect market proxy
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Inspect existing proxy errors and upstream connectivity
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -o /dev/null -w 'KCQ anonymous BYOK HTTP %{http_code}\n' --max-time 25 https://nebutra-kcq.fly.dev/market/byok/connections
          flyctl logs -a nebutra-kcq --no-tail | python3 -c 'import sys; print("".join(line for line in sys.stdin if "[error]" in line))'
          flyctl ssh console -a nebutra-kcq -C "/bin/sh -c 'cat /etc/resolv.conf; nslookup nebutra-gateway.fly.dev; wget -S -O /dev/null https://nebutra-gateway.fly.dev/api/v1/kcq/connections'" || true
  deploy:
    if: inputs.diagnostics != true
    name: Fly KCQ
    runs-on: ubuntu-latest
    steps:
      - name: Require deployment credentials
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}" || {
            echo "::error::Set repository secret FLY_API_TOKEN"
            exit 1
          }

      - name: Checkout Nebutra deployment files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve canonical library revision
        id: chart
        run: node -e 'const s=require("./apps/kcq/chart-source.json"); if(!/^[a-f0-9]{40}$/.test(s.commit)) throw new Error("Expected immutable KCQ SHA"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "commit="+s.commit+"\nrepository="+new URL(s.repository).pathname.replace(/^\//, "").replace(/\.git$/, "")+"\n")'

      - name: Checkout KCQ
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.chart.outputs.repository }}
          ref: ${{ steps.chart.outputs.commit }}
          path: kcq-source

      # The shared action owns the Nebutra toolchain and root lockfile cache.
      # KCQ installs its separate frozen lockfile in the following step.
      - name: Setup product toolchain
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.23.2"
          install-command: pnpm install --frozen-lockfile --filter @nebutra/kcq...

      - name: Validate library and product compatibility
        run: |
          set -euo pipefail
          export KCQ_SOURCE_DIR="$GITHUB_WORKSPACE/kcq-source"
          node --test apps/kcq/scripts/upstream.test.mjs
          node apps/kcq/scripts/verify.mjs
          grep -q 'KCQ · Nebutra' apps/kcq/dist/index.html

      - name: Stage static image
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage-kcq"
          rm -rf "$stage"
          mkdir -p "$stage/html"
          cp -R apps/kcq/dist/. "$stage/html/"
          cp infra/fly/Dockerfile.kcq "$stage/Dockerfile"
          cp infra/fly/kcq.nginx.conf "$stage/nginx.conf"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      - name: Validate market proxy configuration
        run: docker run --rm -v "$STAGE/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Ensure Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          org="$(bash infra/ops/scripts/resolve-fly-org.sh)"
          echo "using Fly org $org"
          if flyctl apps list --json | python3 -c 'import json,sys; names={a.get("Name") or a.get("name") for a in json.load(sys.stdin)}; sys.exit(0 if "nebutra-kcq" in names else 1)'; then
            echo "app nebutra-kcq exists"
          else
            flyctl apps create nebutra-kcq --machines --org "$org" --yes
          fi

      - name: Deploy KCQ Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy "$STAGE" \
            --config "$GITHUB_WORKSPACE/infra/fly/kcq.toml" \
            --dockerfile "$STAGE/Dockerfile" \
            --ha=false \
            --remote-only \
            --yes

      - name: Add Fly certificate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl certs add kcq.nebutra.com -a nebutra-kcq || true
          flyctl certs setup kcq.nebutra.com -a nebutra-kcq || true
          flyctl certs show kcq.nebutra.com -a nebutra-kcq || true

      - name: Smoke Fly URL
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://nebutra-kcq.fly.dev/ || echo 000)
            health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://nebutra-kcq.fly.dev/health || echo 000)
            echo "try $i home=$code health=$health"
            if [ "$code" = "200" ] && [ "$health" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          flyctl status -a nebutra-kcq || true
          flyctl logs -a nebutra-kcq --no-tail || true
          echo "::error::KCQ Fly URL is not healthy; DNS will not cut over"
          exit 1

      - name: Cut over Cloudflare DNS
        if: inputs.cutover == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HOST: kcq
          FLY_APP: nebutra-kcq
        run: bash infra/ops/scripts/point-host-dns-fly.sh

      - name: Smoke authenticated market proxy boundary
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/byok-anonymous.json" -w '%{http_code}' --max-time 25 https://nebutra-kcq.fly.dev/market/byok/connections)
          if [ "$code" = "401" ] && python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["error"]["code"] == "FETCH_FAILED"' "$RUNNER_TEMP/byok-anonymous.json"; then
            echo "BYOK proxy reached the authenticated gateway."
          else
            flyctl logs -a nebutra-kcq --no-tail || true
            echo "::error::Anonymous BYOK must return the gateway JSON 401; got $code"
            exit 1
          fi

      - name: Smoke public KCQ domain
        if: inputs.cutover == true
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://kcq.nebutra.com/ || echo 000)
            echo "try $i public=$code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::https://kcq.nebutra.com/ did not return 200"
          exit 1
