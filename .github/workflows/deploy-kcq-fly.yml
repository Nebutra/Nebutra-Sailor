name: Deploy KCQ to Fly

# The chart library lives in its own repository. Build Nebutra's product shell,
# ship it with the three pinned market connectors (GOTDX, Binance depth,
# TradingView) as one Fly Machine, and optionally cut over kcq.nebutra.com after
# the Fly URL is healthy. Connector revisions stay pinned independently in
# apps/kcq/connector-sources.json. ADR: docs/ops/nebutra/2026-10-09-kcq-consolidation.md

on:
  workflow_dispatch:
    inputs:
      cutover:
        description: "After a healthy Fly URL, point kcq.nebutra.com at it"
        required: false
        default: "false"
        type: boolean
      diagnostics:
        description: "Read existing KCQ proxy diagnostics without deploying"
        required: false
        default: "false"
        type: boolean
      verify_only:
        description: "Re-run the real-data connector checks on the running Machine without deploying"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

# A running deploy is never cancelled: a newer push queues behind it (GitHub keeps
# only the newest pending run), so the latest main still ships, and a manual
# dispatch has its own lane so a push can't displace it.
concurrency:
  group: deploy-kcq-fly-${{ github.event_name }}${{ github.event.inputs.cutover == 'true' && '-cutover' || '' }}
  cancel-in-progress: false

jobs:
  diagnostics:
    if: inputs.diagnostics == true
    name: Inspect market proxy
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Inspect existing proxy errors and upstream connectivity
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -o /dev/null -w 'KCQ anonymous BYOK HTTP %{http_code}\n' --max-time 25 https://nebutra-kcq.fly.dev/market/byok/connections
          flyctl logs -a nebutra-kcq --no-tail | python3 -c 'import sys; print("".join(line for line in sys.stdin if "[error]" in line))'
          flyctl ssh console -a nebutra-kcq -C "/bin/sh -c 'cat /etc/resolv.conf; nslookup nebutra-gateway.fly.dev; wget -S -O /dev/null https://nebutra-gateway.fly.dev/api/v1/kcq/connections'" || true
  verify:
    if: inputs.diagnostics != true && inputs.verify_only == true
    name: Verify connectors
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Verify real search and fresh bars or depth
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl status -a nebutra-kcq
          for connector in tdx python binance; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if flyctl ssh console -a nebutra-kcq -C "env CONNECTOR=$connector /bin/sh /usr/local/bin/nebutra-smoke.sh"; then ok=1; break; fi
              sleep 15
            done
            test "$ok" = 1 || { flyctl logs -a nebutra-kcq --no-tail || true; echo "::error::Connector $connector failed real-data verification"; exit 1; }
          done
  deploy:
    if: inputs.diagnostics != true && inputs.verify_only != true
    name: Fly KCQ
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require deployment credentials
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}" || {
            echo "::error::Set repository secret FLY_API_TOKEN"
            exit 1
          }

      - name: Checkout Nebutra deployment files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve canonical library revision
        id: chart
        run: node -e 'const s=require("./apps/kcq/chart-source.json"); if(!/^[a-f0-9]{40}$/.test(s.commit)) throw new Error("Expected immutable KCQ SHA"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "commit="+s.commit+"\nrepository="+new URL(s.repository).pathname.replace(/^\//, "").replace(/\.git$/, "")+"\n")'

      - name: Checkout KCQ
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.chart.outputs.repository }}
          ref: ${{ steps.chart.outputs.commit }}
          path: kcq-source

      - name: Resolve immutable connector sources
        id: connectors
        run: |
          node -e 'const s=require("./apps/kcq/connector-sources.json"); const o=[]; for (const k of ["gotdx","python"]) { if(!/^[a-f0-9]{40}$/.test(s[k].commit)) throw Error("Expected immutable SHA for "+k); o.push(k+"_repository="+s[k].repository, k+"_commit="+s[k].commit); } require("fs").appendFileSync(process.env.GITHUB_OUTPUT, o.join("\n")+"\n");'

      - name: Checkout GOTDX connector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.connectors.outputs.gotdx_repository }}
          ref: ${{ steps.connectors.outputs.gotdx_commit }}
          path: connector-gotdx

      - name: Checkout TradingView connector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.connectors.outputs.python_repository }}
          ref: ${{ steps.connectors.outputs.python_commit }}
          path: connector-python

      # The shared action owns the Nebutra toolchain and root lockfile cache.
      # KCQ installs its separate frozen lockfile in the following step.
      - name: Setup product toolchain
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.23.2"
          install-command: pnpm install --frozen-lockfile --filter @nebutra/kcq... --filter @nebutra/kcq-docs...

      - name: Validate library and product compatibility
        run: |
          set -euo pipefail
          export KCQ_SOURCE_DIR="$GITHUB_WORKSPACE/kcq-source"
          node --test apps/kcq/scripts/upstream.test.mjs
          node apps/kcq/scripts/verify.mjs
          grep -q 'KCQ · Nebutra' apps/kcq/dist/index.html

      # The docs (apps/kcq-docs) are generated from the same pinned checkout, so they describe the
      # chart this deploy ships. Static export, served by the same nginx under /docs and /zh/docs.
      - name: Build documentation
        run: |
          set -euo pipefail
          export KCQ_SOURCE_DIR="$GITHUB_WORKSPACE/kcq-source"
          pnpm turbo run build --filter=@nebutra/kcq-docs^...
          pnpm --filter @nebutra/kcq-docs build
          test -f apps/kcq-docs/dist/docs.html
          test -f apps/kcq-docs/dist/zh/docs.html

      - name: Stage image (static product, nginx and connectors)
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage-kcq"
          rm -rf "$stage"
          mkdir -p "$stage/html"
          cp -R apps/kcq/dist/. "$stage/html/"
          cp -R apps/kcq-docs/dist/. "$stage/html/"
          cp -R connector-gotdx "$stage/gotdx"
          cp -R connector-python "$stage/python"
          rm -rf "$stage/gotdx/.git" "$stage/python/.git"
          cp infra/fly/Dockerfile.kcq "$stage/Dockerfile"
          cp infra/fly/kcq.nginx.conf "$stage/nginx.conf"
          cp infra/fly/kcq.security-headers.conf "$stage/security-headers.conf"
          cp infra/fly/kcq-supervisor.py infra/fly/kcq-python-entrypoint.py infra/fly/smoke-kcq-connector.sh "$stage/"
          printf '.git\n.venv\n__pycache__\n' > "$stage/.dockerignore"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      - name: Validate market proxy configuration
        run: |
          set -euo pipefail
          # nginx resolves no upstream at parse time (loopback IP literals), so a bare nginx -t is enough.
          docker run --rm -v "$STAGE/nginx.conf:/etc/nginx/conf.d/default.conf:ro" -v "$STAGE/security-headers.conf:/etc/nginx/snippets/kcq-security-headers.conf:ro" nginx:1.27-alpine nginx -t
          python3 -m py_compile infra/fly/kcq-supervisor.py infra/fly/kcq-python-entrypoint.py

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Ensure Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          org="$(bash infra/ops/scripts/resolve-fly-org.sh)"
          echo "using Fly org $org"
          if flyctl apps list --json | python3 -c 'import json,sys; names={a.get("Name") or a.get("name") for a in json.load(sys.stdin)}; sys.exit(0 if "nebutra-kcq" in names else 1)'; then
            echo "app nebutra-kcq exists"
          else
            flyctl apps create nebutra-kcq --machines --org "$org" --yes
          fi

      - name: Deploy KCQ Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy "$STAGE" \
            --config "$GITHUB_WORKSPACE/infra/fly/kcq.toml" \
            --dockerfile "$STAGE/Dockerfile" \
            --ha=false \
            --remote-only \
            --yes

      - name: Verify real search and fresh bars or depth
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl status -a nebutra-kcq
          for connector in tdx python binance; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if flyctl ssh console -a nebutra-kcq -C "env CONNECTOR=$connector /bin/sh /usr/local/bin/nebutra-smoke.sh"; then ok=1; break; fi
              sleep 15
            done
            if [ "$ok" != 1 ]; then
              flyctl logs -a nebutra-kcq --no-tail || true
              echo "::error::Connector $connector failed real-data verification; DNS will not cut over"
              exit 1
            fi
          done

      - name: Add Fly certificate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl certs add kcq.nebutra.com -a nebutra-kcq || true
          flyctl certs setup kcq.nebutra.com -a nebutra-kcq || true
          flyctl certs show kcq.nebutra.com -a nebutra-kcq || true

      - name: Smoke Fly URL
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            # `/` is a redirect to the workbench; check the app shell and a prerendered public page.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://nebutra-kcq.fly.dev/app || echo 000)
            home=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://nebutra-kcq.fly.dev/home || echo 000)
            health=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://nebutra-kcq.fly.dev/health || echo 000)
            docs=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://nebutra-kcq.fly.dev/docs || echo 000)
            echo "try $i app=$code home=$home docs=$docs health=$health"
            if [ "$code" = "200" ] && [ "$home" = "200" ] && [ "$docs" = "200" ] && [ "$health" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          flyctl status -a nebutra-kcq || true
          flyctl logs -a nebutra-kcq --no-tail || true
          echo "::error::KCQ Fly URL is not healthy; DNS will not cut over"
          exit 1

      - name: Cut over Cloudflare DNS
        if: inputs.cutover == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HOST: kcq
          FLY_APP: nebutra-kcq
        run: bash infra/ops/scripts/point-host-dns-fly.sh

      # Edge cache for the prerendered public pages (infra/ops/scripts/apply-kcq-edge-cache.sh).
      # Fail-soft: a token without Cache Rules / Zone Settings / Cache Purge gets a ::warning naming
      # the missing permission; the origin headers are correct either way.
      - name: Apply Cloudflare edge cache rules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bash infra/ops/scripts/apply-kcq-edge-cache.sh rules
          bash infra/ops/scripts/apply-kcq-edge-cache.sh tiered

      - name: Purge public pages from the Cloudflare edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HTML_ROOT: ${{ env.STAGE }}/html
        run: bash infra/ops/scripts/apply-kcq-edge-cache.sh purge

      - name: Smoke authenticated market proxy boundary
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/byok-anonymous.json" -w '%{http_code}' --max-time 25 https://nebutra-kcq.fly.dev/market/byok/connections)
          if [ "$code" = "401" ] && python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["error"]["code"] == "FETCH_FAILED"' "$RUNNER_TEMP/byok-anonymous.json"; then
            echo "BYOK proxy reached the authenticated gateway."
          else
            flyctl logs -a nebutra-kcq --no-tail || true
            echo "::error::Anonymous BYOK must return the gateway JSON 401; got $code"
            exit 1
          fi

      - name: Smoke public KCQ domain
        if: inputs.cutover == true
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://kcq.nebutra.com/app || echo 000)
            echo "try $i public=$code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::https://kcq.nebutra.com/app did not return 200"
          exit 1
