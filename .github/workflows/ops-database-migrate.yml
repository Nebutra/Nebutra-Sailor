name: Database — bring it to the schema
# The one database command, `packages/platform/db/scripts/db.mjs`, run against
# the database behind the repository's DIRECT_URL (or DATABASE_URL) secret.
#
#   deploy  migrate, then platform.sql and the generated RLS, then prove zero
#           drift. What every deploy workflow calls first (`uses:` below), so
#           new code never meets an old schema. Nothing pending → a no-op.
#   check   read-only drift report, plus a schema-only pg_dump artifact (no
#           rows, no passwords) for diffing the live database offline.
#   adopt   once per database that predates the baseline: verifies the tables
#           already are the baseline, then swaps the legacy history for it.
#           Changes no table. `deploy` refuses until this has run.
#   identity-backfill
#           links Better Auth subjects to their Clerk-era `users` rows
#           (`scripts/backfill-identity-links.mjs --include-orphans`). A DRY
#           RUN unless `apply` is true; the plan lands in the job summary
#           (emails masked). Dry-run first, read the summary, then re-run with
#           apply. Idempotent; one transaction. Touches no schema.
#
# ADR 2026-09-25 database convergence. There is no `db push` path any more:
# a database built by push is adopted, not pushed again.
#
# DDL wants a direct connection: a transaction-pooling PgBouncer can reject the
# advisory lock migrate takes. DIRECT_URL is used when the secret exists.
# Prints hosts, never connection strings.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = apply and verify; check = read-only report; adopt = one-time switch to the baseline"
        type: choice
        options: [check, deploy, adopt, identity-backfill]
        default: check
      apply:
        description: "identity-backfill only: write the links (default false = dry run, prints the plan)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      action:
        type: string
        default: deploy
      apply:
        type: boolean
        default: false

permissions:
  contents: read

# No concurrency group, on purpose. One push fans in here from three deploy
# workflows at once, and GitHub keeps only one *pending* run per group: the
# newest pending caller cancelled the others while they queued, taking their
# whole deploys down with them (2026-09-26, the first deploy after #640).
# Parallel runs are safe without it — `prisma migrate deploy` and db.mjs each
# hold a Postgres advisory lock, so the second waits and then finds nothing
# pending.

jobs:
  database:
    name: Database ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
      APP_DB_ROLE: ${{ vars.APP_DB_ROLE || 'app_user' }}
      ACTION: ${{ inputs.action }}
      APPLY: ${{ inputs.apply && 'true' || 'false' }}
    steps:
      - name: Require a database URL
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Neither DIRECT_URL nor DATABASE_URL is set as a repository secret, so there is no database."
            exit 1
          fi
          echo "host: $(node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).host)')"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Generate the client and row-level security
        if: ${{ inputs.action != 'identity-backfill' }}
        run: pnpm --filter @nebutra/db db:generate

      - name: db.mjs ${{ inputs.action }}
        if: ${{ inputs.action != 'identity-backfill' }}
        working-directory: packages/platform/db
        run: node scripts/db.mjs "$ACTION"

      - name: Identity backfill (${{ inputs.apply && 'APPLY' || 'dry run' }})
        # Dry run unless `apply` is true. Output masks emails; ids are fine.
        # The plan is also written to the job summary.
        if: ${{ inputs.action == 'identity-backfill' }}
        working-directory: packages/platform/db
        run: |
          set -euo pipefail
          ARGS="--include-orphans"
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          node scripts/backfill-identity-links.mjs $ARGS 2>&1 | tee "$RUNNER_TEMP/identity-backfill.txt"
          {
            if [ "$APPLY" = "true" ]; then echo "### Identity backfill — APPLIED"; else echo "### Identity backfill — dry run (nothing written)"; fi
            echo
            echo '```'
            cat "$RUNNER_TEMP/identity-backfill.txt"
            echo '```'
            if [ "$APPLY" != "true" ]; then echo; echo "Happy with the plan? Re-run this workflow with action identity-backfill and apply checked."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export the live schema
        # Structure only: tables, indexes, RLS policies, functions, grants. No
        # rows (--schema-only) and no passwords (pg_dump never emits them).
        # Encrypted, but the server certificate is not verified — the container
        # has no trust store PlanetScale's chain resolves against.
        if: ${{ always() && inputs.action == 'check' }}
        run: |
          set -euo pipefail
          PGURL=$(node -e 'const u = new URL(process.env.DATABASE_URL); u.searchParams.delete("sslmode"); u.searchParams.delete("sslrootcert"); process.stdout.write(u.toString())')
          docker run --rm -e PGURL="$PGURL" -e PGSSLMODE=require postgres:18 \
            sh -c 'pg_dump "$PGURL" --schema-only --no-comments' > live-schema.sql
          echo "Exported $(grep -c 'CREATE TABLE' live-schema.sql) tables, $(grep -c 'CREATE POLICY' live-schema.sql) policies"

      - name: Upload the live schema
        if: ${{ always() && inputs.action == 'check' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-schema
          path: live-schema.sql
          retention-days: 7
          if-no-files-found: ignore

      - name: Say what happened
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Database \`$ACTION\` — $OUTCOME"
            echo
            echo "Host \`$(node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).host)')\`, runtime role \`$APP_DB_ROLE\`."
            echo "The step log above lists any drift: pending migrations, structure that differs from schema.prisma, or policies that differ from the generated rls.sql."
          } >> "$GITHUB_STEP_SUMMARY"
