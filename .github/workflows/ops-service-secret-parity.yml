name: Ops — Service secret parity

# Fly apps do not share an environment: each one's SERVICE_SECRET is set by
# hand or by import, independently. On 2026-09-30 nebutra-gateway +
# nebutra-web held one value while nebutra-router + nebutra-admin held
# another — gateway -> Router service-to-service tokens were signed with one
# secret and verified with the other, every call was rejected with 401, and
# nothing failed loudly: each app's own health check only proves it can reach
# itself, not that its peers agree with it. The owner found this by hand,
# diffing values. This workflow makes that drift impossible to miss again.
#
# Read-only: it never prints or transmits a secret value, only the first 12
# hex characters of each app's SERVICE_SECRET sha256 (see the script for why
# that is safe to log). A failed scheduled run is the alert.
#
# Runs daily, on demand, and — as a reusable workflow — right after
# deploy-fly.yml's own deploy jobs succeed, so drift introduced by a deploy
# (e.g. importing a stale VM .env onto one app but not its peers) is caught
# the same day rather than at the next 05:00 UTC cron tick.

on:
  schedule:
    - cron: "12 5 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# No concurrency group, on purpose — same reasoning as ops-database-migrate.yml.
# This workflow is called from inside deploy-fly.yml; a static concurrency
# group shared with its own schedule/dispatch triggers would let an unrelated
# scheduled run cancel the copy running inside someone else's deploy, taking
# an unrelated job in that deploy down with it.

jobs:
  parity:
    name: Compare SERVICE_SECRET across Fly apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Set repository secret FLY_API_TOKEN (deploy token)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Compare SERVICE_SECRET fingerprints
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bash infra/ops/scripts/check-service-secret-parity.sh
