name: Point auth DNS to ECS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Upsert auth.nebutra.com → ECS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          ECS_HOST: ${{ vars.ECS_HOST || '106.15.4.31' }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          bash infra/ops/scripts/point-auth-dns-ecs.sh
      - name: Smoke auth health
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/ah.json -w '%{http_code}' --max-time 20 https://auth.nebutra.com/health || echo 000)
            echo "try $i -> $code"
            if [ "$code" = "200" ]; then head -c 300 /tmp/ah.json; echo; exit 0; fi
            sleep 10
          done
          echo "::warning::DNS may be set but TLS/origin not ready yet"
          curl -sSI --max-time 15 https://auth.nebutra.com/health || true
          exit 0
