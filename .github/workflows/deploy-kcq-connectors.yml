name: Deploy KCQ market connectors

on:
  workflow_dispatch:
    inputs:
      connector:
        description: "Private connector to deploy (validate before enabling in KCQ)"
        type: choice
        options: [tdx, python, binance]
        default: tdx
      verify_only:
        description: "Recheck an existing Machine without deploying"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-kcq-connector-${{ inputs.connector }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve immutable connector source
        id: source
        env:
          CONNECTOR: ${{ inputs.connector }}
        run: |
          node -e 'const c=process.env.CONNECTOR; if(!["tdx","python","binance"].includes(c)) throw Error("Unknown connector"); const s=require("./apps/kcq/connector-sources.json")[c==="python"?"python":"gotdx"]; if(!/^[a-f0-9]{40}$/.test(s.commit)) throw Error("Expected immutable SHA"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT,`repository=${s.repository}\ncommit=${s.commit}\n`);'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: connector-source
      - name: Stage production image
        env:
          CONNECTOR: ${{ inputs.connector }}
        run: |
          set -euo pipefail
          kind=gotdx
          if [ "$CONNECTOR" = python ]; then kind=python; fi
          cp "infra/fly/Dockerfile.kcq-$kind" connector-source/Dockerfile
          cp infra/ops/scripts/smoke-kcq-connector.sh connector-source/nebutra-smoke.sh
          printf '.git\n.venv\n__pycache__\n' > connector-source/.dockerignore
          if [ "$CONNECTOR" = python ]; then
            cp infra/fly/kcq-python-entrypoint.py connector-source/nebutra-entrypoint.py
            # Preserve locked versions, hashes and immutable tvdatafeed revision.
            # Replace only the package mirror origin for the remote builder.
            sed -i 's|https://mirrors.aliyun.com/pypi/simple/|https://pypi.org/simple|g; s|https://mirrors.aliyun.com/pypi/packages/|https://files.pythonhosted.org/packages/|g' connector-source/uv.lock
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Ensure private Fly app
        if: inputs.verify_only != true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
          CONNECTOR: ${{ inputs.connector }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          app="nebutra-kcq-$CONNECTOR"
          org="$(bash infra/ops/scripts/resolve-fly-org.sh)"
          if ! flyctl apps list --json | jq -e --arg app "$app" 'any(.[]; (.Name // .name) == $app)' >/dev/null; then
            flyctl apps create "$app" --machines --org "$org" --yes
          fi
      - name: Deploy private Machine
        if: inputs.verify_only != true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CONNECTOR: ${{ inputs.connector }}
        run: |
          flyctl deploy connector-source --config "$GITHUB_WORKSPACE/infra/fly/kcq-$CONNECTOR.toml" --remote-only --ha=false --yes
      - name: Verify real search and fresh bars or depth
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CONNECTOR: ${{ inputs.connector }}
        run: |
          set -euo pipefail
          app="nebutra-kcq-$CONNECTOR"
          flyctl status -a "$app"
          for attempt in 1 2 3; do
            flyctl ssh sftp put infra/ops/scripts/smoke-kcq-connector.sh /tmp/nebutra-smoke.sh -a "$app"
            if flyctl ssh console -a "$app" -C '/bin/sh /tmp/nebutra-smoke.sh'; then exit 0; fi
            sleep 15
          done
          flyctl logs -a "$app" --no-tail || true
          echo '::error::Connector has not passed real-data verification; do not enable it in KCQ'
          exit 1
      - name: Diagnose failed deployment
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CONNECTOR: ${{ inputs.connector }}
        run: |
          flyctl status -a "nebutra-kcq-$CONNECTOR" || true
          flyctl logs -a "nebutra-kcq-$CONNECTOR" --no-tail || true
