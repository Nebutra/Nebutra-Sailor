name: Deploy Sailor Docs

# Alternate deploy for apps/sailor-docs (served at <site>/docs).
#
# Production is the Fly Machine (deploy-fly.yml, app=sailor-docs). This
# workflow keeps the Cloudflare Workers path: OpenNext → Worker + Assets
# (same pattern as typelens), gated by vars.DEPLOY_TARGET_SAILOR_DOCS:
#   cloudflare-workers | cloudflare-pages → Cloudflare job
#   anything else (or unset) → no push deploy; the Fly path owns production
# workflow_dispatch always runs the Cloudflare job.
#
# The Vercel path was retired on 2026-09-22 with the rest of the Vercel
# deploy surface; its quota notes live in git history.
#
# Cloudflare token: CLOUDFLARE_API_TOKEN, with CLOUDFLARE_WORKERS_API_TOKEN as a
# legacy fallback. The order used to be reversed, so a token left behind on
# 2026-08-05 silently outranked the one rotated on 2026-08-19 and every deploy
# authenticated as the stale one — typelens worked only because it never read
# the second name. Two secrets for one credential, resolved by a precedence
# rule nobody sees, is the whole failure.
# must include Workers Scripts Edit (preflight probes assets-upload-session).
# See docs/ops/cloudflare-ci-token.md.
#
# Historical note: old monorepo Workers builds could exceed script size; modern
# OpenNext keeps handler thin and static under ASSETS.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/sailor-docs/**"
      - "packages/design/ui/**"
      - "packages/design/brand/**"
      - "packages/design/icons/**"
      - "packages/design/tokens/**"
      # pnpm-lock.yaml is deliberately not a trigger: a lockfile-only bump on
      # main rebuilt an unchanged site. A dependency change that matters to docs
      # also touches a path above.
      - "apps/sailor-docs/wrangler.jsonc"
      - "apps/sailor-docs/open-next.config.ts"
      - ".github/workflows/deploy-sailor-docs.yml"

permissions:
  contents: read

concurrency:
  group: deploy-sailor-docs-production
  cancel-in-progress: true

jobs:
  cloudflare:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        vars.DEPLOY_TARGET_SAILOR_DOCS == 'cloudflare-pages' ||
        vars.DEPLOY_TARGET_SAILOR_DOCS == 'cloudflare-workers'
      ))
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22

      # CLOUDFLARE_API_TOKEN first, CLOUDFLARE_WORKERS_API_TOKEN as legacy
      # fallback. The order was the other way round on the theory that the
      # general token might be DNS-only — but a stale Workers token outranks a
      # freshly rotated general one just as easily, which is what happened on
      # 2026-08-19: the rotated token was correct and every Workers deploy
      # authenticated as the one from two weeks earlier. Whichever name is
      # preferred, being preferred is not evidence of being right; prefer the
      # one the rest of the repo already uses so there is one place to rotate.
      # See docs/ops/cloudflare-ci-token.md
      - name: Validate Cloudflare secrets
        id: cf_secrets
        env:
          WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ID_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="${API_TOKEN:-${WORKERS_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_WORKERS_API_TOKEN or CLOUDFLARE_API_TOKEN (Workers Scripts Edit required). See docs/ops/cloudflare-ci-token.md"
            exit 1
          fi
          ACCOUNT_ID="${ACCOUNT_ID_SECRET:-${ACCOUNT_ID_VAR:-}}"
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret/var is not set"
            exit 1
          fi
          # Print which name won. A deploy that fails on auth should not need
          # someone to read this file to find out which of two secrets it used.
          if [ -n "${API_TOKEN:-}" ]; then
            echo "token_source=CLOUDFLARE_API_TOKEN"
          else
            echo "token_source=CLOUDFLARE_WORKERS_API_TOKEN (legacy fallback)"
          fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          # Masked echo only of source name for logs
          echo "Using token source above for Workers deploy + preflight."

      - name: Preflight Workers token (assets-upload-session)
        env:
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! bash infra/ops/scripts/verify-cloudflare-ci-token.sh; then
            echo "::error::Cloudflare token cannot deploy Workers (often error 10000 — missing Workers Scripts Edit)."
            echo "::error::Fix: docs/ops/cloudflare-ci-token.md — create token from Edit Cloudflare Workers template, then:"
            echo "::error::  printf '%s' \"\$NEW_TOKEN\" | gh secret set CLOUDFLARE_API_TOKEN -R Nebutra/Nebutra-Sailor"
            echo "::error::Temporary path: production is already served by the Fly Machine (deploy-fly.yml app=sailor-docs); this workflow can be re-run after the token is fixed."
            exit 1
          fi

      # Workspace packages export dist/ (gitignored). Build transitive deps so
      # Next can resolve @nebutra/brand, @nebutra/ui, icons, tokens, etc.
      - name: Build workspace dependencies
        run: pnpm turbo build --filter="@nebutra/sailor-docs^..."

      - name: Build OpenNext worker
        working-directory: apps/sailor-docs
        env:
          OPEN_NEXT_BUILD: "true"
          CI: "true"
          NEXT_PUBLIC_DOCS_ORIGIN_URL: https://nebutra.com/docs
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          # Workers-scoped token first; general API token as fallback.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          # Secret preferred; vars fallback if secret is empty/stale.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/sailor-docs
          command: deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke docs
        run: |
          set -euo pipefail
          for url in \
            "https://nebutra.com/docs" \
            "https://pebble.nebutra.com/docs" \
            "https://nebutra-sailor-docs.nebutra.workers.dev/en" \
            ; do
            code=$(curl -sS -o /tmp/docs-smoke.html -w '%{http_code}' --max-time 30 -L "$url" || echo 000)
            echo "$url → $code"
            if [ "$code" = "200" ]; then
              if grep -qE '535\.71|LogoEn|currentColor|text-brand-mark|viewBox="0 0 535' /tmp/docs-smoke.html; then
                echo "logo: inline SVG markers present"
              elif grep -qi 'logo-horizontal-en' /tmp/docs-smoke.html; then
                echo "::warning::still serving public/logo img path"
              else
                echo "logo markup: (no known marker — check HTML manually)"
              fi
              head -c 180 /tmp/docs-smoke.html; echo
              exit 0
            fi
          done
          echo "::warning::Smoke did not get HTTP 200 yet (DNS/propagation). Worker deploy step already succeeded."
