name: Deploy Sailor Docs

# Deploy for apps/sailor-docs (served at <site>/docs).
#
# Cloudflare Workers static assets (2026-09-29, second cutover) — a pure
# `next build` (output: "export") static site, no Worker script at all. See
# next.config.ts and scripts/postbuild-static-export.mjs for how the export
# is produced and reshaped, and wrangler.jsonc for why it has no `main`.
#
# This replaces the OpenNext → Cloudflare Worker path from earlier the same
# day (commit 21efbab9e — "wire the OpenNext incremental cache..."). That
# fix was real (it took x-nextjs-cache from permanent MISS to HIT) but did
# not fully close the failure: the live Worker kept flaking between
# 200/404/503 on the SAME url from request to request, body `error code:
# 1102` ("Worker exceeded resource limits") — the ~53 MB handler.mjs's
# per-request render cost (MDX compile + the full docs component tree, even
# on a cache hit that skips re-rendering the PAGE body, still pays the cost
# of loading and evaluating that bundle) exceeded the Workers CPU/resource
# ceiling often enough to matter. A static site has no per-request render or
# multi-megabyte handler to evaluate — the failure mode is gone at the root,
# not mitigated. nebutra-docs (Fly) was retired 2026-09-29 to free a machine
# slot under the org's 20-machine cap — see
# docs/ops/nebutra/2026-09-29-fly-machine-shrink.md.
#
# The Vercel path was retired on 2026-09-22 with the rest of the Vercel
# deploy surface; its quota notes live in git history.
#
# Cloudflare token: CLOUDFLARE_API_TOKEN, with CLOUDFLARE_WORKERS_API_TOKEN as a
# legacy fallback. The order used to be reversed, so a token left behind on
# 2026-08-05 silently outranked the one rotated on 2026-08-19 and every deploy
# authenticated as the stale one — typelens worked only because it never read
# the second name. Two secrets for one credential, resolved by a precedence
# rule nobody sees, is the whole failure.
# must include Workers Scripts Edit (preflight probes assets-upload-session;
# an assets-only deploy still needs it — it is what uploads the site).
# See docs/ops/cloudflare-ci-token.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/sailor-docs/**"
      - "packages/design/ui/**"
      - "packages/design/brand/**"
      - "packages/design/icons/**"
      - "packages/design/tokens/**"
      # pnpm-lock.yaml is deliberately not a trigger: a lockfile-only bump on
      # main rebuilt an unchanged site. A dependency change that matters to docs
      # also touches a path above.
      - "apps/sailor-docs/wrangler.jsonc"
      - "apps/sailor-docs/next.config.ts"
      - "apps/sailor-docs/scripts/postbuild-static-export.mjs"
      - ".github/workflows/deploy-sailor-docs.yml"

permissions:
  contents: read

concurrency:
  group: deploy-sailor-docs-production
  cancel-in-progress: true

jobs:
  cloudflare:
    name: Deploy Cloudflare Static Assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22

      # CLOUDFLARE_API_TOKEN first, CLOUDFLARE_WORKERS_API_TOKEN as legacy
      # fallback. The order was the other way round on the theory that the
      # general token might be DNS-only — but a stale Workers token outranks a
      # freshly rotated general one just as easily, which is what happened on
      # 2026-08-19: the rotated token was correct and every Workers deploy
      # authenticated as the one from two weeks earlier. Whichever name is
      # preferred, being preferred is not evidence of being right; prefer the
      # one the rest of the repo already uses so there is one place to rotate.
      # See docs/ops/cloudflare-ci-token.md
      - name: Validate Cloudflare secrets
        id: cf_secrets
        env:
          WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ID_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="${API_TOKEN:-${WORKERS_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_WORKERS_API_TOKEN or CLOUDFLARE_API_TOKEN (Workers Scripts Edit required). See docs/ops/cloudflare-ci-token.md"
            exit 1
          fi
          ACCOUNT_ID="${ACCOUNT_ID_SECRET:-${ACCOUNT_ID_VAR:-}}"
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret/var is not set"
            exit 1
          fi
          # Print which name won. A deploy that fails on auth should not need
          # someone to read this file to find out which of two secrets it used.
          if [ -n "${API_TOKEN:-}" ]; then
            echo "token_source=CLOUDFLARE_API_TOKEN"
          else
            echo "token_source=CLOUDFLARE_WORKERS_API_TOKEN (legacy fallback)"
          fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          # Masked echo only of source name for logs
          echo "Using token source above for Workers deploy + preflight."

      - name: Preflight Workers token (assets-upload-session)
        env:
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! bash infra/ops/scripts/verify-cloudflare-ci-token.sh; then
            echo "::error::Cloudflare token cannot deploy Workers (often error 10000 — missing Workers Scripts Edit)."
            echo "::error::Fix: docs/ops/cloudflare-ci-token.md — create token from Edit Cloudflare Workers template, then:"
            echo "::error::  printf '%s' \"\$NEW_TOKEN\" | gh secret set CLOUDFLARE_API_TOKEN -R Nebutra/Nebutra-Sailor"
            echo "::error::This is now the only deploy path for docs (Fly retired 2026-09-29) — fix the token, then re-run this workflow."
            exit 1
          fi

      # Workspace packages export dist/ (gitignored). Build transitive deps so
      # Next can resolve @nebutra/brand, @nebutra/ui, icons, tokens, etc.
      - name: Build workspace dependencies
        run: pnpm turbo build --filter="@nebutra/sailor-docs^..."

      # `next build` (output: "export") writes `out/`; the postbuild script
      # (a plain Node fs script, no Cloudflare calls) reshapes it into
      # `dist/docs/**` — folding the default language up to the zone root and
      # nesting the whole tree under `docs/` to match this zone's basePath —
      # which is what wrangler.jsonc's `assets.directory` actually points at.
      # See both files for why each step is there.
      - name: Build static export
        working-directory: apps/sailor-docs
        env:
          CI: "true"
          NEXT_PUBLIC_DOCS_ORIGIN_URL: https://nebutra.com/docs
          NEXT_PUBLIC_GATEWAY_URL: https://api.nebutra.com
        run: pnpm run build:static

      # Assets-only deploy: wrangler.jsonc has no `main`, so this uploads
      # dist/** as Workers static assets and runs no Worker script at all —
      # there is nothing left to exceed a CPU/resource limit.
      - name: Deploy static assets
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          # Workers-scoped token first; general API token as fallback.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          # Secret preferred; vars fallback if secret is empty/stale.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/sailor-docs
          command: deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

      # Warm-up: right after `wrangler deploy` returns, the new static-assets
      # version can still be propagating across Cloudflare's edge, and the
      # first requests can 503 for a handful of seconds even though the
      # deploy itself is fine — that's what failed run 36548179031, seconds
      # before the same URL was serving 200s. Poll until the first 200 (or
      # ~60s) before running the real hard gate below. A timeout here is
      # informational only — it never fails the job — because the hard gate
      # immediately after it makes its own 5x-per-path requirement of every
      # path; this step exists only to absorb ordinary propagation lag so
      # that gate isn't the one measuring it.
      - name: Warm up static assets
        run: |
          set -uo pipefail
          worker_base="https://nebutra-sailor-docs.omichiliriku.workers.dev"
          url="${worker_base}/docs"
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
            echo "$url -> $code ($(( deadline - SECONDS ))s left)"
            if [ "$code" = "200" ]; then
              echo "Warm - proceeding to hard gate."
              exit 0
            fi
            sleep 3
          done
          echo "::warning::Warm-up did not see a 200 within 60s - proceeding to the hard gate, which will fail the job if this isn't transient propagation."

      # Hard gate on the deploy itself (workers_dev, no route bound — see
      # wrangler.jsonc), not on nebutra.com/docs: landing's proxy still points
      # DOCS_UPSTREAM_ORIGIN at the Fly app until the cutover, so nebutra.com/docs
      # passing here would prove nothing about this deploy. An earlier version
      # of this step only `::warning::`'d on a non-200 and always exited 0 —
      # "the deploy step succeeded" is just an upload ack, not evidence the
      # thing it uploaded serves traffic; that gap is exactly how the previous
      # Worker's intermittent 503s shipped and sat unnoticed while every run of
      # this workflow stayed green. Each path is requested 5 times, not once:
      # the whole reason this gate exists is a failure mode ("error code:
      # 1102" on the OLD Worker deploy) that came and went request to request
      # on the identical URL — a single 200 proved nothing about the next
      # request. `-L` follows the one expected redirect (`/docs` → `/docs/`,
      # `auto-trailing-slash` asset routing landing on `docs/index.html`) —
      # not a failure, the same shape a browser follows transparently.
      - name: Smoke docs (hard gate, 5x per path)
        run: |
          set -euo pipefail
          worker_base="https://nebutra-sailor-docs.omichiliriku.workers.dev"
          fail=0
          for path in "/docs" "/docs/getting-started/installation" "/docs/zh" "/docs/changelog" "/docs/api/search"; do
            url="${worker_base}${path}"
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -L -o /tmp/docs-smoke.html -w '%{http_code}' --max-time 30 "$url" || echo 000)
              echo "$url (attempt $attempt/5) → $code"
              if [ "$code" != "200" ]; then
                echo "::error::Worker smoke failed: $url returned $code on attempt $attempt/5 (expected 200). Body:"
                head -c 500 /tmp/docs-smoke.html; echo
                fail=1
              fi
            done
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more requests did not return 200 — failing the build. See wrangler.jsonc / scripts/postbuild-static-export.mjs for how this deploy is assembled."
            exit 1
          fi

          # Old-URL taxonomy redirect (scripts/postbuild-static-export.mjs's
          # generated _redirects, restored after it was dropped when this
          # deploy moved to output: "export"): one renamed path must 301,
          # and the 301's own target must then resolve 200. Two separate
          # requests, not `curl -L` on the old path alone — that would only
          # prove the FINAL page is reachable, which the paths above already
          # cover; it says nothing about whether the redirect itself fired.
          old_url="${worker_base}/docs/billing"
          redirect_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$old_url" || echo 000)
          location=$(curl -sS -o /dev/null -D - --max-time 30 "$old_url" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
          echo "$old_url → $redirect_code, Location: ${location:-<none>}"
          if [ "$redirect_code" != "301" ]; then
            echo "::error::Old-URL redirect smoke failed: $old_url returned $redirect_code (expected 301). See apps/sailor-docs/scripts/taxonomy-redirects.mjs / postbuild-static-export.mjs."
            exit 1
          fi
          target_code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 "$old_url" || echo 000)
          echo "$old_url (followed) → $target_code"
          if [ "$target_code" != "200" ]; then
            echo "::error::Old-URL redirect target failed: $old_url followed to a non-200 ($target_code)."
            exit 1
          fi

          # Informational only, against the CURRENT public path (still Fly until
          # DOCS_UPSTREAM_ORIGIN is switched to this deploy) — never gates the job.
          for url in "https://nebutra.com/docs" "https://pebble.nebutra.com/docs"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -L "$url" || echo 000)
            echo "$url → $code (informational, current public origin)"
          done
