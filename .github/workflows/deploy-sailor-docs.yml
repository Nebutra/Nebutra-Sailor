name: Deploy Sailor Docs

# Dual-path production deploy for apps/sailor-docs (docs.nebutra.com):
#
# - vercel: CLI re-trigger (Hobby plan caps at ~100 deploys/day)
# - cloudflare-workers: OpenNext → Worker + Assets (same pattern as typelens)
#
# Default: both jobs evaluate. Vercel soft-fails on daily quota. Cloudflare
# runs when DEPLOY_TARGET_SAILOR_DOCS is cloudflare-pages / cloudflare-workers,
# or when workflow_dispatch selects cloudflare / both.
#
# Historical note: old monorepo Workers builds could exceed script size; modern
# OpenNext keeps handler thin and static under ASSETS. If CF deploy fails on
# size, fall back to Vercel after quota reset or ECS emergency.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: both
        type: choice
        options:
          - both
          - cloudflare
          - vercel
  push:
    branches: [main]
    paths:
      - "apps/sailor-docs/**"
      - "packages/design/ui/**"
      - "packages/design/brand/**"
      - "packages/design/icons/**"
      - "packages/design/tokens/**"
      - "pnpm-lock.yaml"
      - "apps/sailor-docs/vercel.json"
      - "apps/sailor-docs/wrangler.jsonc"
      - "apps/sailor-docs/open-next.config.ts"
      - ".github/workflows/deploy-sailor-docs.yml"

permissions:
  contents: read

concurrency:
  group: deploy-sailor-docs-production
  cancel-in-progress: false

jobs:
  vercel:
    name: Trigger Vercel production
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'vercel' || inputs.target == 'both')) ||
      (github.event_name == 'push' && (
        vars.DEPLOY_TARGET_SAILOR_DOCS == 'vercel' ||
        vars.DEPLOY_TARGET_SAILOR_DOCS == ''
      ))
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID || vars.VERCEL_DOCS_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::notice::VERCEL_TOKEN not set — relying on Vercel Git integration only."
            echo "If docs.nebutra.com is not updating, add VERCEL_TOKEN + VERCEL_DOCS_PROJECT_ID."
            exit 0
          fi
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::Set VERCEL_DOCS_PROJECT_ID (prj_…) for the docs Vercel project"
            exit 1
          fi
          npm i -g vercel@56.5.0
          # Link the Vercel project at the monorepo root. The dashboard Root
          # Directory is already `apps/sailor-docs` — do NOT pass --cwd into
          # that folder or Vercel doubles the path
          # (…/apps/sailor-docs/apps/sailor-docs).
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"projectId":"${VERCEL_PROJECT_ID}","orgId":"${VERCEL_ORG_ID:-}"}
          EOF
          # Deploy from monorepo root so turbo filter + pnpm workspace resolve.
          # --archive=tgz avoids the 15k-file CLI upload limit on this monorepo.
          set +e
          out=$(vercel deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN" \
            --scope "${VERCEL_ORG_ID:-}" 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            if echo "$out" | grep -qiE 'api-deployments-free-per-day|Resource is limited|try again in 24 hours'; then
              echo "::warning::Vercel Hobby daily deploy quota exhausted. Prefer Cloudflare Workers job or retry after ~24h."
              exit 0
            fi
            exit "$code"
          fi

  cloudflare:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'cloudflare' || inputs.target == 'both')) ||
      (github.event_name == 'push' && (
        vars.DEPLOY_TARGET_SAILOR_DOCS == 'cloudflare-pages' ||
        vars.DEPLOY_TARGET_SAILOR_DOCS == 'cloudflare-workers'
      ))
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22

      - name: Validate Cloudflare secrets
        run: |
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set"; exit 1; }

      # Workspace packages export dist/ (gitignored). Build transitive deps so
      # Next can resolve @nebutra/brand, @nebutra/ui, icons, tokens, etc.
      - name: Build workspace dependencies
        run: pnpm turbo build --filter="@nebutra/sailor-docs^..."

      - name: Build OpenNext worker
        working-directory: apps/sailor-docs
        env:
          OPEN_NEXT_BUILD: "true"
          CI: "true"
          NEXT_PUBLIC_DOCS_ORIGIN_URL: https://docs.nebutra.com
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/sailor-docs
          command: deploy --config wrangler.jsonc

      - name: Point docs DNS at Worker (proxied)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash infra/ops/scripts/point-docs-dns-cloudflare-worker.sh

      - name: Smoke docs
        run: |
          set -euo pipefail
          for url in \
            "https://docs.nebutra.com/en" \
            "https://nebutra-sailor-docs.nebutra.workers.dev/en" \
            ; do
            code=$(curl -sS -o /tmp/docs-smoke.html -w '%{http_code}' --max-time 30 -L "$url" || echo 000)
            echo "$url → $code"
            if [ "$code" = "200" ]; then
              if grep -qE '535\.71|LogoEn|currentColor|text-brand-mark|viewBox="0 0 535' /tmp/docs-smoke.html; then
                echo "logo: inline SVG markers present"
              elif grep -qi 'logo-horizontal-en' /tmp/docs-smoke.html; then
                echo "::warning::still serving public/logo img path"
              else
                echo "logo markup: (no known marker — check HTML manually)"
              fi
              head -c 180 /tmp/docs-smoke.html; echo
              exit 0
            fi
          done
          echo "::warning::Smoke did not get HTTP 200 yet (DNS/propagation). Worker deploy step already succeeded."
