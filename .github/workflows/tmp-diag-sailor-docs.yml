name: TMP Diag Sailor Docs
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH diagnose
        env:
          KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY || secrets.VM_SSH_PRIVATE_KEY }}
          HOST: ${{ vars.ECS_HOST || vars.VM_HOST }}
          USER: ${{ vars.ECS_USER || vars.VM_USER || 'root' }}
          KNOWN: ${{ secrets.ECS_SSH_KNOWN_HOSTS || secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${KNOWN:-}" ]; then echo "$KNOWN" > ~/.ssh/known_hosts; else ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; fi
          ssh -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" 'bash -s' <<'REMOTE'
          set -x
          pm2 list || true
          pm2 logs sailor-docs --lines 80 --nostream || pm2 logs --lines 80 --nostream || true
          curl -sS -o /tmp/local.html -w "local3005:%{http_code}\n" --max-time 10 http://127.0.0.1:3005/en || true
          head -c 300 /tmp/local.html || true
          ls -la /var/www/nebutra/sailor-docs/current/apps/sailor-docs 2>/dev/null | head -20 || ls -la /var/www/nebutra/sailor-docs/ 2>/dev/null | head -20
          REMOTE
