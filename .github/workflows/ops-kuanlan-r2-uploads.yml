name: Ops — Kuanlan R2 uploads token

# Moments list nebutra-uploads over S3. The shared R2_* GitHub secret is the
# assets seeder and is AccessDenied on that bucket. This dispatch mints an
# Object Read & Write token and restages it onto Fly nebutra-kuanlan only.
# It never prints the secret. Re-run only when ListObjects is 403 again.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why (run summary)"
        required: false
        default: "kuanlan Moments ListObjects AccessDenied"

permissions:
  contents: read

concurrency:
  group: ops-kuanlan-r2-uploads
  cancel-in-progress: false

jobs:
  restage:
    name: Mint token and restage Fly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Create token and set Fly secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a4248a5738df319996a70092fe598d37' }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set"
            exit 1
          fi
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN is not set"
            exit 1
          fi
          bash infra/ops/scripts/provision-kuanlan-r2-uploads-token.sh
