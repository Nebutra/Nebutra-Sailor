name: Deploy Landing (Vercel)

# nebutra.com ships from this workflow only.
#
# The build runs here, on GitHub's runners (free for this public repository),
# and Vercel receives the finished `.vercel/output` through
# `vercel deploy --prebuilt`. Vercel meters no build minutes for landing.
#
# The project's Git integration is switched off in apps/landing/vercel.json
# (`git.deploymentEnabled: false`). Before that, a main push that touched
# packages/design/ui opened a remote build through the Git integration *and* a
# second one from this workflow, and a nightly unconditional redeploy — a
# retry left over from the Hobby daily cap — rebuilt an unchanged site every
# evening. Those two were most of the landing line on the Vercel bill. The
# ignoreCommand in vercel.json stays for the day the integration is re-enabled.
#
# History: the project's dashboard Root Directory once pointed at the renamed
# apps/landing-page and every build failed before compiling; the cause lived in
# Vercel, not the repository. The reconcile step still corrects that setting
# from CI before deploying so the same drift cannot silently stop deployments.
#
# workflow_dispatch with `promote: false` builds and uploads a preview URL only.
# By default that dry run still builds with the *production* environment
# variables, so it rehearses exactly what the next main push will ship;
# `environment: preview` builds with the preview set instead.

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/commerce/marketing/**"
      - "packages/design/ui/**"
      - "packages/design/tokens/**"
      - "packages/platform/i18n/**"
      - ".github/workflows/deploy-landing-vercel.yml"
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote to production (nebutra.com). false = preview URL only"
        type: boolean
        default: true
      environment:
        description: "Env vars to build with when not promoting (a promotion always uses production)"
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

concurrency:
  group: deploy-landing-vercel
  cancel-in-progress: true

jobs:
  vercel:
    name: Build on GitHub, deploy prebuilt to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
      # A push to main is always production. A manual run promotes unless the
      # operator asked for a preview.
      PROMOTE: ${{ github.event_name == 'push' || inputs.promote == true }}
      BUILD_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # `vercel build` runs the project's own installCommand, so only the
      # toolchain is set up here; the pnpm store cache still applies.
      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Resolve project and reconcile Root Directory
        id: project
        env:
          EXPECTED_ROOT: apps/landing
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not set"; exit 1
          fi

          api() { curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "$@"; }

          # Resolve by name rather than a stored id. The project this deploys is
          # whichever one serves nebutra.com; hardcoding an id in repository
          # variables is one more thing that can go stale unnoticed.
          api "https://api.vercel.com/v9/projects?teamId=${VERCEL_ORG_ID}&limit=100" > projects.json
          cat > resolve.py <<'PYEOF'
          import json, sys
          data = json.load(open(sys.argv[1]))
          names = {p["name"]: p for p in data.get("projects", [])}
          for candidate in ("nebutra-landing", "landing", "nebutra-landing-page", "landing-page"):
              if candidate in names:
                  p = names[candidate]
                  print("PROJECT_ID=" + p["id"])
                  print("CURRENT_ROOT=" + (p.get("rootDirectory") or "(none)"))
                  break
          else:
              print("Projects found: " + ", ".join(sorted(names)), file=sys.stderr)
          PYEOF
          # The heredoc carries the YAML block indentation into the file; strip it
          # or python refuses the first line.
          sed -i 's/^          //' resolve.py
          python3 resolve.py projects.json > resolved.env
          cat resolved.env
          set -a; . ./resolved.env 2>/dev/null || true; set +a

          if [ -z "${PROJECT_ID:-}" ]; then
            echo "::error::Could not find the landing project by name — see the list above"
            exit 1
          fi
          echo "project=$PROJECT_ID rootDirectory=$CURRENT_ROOT"
          echo "id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

          echo "Attaching domain open.nebutra.com (idempotent)"
          curl -sS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}" \
            -d '{"name":"open.nebutra.com"}' > domain-open.json || true
          python3 -c 'import json; d=json.load(open("domain-open.json")); print("domain", d.get("name") or d.get("error",{}).get("code"), d.get("verified", d.get("error")))' || true

          if [ "$CURRENT_ROOT" != "$EXPECTED_ROOT" ]; then
            echo "::warning::Root Directory was '$CURRENT_ROOT', correcting to '$EXPECTED_ROOT'"
            api -X PATCH -H 'Content-Type: application/json' \
              "https://api.vercel.com/v9/projects/${PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
              -d "{\"rootDirectory\":\"${EXPECTED_ROOT}\"}" > /dev/null
          fi

      - name: Build here, deploy prebuilt
        id: deploy
        env:
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          set -euo pipefail
          npm i -g vercel@56.5.0

          # Link from the repository root: the project's Root Directory (just
          # reconciled) selects apps/landing, and the CLI runs the install and
          # build commands from apps/landing/vercel.json inside it. Output lands
          # in .vercel/output at the root, where `deploy --prebuilt` expects it.
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "${VERCEL_ORG_ID:-}" > .vercel/project.json

          # A promotion always builds with the production environment. A dry
          # run builds with production too unless asked for preview, so it
          # rehearses exactly what the next main push will ship.
          if [ "$PROMOTE" = "true" ]; then
            environment=production
            prod_flag=--prod
          else
            environment="${BUILD_ENVIRONMENT:-production}"
            prod_flag=
          fi
          echo "env=$environment promote=$PROMOTE"

          vercel pull --yes --environment="$environment" --token="$VERCEL_TOKEN" --scope "${VERCEL_ORG_ID:-}"

          # Variables marked Sensitive in the dashboard cannot be pulled; the
          # CLI writes them with an empty value. On 2026-09-02 that made
          # NEXT_PUBLIC_SITE_URL="" and the first production build died in
          # `new URL("")` while collecting /_not-found — production only,
          # because preview never defined the variable and the code's own
          # default applied. Drop the empties so defaults apply here as well.
          envfile=".vercel/.env.${environment}.local"
          if [ -f "$envfile" ]; then
            empties=$(grep -cE "^[A-Za-z_][A-Za-z0-9_]*=(\"\"|''|)$" "$envfile" || true)
            sed -i -E "/^[A-Za-z_][A-Za-z0-9_]*=(\"\"|''|)$/d" "$envfile"
            echo "pulled ${envfile}: dropped ${empties} empty (Sensitive) entries"
          fi

          # The public URLs declared in apps/landing/vercel.json `env` are what
          # Vercel applies on its own builders. Exported here so the prebuilt
          # output is built against the same values regardless of how the
          # dashboard copies are flagged.
          while IFS='=' read -r key value; do
            [ -n "$key" ] && export "$key=$value"
          done < <(node -e '
            const env = require("./apps/landing/vercel.json").env ?? {};
            for (const [k, v] of Object.entries(env)) console.log(`${k}=${v}`);
          ')
          export VERCEL_ENV="$environment"

          # Same @vercel/next builder Vercel would run remotely, on this runner.
          # shellcheck disable=SC2086
          vercel build $prod_flag --yes --token="$VERCEL_TOKEN"

          # Upload only .vercel/output. --archive=tgz keeps the traced function
          # bundles under the CLI's file-count limit as one tarball.
          set +e
          # shellcheck disable=SC2086
          vercel deploy --prebuilt $prod_flag --yes --archive=tgz \
            --token="$VERCEL_TOKEN" --scope "${VERCEL_ORG_ID:-}" \
            > deploy-url.txt 2> deploy-log.txt
          code=$?
          set -e
          cat deploy-log.txt
          if [ "$code" -ne 0 ]; then
            {
              echo "### Not deployed"
              echo
              if [ "$PROMOTE" = "true" ]; then
                echo "Vercel refused the upload, so **nebutra.com still serves the previous build**."
              else
                echo "Vercel refused the preview upload."
              fi
              echo "The build itself succeeded on this runner; see the log above for the reason."
              echo
              echo '```'
              tail -5 deploy-log.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::vercel deploy --prebuilt failed (exit $code)"
            exit "$code"
          fi
          url=$(tail -1 deploy-url.txt | tr -d '[:space:]')
          echo "deployment=$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed ($environment)"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke nebutra.com
        if: env.PROMOTE == 'true'
        run: |
          set -euo pipefail
          # Cache-busting path: the marketing pages are statically cached, so a
          # plain request can return the previous build and look like success.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://nebutra.com/?ci=${GITHUB_SHA}")
          echo "nebutra.com → HTTP $code"
          [ "$code" = "200" ]

      - name: Smoke preview URL
        if: env.PROMOTE != 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # Preview deployments on a team may sit behind Vercel Authentication;
          # 401 there still proves the upload is live and routable.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -L "$URL/?ci=${GITHUB_SHA}")
          echo "$URL → HTTP $code"
          case "$code" in
            200|401) ;;
            *) echo "::error::preview did not answer"; exit 1 ;;
          esac
