name: Point docs DNS

# Cut docs.nebutra.com between Vercel, Cloudflare Worker, and ECS origin.
# Default emergency path while Vercel Hobby is capped and Workers token may
# lack deploy scope: target=ecs.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "DNS target"
        required: true
        default: ecs
        type: choice
        options:
          - ecs
          - cloudflare-worker
          - vercel

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Point DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          ECS_HOST: ${{ vars.VM_HOST || vars.ECS_HOST || '106.15.4.31' }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            ecs)
              bash infra/ops/scripts/point-docs-dns-ecs.sh
              ;;
            cloudflare-worker)
              bash infra/ops/scripts/point-docs-dns-cloudflare-worker.sh
              ;;
            vercel)
              bash infra/ops/scripts/point-docs-dns-vercel.sh
              ;;
            *)
              echo "::error::unknown target $TARGET"
              exit 1
              ;;
          esac

      - name: Smoke (no follow)
        run: |
          set -euo pipefail
          echo "=== headers ==="
          curl -sSI --max-redirs 0 --max-time 20 https://docs.nebutra.com/en | head -25 || true
          echo "=== body logo markers ==="
          code=$(curl -sS -o /tmp/docs.html -w '%{http_code}' --max-time 30 -L https://docs.nebutra.com/en || echo 000)
          echo "GET /en -> $code"
          if [ "$code" = "200" ]; then
            if grep -qE '535\.71|currentColor|text-brand-mark' /tmp/docs.html; then
              echo "logo: inline SVG markers present"
            elif grep -qi 'logo-horizontal-en' /tmp/docs.html; then
              echo "::warning::still serving public/logo img path"
            fi
          fi
