name: Deploy Hono origin to Fly

# The Node api-gateway is not a Next standalone app. Do not fold it into
# deploy-fly.yml — that workflow assembles .next/standalone and would ship
# an empty image for Hono.
#
# REQUIRED: repository secret FLY_API_TOKEN (deploy-scoped).

on:
  workflow_dispatch:
    inputs:
      cutover:
        description: "After a healthy Fly URL, point grey-cloud origin.nebutra.com at the app"
        required: false
        default: "false"
        type: boolean
      diagnostics:
        description: "Read KCQ database connectivity without deploying or exposing records"
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main]
    paths:
      - "backends/gateway/**"
      - "infra/fly/gateway.toml"
      - "ops/nebutra/offers.json"
      - "infra/runtime/docker/Dockerfile.gateway"
      - ".github/workflows/deploy-fly-gateway.yml"

permissions:
  contents: read

# A cutover run points DNS and issues certificates; a push that lands mid-way
# must not cancel it (it did, twice, on acme). It gets its own group and is
# never cancelled; ordinary deploys still supersede each other.
concurrency:
  group: deploy-fly-gateway-${{ github.ref }}${{ github.event.inputs.cutover == 'true' && '-cutover' || '' }}
  cancel-in-progress: ${{ github.event.inputs.cutover != 'true' }}

jobs:
  diagnostics:
    if: inputs.diagnostics == true
    name: Inspect KCQ database boundary
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Read connection and schema availability
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import re, shlex, subprocess
          code = '''
          import { getSystemDb, getTenantDb } from "/app/node_modules/@nebutra/db/dist/index.js";
          const system = getSystemDb();
          for (const [name, query] of [
            ["users", () => system.user.count()],
            ["tenants", () => system.tenant.count()],
            ["market-system", () => system.marketDataConnection.count()],
            ["market-rls", () => getTenantDb("kcq-readonly-diagnostics").marketDataConnection.count()],
          ]) {
            try { await query(); console.info(name + ": available"); }
            catch (error) { console.info(name + ": " + JSON.stringify({name:error.name, code:error.code, causeCode:error.cause?.code, databaseCode:error.meta?.driverAdapterError?.cause?.originalCode})); }
          }
          await system.$disconnect();
          '''
          subprocess.run(["flyctl", "ssh", "console", "-a", "nebutra-gateway", "-C", shlex.join(["node", "--input-type=module", "-e", code])], check=True)
          # Print known failure categories, never Prisma arguments or customer data.
          logs = subprocess.run(["flyctl", "logs", "-a", "nebutra-gateway", "--no-tail"], capture_output=True, text=True, check=True).stdout
          for marker in ["Unique constraint failed", "Foreign key constraint violated", "does not exist", "permission denied", "Tenant ID mismatch", "KCQ market request failed"]:
              print("runtime category " + marker + ": " + str(logs.count(marker)))
          for line in logs.splitlines():
              if "KCQ market request failed" in line:
                  print("KCQ failure fingerprint: " + str(re.findall(r'TypeError|P[0-9]{4}|/app/[A-Za-z0-9_./@+-]+:[0-9]+:[0-9]+', line)))
          PY
  database:
    if: inputs.diagnostics != true
    # Schema first, apps second: the database is brought to this commit's
    # schema before anything that reads it ships. No pending migration → a
    # quick no-op. It fails closed — a drifted database stops the deploy.
    name: Database
    uses: ./.github/workflows/ops-database-migrate.yml
    with:
      action: deploy
    secrets: inherit

  deploy:
    if: inputs.diagnostics != true
    name: Fly Hono origin
    needs: database
    runs-on: ubuntu-latest
    steps:
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Set repository secret FLY_API_TOKEN (deploy token). Chat tokens were revoked."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Ensure Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          org="$(bash infra/ops/scripts/resolve-fly-org.sh)"
          echo "FLY_ORG=$org" >> "$GITHUB_ENV"
          echo "using Fly org $org"
          if flyctl apps list --json | python3 -c "import json,sys; names={a.get('Name') or a.get('name') for a in json.load(sys.stdin)}; sys.exit(0 if 'nebutra-gateway' in names else 1)"; then
            echo "app nebutra-gateway exists"
          else
            flyctl apps create nebutra-gateway --machines --org "$org" --yes
          fi

      - name: Import ECS api env if present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VM_HOST: ${{ vars.VM_HOST || vars.ECS_HOST }}
          VM_USER: ${{ vars.VM_USER || vars.ECS_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY || secrets.ECS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VM_HOST:-}" ] || [ -z "${VM_SSH_PRIVATE_KEY:-}" ]; then
            echo "No VM SSH — skip secret import. Set fly secrets later."
            exit 0
          fi
          env_path="/var/www/nebutra/api/.env"
          install -m 600 /dev/null "$RUNNER_TEMP/vm_key"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm_key"
          if ssh -i "$RUNNER_TEMP/vm_key" -o StrictHostKeyChecking=accept-new \
            "${VM_USER}@${VM_HOST}" "test -f $env_path"; then
            ssh -i "$RUNNER_TEMP/vm_key" -o StrictHostKeyChecking=accept-new \
              "${VM_USER}@${VM_HOST}" "cat $env_path" \
              | python3 -c '
          import sys
          # Bind vars belong to Fly. CACHE_BACKEND=ioredis and
          # REDIS_URL=redis://127.0.0.1:6379 describe the local Redis on the VM;
          # imported onto a Machine that has none, every Redis call fails and
          # every rate-limited route answers 500 while health stays 200
          # (2026-09-02). The origin reaches Redis over REST via the REST front in nebutra-redis.
          # No apostrophes in this block: it lives inside a single-quoted
          # python -c string, and one ended it on the first run.
          skip = {"HOSTNAME", "PORT", "HOST", "PWD", "CACHE_BACKEND", "REDIS_URL"}
          for line in sys.stdin:
              raw = line.strip()
              if not raw or raw.startswith("#"):
                  continue
              key = raw.split("=", 1)[0].strip()
              if key.startswith("export "):
                  key = key[7:].strip()
              if key in skip:
                  continue
              sys.stdout.write(line)
          ' | flyctl secrets import -a nebutra-gateway --stage \
              || echo "::warning::fly secrets import failed for nebutra-gateway"
          else
            echo "No $env_path on VM — skip."
          fi
          rm -f "$RUNNER_TEMP/vm_key"
          flyctl secrets unset HOSTNAME PORT HOST CACHE_BACKEND REDIS_URL -a nebutra-gateway --stage \
            || echo "no leftover bind or local-Redis secrets"
          flyctl secrets set HOST=0.0.0.0 PORT=8080 -a nebutra-gateway --stage

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build Hono bundle
        run: |
          set -euo pipefail
          pnpm turbo build --filter="@nebutra/gateway^..." --filter=@nebutra/ui
          pnpm --filter @nebutra/gateway build
          STAGE="$RUNNER_TEMP/stage-gateway"
          rm -rf "$STAGE"
          pnpm --config.trust-policy=permissive deploy \
            --filter @nebutra/gateway --prod --legacy "$STAGE"
          node scripts/prepare-pnpm-deploy-node-runtime.mjs "$STAGE"
          node --check "$STAGE/dist/node.js"
          mkdir -p "$STAGE/node_modules/@nebutra/ui"
          cp packages/design/ui/package.json "$STAGE/node_modules/@nebutra/ui/"
          cp -R packages/design/ui/dist "$STAGE/node_modules/@nebutra/ui/dist"
          cp infra/runtime/docker/Dockerfile.gateway "$STAGE/Dockerfile"
          bash infra/ops/scripts/materialize-pnpm-deploy-bundle.sh "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Ensure existing shared vault configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VAULT_LOCAL_MASTER_KEY: ${{ secrets.VAULT_LOCAL_MASTER_KEY }}
        run: |
          set -euo pipefail
          # Preserve configured encryption keys: this is bootstrap, never rotation.
          flyctl secrets list -a nebutra-gateway --json > "$RUNNER_TEMP/gateway-secret-names.json"
          configured=$(python3 -c 'import json,sys; names={s.get("Name") or s.get("name") for s in json.load(open(sys.argv[1]))}; print("yes" if names & {"VAULT_LOCAL_MASTER_KEY", "VAULT_MASTER_KEY", "AWS_KMS_KEY_ID", "AWS_KMS_KEY_ARN"} else "no")' "$RUNNER_TEMP/gateway-secret-names.json")
          if [ "$configured" = "yes" ]; then
            echo "Gateway vault already configured; preserving it."
          else
            test -n "${VAULT_LOCAL_MASTER_KEY:-}" || { echo "::error::Shared vault key is missing"; exit 1; }
            flyctl secrets set -a nebutra-gateway --stage "VAULT_LOCAL_MASTER_KEY=$VAULT_LOCAL_MASTER_KEY"
          fi

      - name: Deploy Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # The price list is data in the repo (ADR 2026-09-27): a catalog edit
          # ships with the next deploy, and a malformed one fails the boot.
          flyctl deploy "$STAGE" \
            --config "$GITHUB_WORKSPACE/infra/fly/gateway.toml" \
            --dockerfile "$STAGE/Dockerfile" \
            --env BILLING_OFFERS_JSON="$(jq -c . "$GITHUB_WORKSPACE/ops/nebutra/offers.json")" \
            --ha=false \
            --remote-only \
            --yes

      - name: Smoke Fly URL
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          url="https://nebutra-gateway.fly.dev/api/misc/health"
          code="000"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "GET $url try $i -> $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          flyctl status -a nebutra-gateway || true
          flyctl logs -a nebutra-gateway --no-tail || true
          echo "::error::$url is not healthy ($code). DNS will not cut over."
          exit 1

      - name: Cut over grey-cloud origin DNS
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.cutover == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOST: origin
          FLY_APP: nebutra-gateway
        run: bash infra/ops/scripts/point-origin-dns-fly.sh
