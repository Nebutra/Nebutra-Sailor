name: Deploy Auth Center (Vercel)

# Login center on Vercel — same pattern as web. ECS keeps api + sso only;
# auth is multi-app RP session authority on the edge when DNS is flipped.
# Hobby: narrow paths, cancel superseded runs, --archive=tgz; manual retry only.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/auth/**"
      - "apps/auth/vercel.json"
      - "packages/iam/auth/**"
      - "packages/iam/captcha/**"
      - "packages/platform/db/**"
      - "packages/platform/i18n/**"
      - "packages/platform/logger/**"
      - "packages/design/brand/**"
      - "packages/design/ui/**"
      - "packages/design/tokens/**"
      - "packages/design/design-tokens/**"
      - "packages/design/icons/**"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-auth-vercel.yml"
  # No daily cron — same rationale as deploy-web (ECS primary; manual retry).

permissions:
  contents: read

concurrency:
  group: deploy-auth-vercel-production
  cancel-in-progress: true

jobs:
  vercel:
    name: Trigger Vercel production
    runs-on: ubuntu-latest
    # Production path is Cloudflare Workers. Vercel is emergency-only:
    # require explicit DEPLOY_TARGET_AUTH=vercel, or manual workflow_dispatch.
    if: >-
      vars.DEPLOY_TARGET_AUTH == 'vercel' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_AUTH_PROJECT_ID || vars.VERCEL_AUTH_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::notice::VERCEL_TOKEN not set — relying on Vercel Git integration only."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::Set VERCEL_AUTH_PROJECT_ID (prj_…) for the auth Vercel project"
            exit 1
          fi
          npm i -g vercel@56.5.0
          # Deploy from monorepo root. Dashboard Root Directory is already
          # apps/auth — do NOT also pass --cwd apps/auth (doubles path).
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"projectId":"${VERCEL_PROJECT_ID}","orgId":"${VERCEL_ORG_ID:-}"}
          EOF
          set +e
          out=$(vercel deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN" \
            --scope "${VERCEL_ORG_ID:-}" 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            if echo "$out" | grep -qiE 'api-deployments-free-per-day|Resource is limited|try again in 24 hours|Upload aborted'; then
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              {
                echo "### Not deployed"
                echo
                echo "Vercel refused the deployment — **auth.nebutra.com still serves the previous build**."
                echo "After the cap resets (~24h), re-run **Deploy Auth Center (Vercel)** via workflow_dispatch."
                echo
                echo '```'
                echo "$out" | tail -5
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Vercel Hobby daily deploy quota exhausted / upload deferred. Retry after ~24h via workflow_dispatch."
              exit 0
            fi
            exit "$code"
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Smoke Vercel alias + optional production host
        if: steps.deploy.outputs.deployed != 'false'
        run: |
          set -euo pipefail
          # Prefer project alias (always Vercel iad1) — production DNS may still be ECS.
          for url in \
            https://nebutra-auth.vercel.app/health \
            https://auth.nebutra.com/health
          do
            code=$(curl -sS -o /tmp/auth-health.json -w '%{http_code}' --max-time 30 "$url" || echo 000)
            echo "GET $url -> $code"
            if [ "$code" = "200" ]; then
              head -c 400 /tmp/auth-health.json || true
              echo
            fi
          done
          # Google pairing on Vercel alias (proves overseas egress for OAuth).
          code=$(curl -sS -o /tmp/auth-g.json -w '%{http_code}' --max-time 40 \
            'https://nebutra-auth.vercel.app/health?probe=google' || echo 000)
          echo "GET nebutra-auth.vercel.app/health?probe=google -> $code"
          if [ "$code" = "200" ]; then
            python3 -c 'import json; d=json.load(open("/tmp/auth-g.json")); print(json.dumps((d.get("oauth") or {}).get("googlePairing"), indent=2))' || true
            status=$(python3 -c 'import json; d=json.load(open("/tmp/auth-g.json")); print(((d.get("oauth") or {}).get("googlePairing") or {}).get("status") or "")' || true)
            if [ "$status" = "pair_ok" ]; then
              echo "Vercel origin can reach Google token endpoint — safe for DNS cutover."
            elif [ "$status" = "network_error" ]; then
              echo "::warning::Vercel alias still network_error (unexpected for iad1)."
            elif [ "$status" = "invalid_client" ]; then
              echo "::error::GOOGLE_CLIENT_SECRET on Vercel does not match GOOGLE_CLIENT_ID"
              exit 1
            elif [ -z "$status" ]; then
              echo "::notice::probe endpoint not on this build yet (older deployment)."
            fi
          fi
