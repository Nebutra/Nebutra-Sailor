name: Ops — landing Upstash + Vercel teardown

# One-shot migration helper (2026-09-22), deleted once Vercel is gone.
#
# Job 1 normalizes the shared Upstash REST credentials (GitHub stores the host
# without a scheme; landing's env schema wants a URL), proves them with a PING,
# and only then sets them on the nebutra-landing Machine. Nothing is printed
# except pass/fail — no secret values.
#
# Job 2 deletes the Vercel projects this repository used to ship to. Every host
# they served is already on Fly or ECS; the projects only feed preview
# deployment noise (and a Pro-plan line item) now.

on:
  workflow_dispatch:
    inputs:
      teardown:
        description: "Delete the Vercel projects. false = only fix landing Upstash"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  landing-upstash:
    name: Normalize + verify Upstash for landing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: PING Upstash, then set on the Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail
          url="${UPSTASH_REDIS_REST_URL:-}"
          token="${UPSTASH_REDIS_REST_TOKEN:-}"
          if [ -z "$url" ] || [ -z "$token" ]; then
            echo "::warning::UPSTASH_REDIS_REST_* secrets missing; leaving landing unconfigured"
            exit 0
          fi
          case "$url" in
            http://*|https://*) ;;
            *) url="https://${url}" ;;
          esac
          url="${url%/}"
          echo "scheme=ok host_len=${#url}"
          code=$(curl -sS -o /tmp/ping.json -w '%{http_code}' --max-time 30 \
            -X POST "$url" -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" -d '["PING"]' || echo 000)
          echo "ping_http=$code"
          if [ "$code" != "200" ] || ! grep -q PONG /tmp/ping.json; then
            echo "::error::Upstash REST did not answer PONG; leaving landing unconfigured (status falls back to memory)"
            exit 1
          fi
          flyctl secrets set \
            UPSTASH_REDIS_REST_URL="$url" \
            UPSTASH_REDIS_REST_TOKEN="$token" \
            -a nebutra-landing
          rm -f /tmp/ping.json

  teardown:
    name: Delete retired Vercel projects
    if: inputs.teardown == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete projects by name
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN missing"; exit 1; }
          python3 <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ.get("VERCEL_ORG_ID") or ""
          api = "https://api.vercel.com"

          CANDIDATES = {
              "nebutra-landing", "landing", "nebutra-landing-page", "landing-page",
              "nebutra-web", "nebutra-auth", "nebutra-pebble", "pebble", "pebble-site",
              "nebutra-kuanlan", "docs", "nebutra-sailor-docs",
              "nebutra-carina", "carina", "carina-docs",
              "nebutra-router", "nebutra-forge", "nebutra-studio", "studio",
          }

          def call(method, path):
              req = urllib.request.Request(
                  api + path,
                  headers={"Authorization": f"Bearer {token}"},
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      body = r.read().decode()
                      return r.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")

          q = f"?teamId={team}&limit=100" if team else "?limit=100"
          status, data = call("GET", f"/v9/projects{q}")
          if status != 200:
              raise SystemExit(f"list failed: HTTP {status} {data}")
          projects = data.get("projects") or []
          targets = [p for p in projects if p.get("name") in CANDIDATES]
          print("found", len(projects), "projects;", len(targets), "to delete")
          for p in targets:
              pid = p["id"]
              sep = "&" if q else "?"
              status, body = call("DELETE", f"/v9/projects/{pid}{q}{sep}softDelete=false")
              state = "deleted" if status in (200, 204) else f"HTTP {status} {body.get('error', {}).get('code', '')}"
              print(f"  {p['name']}: {state}")
          print("teardown done")
          PY
