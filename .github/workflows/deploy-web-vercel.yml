name: Deploy Web (Vercel)

# Optional edge host for app.nebutra.com. Production DNS still prefers ECS
# (see docs/ops/web-auth-vercel-cutover.md). This workflow is the CLI re-trigger
# path; Git integration uses scripts/vercel-ignore-build.sh and skips ECS-
# primary apps unless opted in.
#
# Hobby (~100 deploys/day team-wide): keep path filters aligned with the
# ignore-script web scope — never packages/** — cancel superseded runs, and
# upload with --archive=tgz to avoid the monorepo 15k-file CLI limit.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/web/vercel.json"
      # Match scripts/vercel-ignore-build.sh apps/web scope (not packages/**)
      - "packages/commerce/**"
      - "packages/design/**"
      - "packages/iam/**"
      - "packages/platform/**"
      - "packages/integrations/**"
      - "packages/ai/agents/**"
      - "packages/ai/agent-runtime/**"
      - "packages/ai/startup-os/**"
      - "packages/ai/cinema/**"
      - "packages/ai/reel/**"
      - "packages/ai/atelier-canvas/**"
      - "packages/ops/preset/**"
      - "packages/ops/sanity/**"
      - "packages/ops/china-compliance/**"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-web-vercel.yml"
  # No daily cron: production is ECS; a scheduled Vercel deploy would burn
  # Hobby quota every day even when nothing was deferred. After a cap miss,
  # re-run this workflow manually (workflow_dispatch).

permissions:
  contents: read

concurrency:
  group: deploy-web-vercel-production
  cancel-in-progress: true

jobs:
  vercel:
    name: Trigger Vercel production
    runs-on: ubuntu-latest
    if: >-
      vars.DEPLOY_TARGET_WEB == 'vercel' ||
      vars.DEPLOY_TARGET_WEB == '' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID || vars.VERCEL_WEB_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::notice::VERCEL_TOKEN not set — relying on Vercel Git integration only."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::Set VERCEL_WEB_PROJECT_ID (prj_…) for the web Vercel project"
            exit 1
          fi
          npm i -g vercel@56.5.0
          # Deploy from monorepo root. Dashboard Root Directory is already
          # apps/web — do NOT also pass --cwd apps/web (doubles the path).
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"projectId":"${VERCEL_PROJECT_ID}","orgId":"${VERCEL_ORG_ID:-}"}
          EOF
          # --archive=tgz: single tarball upload; avoids 15k-file CLI limit and
          # shrinks monorepo transfer (pairs with root .vercelignore).
          set +e
          out=$(vercel deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN" \
            --scope "${VERCEL_ORG_ID:-}" 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            if echo "$out" | grep -qiE 'api-deployments-free-per-day|Resource is limited|try again in 24 hours|Upload aborted'; then
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              {
                echo "### Not deployed"
                echo
                echo "Vercel refused the deployment, so **app.nebutra.com still serves the previous build** (or ECS if DNS points there)."
                echo "This job is green because the commit is fine — but nothing new shipped on Vercel."
                echo "After the cap resets (~24h), re-run **Deploy Web (Vercel)** via workflow_dispatch."
                echo
                echo '```'
                echo "$out" | tail -5
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Vercel Hobby daily deploy quota exhausted / upload deferred. Retry after ~24h via workflow_dispatch."
              exit 0
            fi
            exit "$code"
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Smoke app.nebutra.com
        if: steps.deploy.outputs.deployed != 'false'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -L "https://app.nebutra.com/?ci=${GITHUB_SHA}" || echo 000)
          echo "GET https://app.nebutra.com/ -> $code"
          if [ "$code" != "200" ] && [ "$code" != "307" ] && [ "$code" != "302" ]; then
            echo "::warning::app.nebutra.com not healthy yet (DNS may still point at ECS)."
          fi
