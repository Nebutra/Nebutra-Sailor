# governance-green-recheck
name: UI Governance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/setup-node-pnpm/action.yml"
      - ".github/workflows/ui-governance.yml"
      - "apps/design-docs/**"
      - "apps/landing/src/**"
      - "apps/web/src/**"
      - "package.json"
      - "packages/design/**"
      - "pnpm-lock.yaml"
      - "scripts/lib/ui-governance-policy.ts"
      - "scripts/validate-ui-governance-policy.ts"
      - "scripts/verify-brand-token-sync.ts"
      - "scripts/verify-theme-quality.mts"
      - "scripts/verify-ui-governance.ts"
      - "tests/architecture/governance/**"
  push:
    branches: [main]
    paths:
      - ".github/actions/setup-node-pnpm/action.yml"
      - ".github/workflows/ui-governance.yml"
      - "apps/design-docs/**"
      - "apps/landing/src/**"
      - "apps/web/src/**"
      - "package.json"
      - "packages/design/**"
      - "pnpm-lock.yaml"
      - "scripts/lib/ui-governance-policy.ts"
      - "scripts/validate-ui-governance-policy.ts"
      - "scripts/verify-brand-token-sync.ts"
      - "scripts/verify-theme-quality.mts"
      - "scripts/verify-ui-governance.ts"
      - "tests/architecture/governance/**"

permissions:
  contents: read

jobs:
  ui-governance:
    name: UI Governance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Validate UI Governance Policy Schema
        run: pnpm exec tsx scripts/validate-ui-governance-policy.ts

      - name: Verify Brand Token Sync
        run: pnpm exec tsx scripts/verify-brand-token-sync.ts

      - name: Verify Theme Quality
        run: pnpm exec tsx scripts/verify-theme-quality.mts packages/design/design-tokens/tokens/themes/*.json

      - name: Verify UI Governance Rules
        run: pnpm exec tsx scripts/verify-ui-governance.ts

      - name: Refresh Design Docs Registry
        run: pnpm --config.verify-deps-before-run=false --filter @nebutra/design-docs prebuild

      - name: Verify Design Docs Governance
        run: pnpm --config.verify-deps-before-run=false --filter @nebutra/design-docs docs:governance

      - name: Verify Design Docs Registry Freshness
        run: |
          git diff --exit-code -- \
            apps/design-docs/public/r \
            apps/design-docs/public/registry.json \
            apps/design-docs/public/agent \
            apps/design-docs/public/agent-manifest.json \
            apps/design-docs/public/previews-index.json \
            apps/design-docs/src/__registry__/index.tsx \
            apps/design-docs/src/__registry__/file-map.json

      - name: Verify Design Docs Runtime Contract
        run: |
          pnpm --config.verify-deps-before-run=false --filter @nebutra/design-docs typecheck
          pnpm --config.verify-deps-before-run=false --filter @nebutra/design-docs build
