name: Bootstrap forge-dns-leak on ECS

# SSH to the Cloud VM, ensure ecosystem is current, setcap for :53, start PM2
# process forge-dns-leak, smoke localhost control API.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why (shown in summary)"
        required: false
        default: "bootstrap dns leak authority"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve SSH secrets
        id: ssh
        env:
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY || secrets.VM_SSH_PRIVATE_KEY || secrets.CLOUD_VM_SSH_PRIVATE_KEY }}
          ECS_SSH_KNOWN_HOSTS: ${{ secrets.ECS_SSH_KNOWN_HOSTS || secrets.VM_SSH_KNOWN_HOSTS || secrets.CLOUD_VM_SSH_KNOWN_HOSTS }}
          ECS_HOST: ${{ vars.ECS_HOST || vars.VM_HOST || '106.15.4.31' }}
          ECS_USER: ${{ vars.ECS_USER || vars.VM_USER || 'root' }}
          ECS_DEPLOY_ROOT: ${{ vars.ECS_DEPLOY_ROOT || vars.VM_DEPLOY_ROOT || '/var/www/nebutra' }}
        run: |
          set -euo pipefail
          test -n "${ECS_SSH_PRIVATE_KEY:-}" || { echo "::error::ECS_SSH_PRIVATE_KEY missing"; exit 1; }
          test -n "${ECS_SSH_KNOWN_HOSTS:-}" || { echo "::error::ECS_SSH_KNOWN_HOSTS missing"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$ECS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "host=$ECS_HOST" >> "$GITHUB_OUTPUT"
          echo "user=$ECS_USER" >> "$GITHUB_OUTPUT"
          echo "root=$ECS_DEPLOY_ROOT" >> "$GITHUB_OUTPUT"

      - name: Sync ecosystem + start forge-dns-leak
        env:
          HOST: ${{ steps.ssh.outputs.host }}
          USER: ${{ steps.ssh.outputs.user }}
          ROOT: ${{ steps.ssh.outputs.root }}
        run: |
          set -euo pipefail
          FORGE_CUR_HINT="${ROOT}/forge/current"
          # Push ecosystem + package sources (forge standalone may lack the package until next green deploy)
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            infra/iac/ecs/ecosystem.config.cjs \
            "${USER}@${HOST}:${ROOT}/ecosystem.config.cjs"
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "${USER}@${HOST}" \
            "mkdir -p ${ROOT}/forge/current/packages/ai"
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -r \
            packages/ai/forge-dns-leak \
            "${USER}@${HOST}:${ROOT}/forge/current/packages/ai/"

          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "${USER}@${HOST}" bash -s <<REMOTE
          set -euo pipefail
          ROOT="${ROOT}"
          FORGE_CUR="\$ROOT/forge/current"
          cd "\$FORGE_CUR"

          test -f packages/ai/forge-dns-leak/src/cli.ts || {
            echo "ERROR: packages/ai/forge-dns-leak/src/cli.ts missing after scp"
            exit 1
          }

          NODE_BIN=\$(command -v node)
          echo "node=\$NODE_BIN version=\$(\$NODE_BIN -v)"
          if command -v setcap >/dev/null 2>&1; then
            setcap 'cap_net_bind_service=+ep' "\$NODE_BIN" 2>/dev/null || true
            getcap "\$NODE_BIN" 2>/dev/null || true
          fi

          mkdir -p "\$ROOT/forge"
          touch "\$ROOT/forge/.env"
          grep -q '^FORGE_DNS_LEAK_URL=' "\$ROOT/forge/.env" 2>/dev/null \
            || echo 'FORGE_DNS_LEAK_URL=http://127.0.0.1:3953' >> "\$ROOT/forge/.env"

          if command -v ufw >/dev/null 2>&1; then
            ufw allow 53/udp || true
            ufw allow 53/tcp || true
          fi

          # Free port 53 if something else owns it (document only)
          ss -ulnp | grep ':53 ' || true

          pm2 delete forge-dns-leak >/dev/null 2>&1 || true

          # Prefer ecosystem; fall back to direct start if ecosystem path fails
          if ! pm2 start "\$ROOT/ecosystem.config.cjs" --only forge-dns-leak; then
            echo "ecosystem start failed — direct node start"
            FORGE_DNS_LEAK_ZONE=leak.nebutra.com \
            FORGE_DNS_LEAK_NS=ns1.leak.nebutra.com \
            FORGE_DNS_LEAK_ANSWER_IP=127.0.0.1 \
            FORGE_DNS_LEAK_DNS_HOST=0.0.0.0 \
            FORGE_DNS_LEAK_DNS_PORT=53 \
            FORGE_DNS_LEAK_API_HOST=127.0.0.1 \
            FORGE_DNS_LEAK_API_PORT=3953 \
            ENV_FILE="\$ROOT/forge/.env" \
            pm2 start "\$NODE_BIN" \
              --name forge-dns-leak \
              --cwd "\$FORGE_CUR" \
              -- --experimental-strip-types --no-warnings=ExperimentalWarning \
              packages/ai/forge-dns-leak/src/cli.ts
          fi
          pm2 save || true
          sleep 2
          pm2 describe forge-dns-leak | head -50 || true

          echo "=== health ==="
          if ! curl -fsS --max-time 5 http://127.0.0.1:3953/health; then
            echo
            echo "port 53 may be blocked — retry on 5353"
            pm2 delete forge-dns-leak >/dev/null 2>&1 || true
            FORGE_DNS_LEAK_ZONE=leak.nebutra.com \
            FORGE_DNS_LEAK_NS=ns1.leak.nebutra.com \
            FORGE_DNS_LEAK_ANSWER_IP=127.0.0.1 \
            FORGE_DNS_LEAK_DNS_HOST=0.0.0.0 \
            FORGE_DNS_LEAK_DNS_PORT=5353 \
            FORGE_DNS_LEAK_API_HOST=127.0.0.1 \
            FORGE_DNS_LEAK_API_PORT=3953 \
            ENV_FILE="\$ROOT/forge/.env" \
            pm2 start "\$NODE_BIN" \
              --name forge-dns-leak \
              --cwd "\$FORGE_CUR" \
              -- --experimental-strip-types --no-warnings=ExperimentalWarning \
              packages/ai/forge-dns-leak/src/cli.ts
            pm2 save || true
            sleep 2
            curl -fsS --max-time 5 http://127.0.0.1:3953/health
            echo
            echo "NOTE: listening on 5353 — need iptables DNAT 53→5353 or SG+SO_REUSE for :53"
          fi
          echo
          echo "=== listeners ==="
          ss -ulnp | grep -E ':(53|5353|3953) ' || true
          ss -tlnp | grep -E ':(53|5353|3953) ' || true
          pm2 logs forge-dns-leak --lines 20 --nostream || true
          REMOTE

      - name: Public DNS probe from runner
        run: |
          set -euo pipefail
          ORIGIN="${{ steps.ssh.outputs.host }}"
          dig @"$ORIGIN" SOA leak.nebutra.com +norecurse +time=5 || true
          dig @"$ORIGIN" A 1.test.s.leak.nebutra.com +norecurse +time=5 || true
