name: CodeQL Security Analysis

# Runs GitHub's CodeQL SAST scanner on TypeScript and Python source code.
# Results appear in the Security tab → Code scanning alerts.
#
# Branch protection requires both job names to report on every PR:
#   - CodeQL Analysis (javascript-typescript)
#   - CodeQL Analysis (python)
# A skipped matrix entry would leave the required check pending forever.
# Python therefore always reports, and only extracts when Python paths change.
#
# JavaScript/TypeScript extracts from source. A full pnpm install is not part
# of the extract and was the long pole on landing-only PRs (~5 minutes).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly scan — catches newly published CVEs in code that hasn't changed
    - cron: "0 19 * * 6"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-languages:
    name: Detect CodeQL languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.resolve.outputs.python }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect Python paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            python:
              - "**/*.py"
              - "**/*.pyi"
              - "backends/python/**"
              - "**/pyproject.toml"
              - "**/uv.lock"

      - name: Resolve
        id: resolve
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=${{ steps.filter.outputs.python }}" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: CodeQL Analysis (${{ matrix.language }})
    needs: detect-languages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Skip Python (no Python in this PR)
        if: matrix.language == 'python' && needs.detect-languages.outputs.python != 'true'
        run: echo "No Python paths changed; required check stays green without a full extract."

      - name: Checkout
        if: matrix.language != 'python' || needs.detect-languages.outputs.python == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        if: matrix.language != 'python' || needs.detect-languages.outputs.python == 'true'
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          # Dedicated config file owns all path exclusions and query filters
          # so they're version-controlled, reviewed on PR, and not buried inline.
          config-file: .github/codeql/codeql-config.yml

      # JS/TS extract reads source. Installing the workspace is not required
      # and was dominating wall-clock on small PRs. Keep the shared setup
      # action so the CI harness contract still holds.
      - name: Setup Node.js and pnpm
        if: matrix.language == 'javascript-typescript'
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Setup Python
        if: matrix.language == 'python' && needs.detect-languages.outputs.python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: matrix.language == 'python' && needs.detect-languages.outputs.python == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Perform CodeQL Analysis
        if: matrix.language != 'python' || needs.detect-languages.outputs.python == 'true'
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: "/language:${{ matrix.language }}"
          # Upload results as SARIF to GitHub Security tab
          upload: true
