name: Package Registry Governance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify GitHub Packages state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Verify package registry governance
        run: node scripts/verify-package-registry.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_GOVERNANCE_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGE_REGISTRY_REQUIRE_CONTAINER_AUDIT: ${{ secrets.PACKAGE_GOVERNANCE_TOKEN != '' && 'true' || 'false' }}
          PACKAGE_REGISTRY_VERIFY_NPMJS: "true"
