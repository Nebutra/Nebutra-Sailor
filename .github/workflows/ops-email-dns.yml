name: Ops — email sending DNS

# Applies infra/ops/email/resend-dns.json (Resend DKIM / SPF / return path)
# to Cloudflare. Idempotent: a re-run only touches records that drifted.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["infra/ops/email/resend-dns.json"]

permissions:
  contents: read

concurrency:
  group: ops-email-dns
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Apply records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 infra/ops/scripts/apply-dns-records.py infra/ops/email/resend-dns.json
