name: TMP Vercel Git Deploy Docs
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Create production deployment from main via API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_DOCS_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID || vars.VERCEL_DOCS_PROJECT_ID }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -X POST "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"docs\",
              \"project\": \"${VERCEL_DOCS_PROJECT_ID}\",
              \"target\": \"production\",
              \"gitSource\": {
                \"type\": \"github\",
                \"org\": \"Nebutra\",
                \"repo\": \"Nebutra-Sailor\",
                \"ref\": \"main\"
              }
            }")
          echo "$resp" | head -c 3000; echo
          echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); e=d.get("error") or {}; print("ERROR", e.get("code"), e.get("message")); print("URL", d.get("url")); print("ID", d.get("id")); print("READY", d.get("readyState"))'
