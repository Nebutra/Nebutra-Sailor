name: Public URL Smoke

on:
  workflow_dispatch:
    inputs:
      include_aliases:
        description: "Also check DNS/custom-domain aliases such as www and studio.nebutra.com"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: public-url-smoke
  cancel-in-progress: true

jobs:
  public-urls:
    name: Check public URLs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INCLUDE_ALIASES: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.include_aliases == 'true') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Check canonical public URLs
        run: |
          set -euo pipefail
          args=()
          if [ "${INCLUDE_ALIASES:-false}" = "true" ]; then
            args+=(--include-aliases)
          fi
          node scripts/check-public-urls.mjs "${args[@]}"
