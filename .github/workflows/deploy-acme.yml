name: Deploy acme (the site you get)

# acme.nebutra.com is the Sailor template's own site, built from exactly what
# create-sailor hands a new project (scripts/template-build.ts), deployed as its
# own Fly app. It follows Sailor Studio: NEXT_PUBLIC_PRESET_PREVIEW lets it wear
# the look a visitor last chose there (apps/landing/src/components/preset-preview.tsx).

on:
  workflow_dispatch:
    inputs:
      cutover:
        description: "After a healthy Fly URL, issue the Fly certificate and point acme.nebutra.com at it"
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/design/**"
      - "scripts/template-build.ts"
      - "scripts/lib/module-reach.mjs"
      - ".templateignore"
      - "infra/fly/acme.toml"
      - "infra/runtime/docker/Dockerfile.standalone"
      - ".github/workflows/deploy-acme.yml"

permissions:
  contents: read

# A cutover run points DNS and issues certificates; a push that lands mid-way
# must not cancel it (it did, twice, on acme). It gets its own group and is
# never cancelled; ordinary deploys still supersede each other.
concurrency:
  group: deploy-acme-${{ github.ref }}${{ github.event.inputs.cutover == 'true' && '-cutover' || '' }}
  cancel-in-progress: ${{ github.event.inputs.cutover != 'true' }}

jobs:
  deploy:
    name: Fly acme
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLY_APP: nebutra-acme
      SITE: https://acme.nebutra.com
      # Where the demo's Sign in / Get started lead: the "build your own" page.
      DEMO_CTA_URL: https://nebutra.com/sailor
    steps:
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Set repository secret FLY_API_TOKEN (deploy token)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Ensure Fly app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          org="$(bash infra/ops/scripts/resolve-fly-org.sh)"
          if flyctl apps list --json | python3 -c "import json,sys; names={a.get('Name') or a.get('name') for a in json.load(sys.stdin)}; sys.exit(0 if '${FLY_APP}' in names else 1)"; then
            echo "app ${FLY_APP} exists"
          else
            flyctl apps create "${FLY_APP}" --machines --org "$org" --yes
          fi

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build the template
        run: pnpm tsx scripts/template-build.ts --out="$RUNNER_TEMP/acme"

      - name: Install the template
        working-directory: ${{ runner.temp }}/acme
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Give the template its own brand
        # Exactly what create-sailor does for a new project (utils/brand.ts):
        # without it acme is the template wearing Nebutra's name, legal entity
        # and wordmark, which is not "the site you get".
        working-directory: ${{ runner.temp }}/acme
        env:
          CI: "1"
        run: |
          set -euo pipefail
          pnpm run brand:init -- --yes --name Acme
          pnpm run brand:apply

      - name: Build the template's landing
        working-directory: ${{ runner.temp }}/acme
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_OUTPUT: standalone
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE }}
          # The demo has no product app, API or sign-in behind it, and the
          # landing refuses to build for production without these (a missing one
          # used to fall back to http://localhost:3001 and ship it). The origins
          # are the site itself so nothing points anywhere that does not exist;
          # Sign in / Get started are redirected by NEXT_PUBLIC_DEMO_CTA_URL to
          # the real next step, building your own with Sailor.
          NEXT_PUBLIC_APP_URL: ${{ env.SITE }}
          NEXT_PUBLIC_API_URL: ${{ env.SITE }}
          NEXT_PUBLIC_DEMO_CTA_URL: ${{ env.DEMO_CTA_URL }}
          NEXT_PUBLIC_PRESET_PREVIEW: "1"
          DATABASE_URL: "postgresql://build-placeholder:placeholder@localhost:5432/build"
          REDIS_URL: "redis://localhost:6379"
        run: |
          set -euo pipefail
          pnpm turbo build --filter="@nebutra/landing^..."
          pnpm --filter @nebutra/landing build

      - name: Assemble image context
        working-directory: ${{ runner.temp }}/acme
        run: bash infra/ops/scripts/assemble-next-standalone.sh apps/landing "$RUNNER_TEMP/stage-acme" landing

      - name: Deploy Machine
        # A cutover only needs a healthy app, not a new one: the smoke below
        # checks the running machine. So a deploy Fly refuses (the org machine
        # limit did, 2026-09-28) does not hold the certificate and DNS hostage.
        continue-on-error: ${{ github.event.inputs.cutover == 'true' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy "$RUNNER_TEMP/stage-acme" \
            --config "$GITHUB_WORKSPACE/infra/fly/acme.toml" \
            --dockerfile "$RUNNER_TEMP/stage-acme/Dockerfile" \
            --build-arg "APP_WORKSPACE=apps/landing" \
            --ha=false \
            --remote-only \
            --yes

      - name: Smoke Fly URL
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          url="https://${FLY_APP}.fly.dev/"
          code="000"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -L "$url" || echo 000)
            echo "GET $url try $i -> $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          if [ "$code" != "200" ]; then
            flyctl status -a "${FLY_APP}" || true
            flyctl logs -a "${FLY_APP}" --no-tail || true
            echo "::error::$url is not healthy ($code). DNS will not cut over."
            exit 1
          fi
          css=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://${FLY_APP}.fly.dev/preset-preview.css")
          echo "GET /preset-preview.css -> $css"
          [ "$css" = "200" ] || { echo "::error::the preset preview stylesheet is not served ($css)"; exit 1; }

      - name: No local URLs, and the demo CTAs lead to the Sailor page
        run: |
          set -euo pipefail
          node scripts/verify-no-localhost-urls.mjs "https://${FLY_APP}.fly.dev" / /pricing /zh-Hans
          html=$(curl -sS --max-time 30 "https://${FLY_APP}.fly.dev/")
          printf '%s' "$html" | grep -q "href=\"${DEMO_CTA_URL}\"" \
            || { echo "::error::Sign in / Get started do not lead to ${DEMO_CTA_URL}"; exit 1; }

      - name: Issue the Fly certificate
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.cutover == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl certs add acme.nebutra.com -a "${FLY_APP}" || flyctl certs show acme.nebutra.com -a "${FLY_APP}"

      - name: Point acme.nebutra.com at Fly
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.cutover == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HOST: acme
        run: bash infra/ops/scripts/point-host-dns-fly.sh
