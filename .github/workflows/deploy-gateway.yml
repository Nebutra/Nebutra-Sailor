name: Deploy Gateway

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Gateway deploy target to activate"
        required: true
        default: "cloudflare-workers"
        type: choice
        options:
          - cloudflare-workers
          - vercel-functions
          - ecs-docker
          - k8s
          - aws
          - gcp
          - railway
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-workers:
    name: Cloudflare Workers edge gateway
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'cloudflare-workers') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        vars.DEPLOY_TARGET_GATEWAY == 'cloudflare-workers')
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Do not typecheck the origin gateway package here. Fresh install has
      # no workspace dist/, so a bare filter tsc cannot resolve @nebutra/db
      # and the job dies before wrangler. Origin typecheck is CI's job —
      # workflow_run already requires conclusion == success. This job deploys
      # worker-edge.ts only (no workspace imports); wrangler is the compile
      # gate for that file.
      - name: Validate Cloudflare secrets
        run: |
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set"; exit 1; }
          # The edge Worker carries no business logic and, since 2026-09-02, no
          # service credentials either: the per-IP flood limit is Cloudflare's
          # rate limiting binding, declared in wrangler.edge.toml. ORIGIN_URL is
          # a var there too — a hostname belongs in config where it is visible.

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backends/gateway
          command: deploy --config wrangler.edge.toml
