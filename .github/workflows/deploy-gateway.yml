name: Deploy Gateway

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Gateway deploy target to activate"
        required: true
        default: "cloudflare-workers"
        type: choice
        options:
          - cloudflare-workers
          - vercel-functions
          - ecs-docker
          - k8s
          - aws
          - railway
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-workers:
    name: Cloudflare Workers gateway
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'cloudflare-workers') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        vars.DEPLOY_TARGET_GATEWAY == 'cloudflare-workers')
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck gateway
        run: pnpm --filter @nebutra/gateway typecheck

      - name: Validate Cloudflare secrets
        run: |
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set"; exit 1; }
          [ -n "${{ vars.AI_SERVICE_URL }}" ] || { echo "::error::AI_SERVICE_URL repository variable is not set"; exit 1; }
          [ -n "${{ secrets.SERVICE_SECRET }}" ] || { echo "::error::SERVICE_SECRET secret is not set"; exit 1; }
          [ -n "${{ secrets.GATEWAY_SHARED_SECRET }}" ] || { echo "::error::GATEWAY_SHARED_SECRET secret is not set"; exit 1; }

      - name: Prepare Worker runtime bindings
        env:
          AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
          SERVICE_SECRET: ${{ secrets.SERVICE_SECRET }}
          GATEWAY_SHARED_SECRET: ${{ secrets.GATEWAY_SHARED_SECRET }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");

          fs.writeFileSync(
            "backends/gateway/.wrangler-secrets.json",
            JSON.stringify({
              AI_SERVICE_URL: process.env.AI_SERVICE_URL,
              SERVICE_SECRET: process.env.SERVICE_SECRET,
              GATEWAY_SHARED_SECRET: process.env.GATEWAY_SHARED_SECRET,
            }),
          );
          EOF

      - name: Sync Worker runtime bindings
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backends/gateway
          command: secret bulk .wrangler-secrets.json --config wrangler.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backends/gateway
          command: deploy --config wrangler.toml
