name: KCQ compatibility

on:
  pull_request:
    paths:
      - "apps/kcq/**"
      - "apps/kcq-docs/**"
      - "packages/iam/auth/**"
      - "packages/design/**"
      - "pnpm-lock.yaml"
      - ".github/actions/setup-node-pnpm/**"
      - ".github/workflows/kcq-compatibility.yml"
      - "infra/fly/kcq*"
      - "infra/fly/Dockerfile.kcq"
      - ".github/workflows/deploy-kcq-fly.yml"
      - "infra/fly/*kcq*"
  push:
    branches: [main]
    paths:
      - "apps/kcq/**"
      - "apps/kcq-docs/**"
      - "packages/iam/auth/**"
      - "packages/design/**"
      - "pnpm-lock.yaml"
      - ".github/actions/setup-node-pnpm/**"
      - ".github/workflows/kcq-compatibility.yml"
      - "infra/fly/kcq*"
      - "infra/fly/Dockerfile.kcq"
      - ".github/workflows/deploy-kcq-fly.yml"
      - "infra/fly/*kcq*"
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Optional upstream branch/tag/SHA to check without changing the production pin"
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: kcq-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup product toolchain
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.23.2"
          install-command: pnpm install --frozen-lockfile --filter @nebutra/kcq... --filter @nebutra/kcq-docs...
      - name: Test KCQ Machine supervisor and proxy contract
        run: python3 -m unittest discover -s infra/fly -p 'test_kcq_*.py'
      - name: Validate proxy configuration
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/infra/fly/kcq.nginx.conf:/etc/nginx/conf.d/default.conf:ro" -v "$PWD/infra/fly/kcq.security-headers.conf:/etc/nginx/snippets/kcq-security-headers.conf:ro" nginx:1.27-alpine nginx -t
      - name: Test upgrade safety
        run: node --test apps/kcq/scripts/upstream.test.mjs
      - name: Verify pinned product
        if: inputs.candidate_ref == ''
        run: node apps/kcq/scripts/verify.mjs
      - name: Build documentation from the pinned chart
        if: inputs.candidate_ref == ''
        run: |
          set -euo pipefail
          pnpm turbo run build --filter=@nebutra/kcq-docs^...
          pnpm --filter @nebutra/kcq-docs typecheck
          pnpm --filter @nebutra/kcq-docs test
          pnpm --filter @nebutra/kcq-docs build
      - name: Check candidate without changing production
        if: inputs.candidate_ref != ''
        env:
          KCQ_CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: node apps/kcq/scripts/upstream.mjs
