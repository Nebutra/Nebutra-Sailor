name: Visual Acceptance

on:
  pull_request:
    paths:
      - "apps/design-docs/**"
      - "apps/landing-page/**"
      - "e2e/visual/**"
      - "e2e/playwright.visual.config.ts"
      - "packages/design/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual-acceptance.yml"
  push:
    branches:
      - main
    paths:
      - "apps/design-docs/**"
      - "apps/landing-page/**"
      - "e2e/visual/**"
      - "e2e/playwright.visual.config.ts"
      - "packages/design/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: visual-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Docs and Feature Showcase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build visual app dependencies
        run: |
          pnpm turbo build \
            --filter="@nebutra/design-docs^..." \
            --filter="@nebutra/landing-page^..."

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production visual acceptance
        env:
          VISUAL_SERVER_MODE: production
        run: |
          set +e

          rm -rf playwright-report visual-acceptance-report

          pnpm visual:design-docs:ci
          design_docs_status=$?
          if [ -d playwright-report ]; then
            mkdir -p visual-acceptance-report/design-docs
            cp -R playwright-report/. visual-acceptance-report/design-docs/
          fi

          rm -rf playwright-report

          pnpm visual:landing:ci
          landing_status=$?
          if [ -d playwright-report ]; then
            mkdir -p visual-acceptance-report/landing
            cp -R playwright-report/. visual-acceptance-report/landing/
          fi

          if [ "$design_docs_status" -ne 0 ] || [ "$landing_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-acceptance-report-${{ github.run_id }}
          path: |
            visual-acceptance-report/
            test-results/
          if-no-files-found: error
