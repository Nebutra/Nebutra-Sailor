name: Visual Acceptance

on:
  pull_request:
    paths:
      - "apps/design-docs/**"
      - "apps/landing-page/**"
      - "e2e/visual/**"
      - "e2e/playwright.visual.config.ts"
      - "packages/design/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual-acceptance.yml"
      - ".github/actions/setup-node-pnpm/action.yml"
  push:
    branches:
      - main
    paths:
      - "apps/design-docs/**"
      - "apps/landing-page/**"
      - "e2e/visual/**"
      - "e2e/playwright.visual.config.ts"
      - "packages/design/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual-acceptance.yml"
      - ".github/actions/setup-node-pnpm/action.yml"

permissions:
  contents: read

concurrency:
  group: visual-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Docs and Feature Showcase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run production visual acceptance
        env:
          VISUAL_SERVER_MODE: production
        run: |
          set +e

          rm -rf playwright-report visual-acceptance-report

          pnpm visual:design-docs:ci
          design_docs_status=$?
          if [ -d playwright-report ]; then
            mkdir -p visual-acceptance-report/design-docs
            cp -R playwright-report/. visual-acceptance-report/design-docs/
          fi

          rm -rf playwright-report

          pnpm visual:landing:ci
          landing_status=$?
          if [ -d playwright-report ]; then
            mkdir -p visual-acceptance-report/landing
            cp -R playwright-report/. visual-acceptance-report/landing/
          fi

          if [ "$design_docs_status" -ne 0 ] || [ "$landing_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-acceptance-report-${{ github.run_id }}
          path: |
            visual-acceptance-report/
            test-results/
          if-no-files-found: error
