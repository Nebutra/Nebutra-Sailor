name: Visual Acceptance

on:
  pull_request:
    paths:
      - "apps/design-docs/**"
      - "apps/landing-page/**"
      - "e2e/visual/**"
      - "e2e/playwright.visual.config.ts"
      - "packages/design/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual-acceptance.yml"
  push:
    branches:
      - main
    paths:
      - "apps/design-docs/**"
      - "apps/landing-page/**"
      - "e2e/visual/**"
      - "e2e/playwright.visual.config.ts"
      - "packages/design/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: visual-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Docs and Feature Showcase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run visual acceptance
        run: pnpm visual:ci

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-acceptance-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
