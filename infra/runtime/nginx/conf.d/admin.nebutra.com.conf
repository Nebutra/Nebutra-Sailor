# Nebutra Admin — ecosystem control plane
# Origin: PM2 app `admin` on 127.0.0.1:3108
#
# THIS VHOST IS NOT LIKE THE OTHERS. Every other host here serves the public.
# This one serves a surface that reads across every tenant, and its only gate
# is Cloudflare Access, which lives in front of Cloudflare's edge — not here.
#
# That gate is bypassed entirely by anyone who resolves the origin IP and sends
# a Host: admin.nebutra.com header straight at this box. The DNS record being
# proxied does not prevent it; the IP is public and appears on the other A
# records for this same VM.
#
# So this vhost refuses connections that did not come through Cloudflare. The
# allow-list below is Cloudflare's published IP ranges (https://cloudflare.com/ips).
# Refresh with: curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
#
# If you are debugging and tempted to comment out the deny — don't. Use
# `cloudflared access` or curl through the edge with a service token.

geo $admin_from_cloudflare {
    default 0;

    # Cloudflare IPv4
    173.245.48.0/20   1;
    103.21.244.0/22   1;
    103.22.200.0/22   1;
    103.31.4.0/22     1;
    141.101.64.0/18   1;
    108.162.192.0/18  1;
    190.93.240.0/20   1;
    188.114.96.0/20   1;
    197.234.240.0/22  1;
    198.41.128.0/17   1;
    162.158.0.0/15    1;
    104.16.0.0/13     1;
    104.24.0.0/14     1;
    172.64.0.0/13     1;
    131.0.72.0/22     1;

    # Cloudflare IPv6
    2400:cb00::/32    1;
    2606:4700::/32    1;
    2803:f800::/32    1;
    2405:b500::/32    1;
    2405:8100::/32    1;
    2a06:98c0::/29    1;
    2c0f:f248::/32    1;
}

upstream nebutra_admin {
    server 127.0.0.1:3108;
    keepalive 16;
}

server {
    listen 80;
    server_name admin.nebutra.com;

    # No plaintext surface at all. The control plane is https-only; a redirect
    # would still have accepted and echoed the request path in the clear.
    return 444;
}

server {
    listen 443 ssl http2;
    server_name admin.nebutra.com;

    ssl_certificate     /etc/ssl/nebutra/fullchain.pem;
    ssl_certificate_key /etc/ssl/nebutra/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Direct-to-origin requests get no response at all — 444 closes the
    # connection without a status line, so a scanner learns nothing about
    # whether this host exists here.
    if ($admin_from_cloudflare = 0) {
        return 444;
    }

    # A header-presence check used to live here, dropping any request without
    # Cf-Access-Jwt-Assertion. It was removed after it returned 444 — no status
    # line at all — for real post-login traffic, which Cloudflare surfaces as a
    # bare "Error 520" with nothing to debug.
    #
    # Removing it costs nothing that was worth having. Presence of a header is not
    # a security property: anything that could set it could set it to any value.
    # The real check now runs in the app, where the assertion's signature, issuer
    # and per-application audience are all verified
    # (apps/admin/src/lib/access-assertion.ts) — cryptographic rather than
    # cosmetic, and it fails closed when misconfigured.
    #
    # The Cloudflare source-range check above stays. That one guards something
    # this cannot: a request aimed straight at the origin IP, which never passes
    # through Access at all.

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://nebutra_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Forwarded so the app can verify the Access assertion itself rather
        # than trusting that nginx already did.
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /_next/static/ {
        proxy_pass http://nebutra_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
