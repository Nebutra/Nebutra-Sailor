# docs.nebutra.com — public sailor-docs (Fumadocs)
# Origin: PM2 app `sailor-docs` on 127.0.0.1:3005

upstream nebutra_sailor_docs {
    server 127.0.0.1:3005;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.nebutra.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.nebutra.com;

    ssl_certificate     /etc/ssl/nebutra/fullchain.pem;
    ssl_certificate_key /etc/ssl/nebutra/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Do NOT redirect to nebutra.com — this host is the docs origin.

    location /_next/static/ {
        proxy_pass http://nebutra_sailor_docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        proxy_pass http://nebutra_sailor_docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        add_header Cache-Control "public, s-maxage=300, stale-while-revalidate=60" always;
    }
}
