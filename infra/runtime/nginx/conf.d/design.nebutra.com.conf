# design.nebutra.com — design system docs (Fumadocs)
# Origin: PM2 app `design-docs` on 127.0.0.1:3004
#
# Without this file the host still resolved and still terminated TLS, because
# the wildcard certificate covers it — but no server_name claimed it, so nginx
# fell through to the first 443 block (www.nebutra.com) and answered with its
# path-preserving `301 → https://nebutra.com$request_uri`. Clicking
# "Design System" in the marketing nav opened a tab that landed straight back on
# the marketing home page. The app was healthy on :3004 the whole time.
#
# No Cloudflare-only guard here, matching docs.nebutra.com: this is a public
# documentation host, and the guard's failure mode (444, no status line) is
# indistinguishable from an outage if the DNS record is ever created grey-cloud.

upstream nebutra_design_docs {
    server 127.0.0.1:3004;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name design.nebutra.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name design.nebutra.com;

    ssl_certificate     /etc/ssl/nebutra/fullchain.pem;
    ssl_certificate_key /etc/ssl/nebutra/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Do NOT redirect to nebutra.com — this host is the design-docs origin.

    location /_next/static/ {
        proxy_pass http://nebutra_design_docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        proxy_pass http://nebutra_design_docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        add_header Cache-Control "public, s-maxage=300, stale-while-revalidate=60" always;
    }
}
