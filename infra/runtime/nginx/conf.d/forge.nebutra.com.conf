        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400" always;
    }

    location = /robots.txt {
        proxy_pass http://nebutra_forge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, s-maxage=3600" always;
    }

    location /_next/static/ {
        proxy_pass http://nebutra_forge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        proxy_pass http://nebutra_forge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, s-maxage=300, stale-while-revalidate=86400" always;
    }
}
