# Nebutra Forge — tool station + Agent tool API
# Origin: PM2 app `forge` on 127.0.0.1:3105
#
# Cache: hide Next's force-dynamic `private, no-store` on public HTML so
# Cloudflare can cache the default-locale document. Auth/API stay private.

upstream nebutra_forge {
    server 127.0.0.1:3105;
    keepalive 16;
}

# Shared proxy params are repeated per location so a later include cannot
# silently drop Host / proto headers.

server {
    listen 80;
    server_name forge.nebutra.com;

    location ~ ^/(api|wallet|dashboard|keys)(/|$) {
        proxy_pass http://nebutra_forge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    location = /sitemap.xml {
        proxy_pass http://nebutra_forge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400" always;
    }

    location = /robots.txt {
        proxy_pass http://nebutra_forge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, s-maxage=3600" always;
    }

    location /_next/static/ {
        proxy_pass http://nebutra_forge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        proxy_pass http://nebutra_forge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, s-maxage=300, stale-while-revalidate=86400" always;
    }
}

server {
    listen 443 ssl http2;
    server_name forge.nebutra.com;

    ssl_certificate     /etc/ssl/nebutra/fullchain.pem;
    ssl_certificate_key /etc/ssl/nebutra/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~ ^/(api|wallet|dashboard|keys)(/|$) {
        proxy_pass http://nebutra_forge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
