# =============================================================================
# Nebutra Nginx Security Configuration Fragment
# Included by: nginx.conf and nginx-china.conf via `include conf.d/security.conf;`
#
# This file lives in the http{} context (NOT inside a server{} block).
# It sets global security defaults. Per-server overrides (e.g. X-Frame-Options)
# are set directly in each server block.
# =============================================================================

# ---------------------------------------------------------------------------
# Hide Nginx version from Server response header.
# Set this once in the top-level nginx.conf / nginx-china.conf http{} block;
# repeating server_tokens in this included http{} fragment makes nginx -t fail.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Default security headers applied to all server blocks.
#
# NOTE: Headers added here in the http{} context ONLY take effect if the
# server block does not also set headers with add_header. Because Nginx
# add_header inheritance stops when any child block adds a header, you
# should duplicate these in each server block OR use the headers-more
# module (ngx_http_headers_more_filter_module) for unconditional injection.
#
# The headers below serve as documentation of required values. Each server
# block in nginx.conf individually sets the critical headers to guarantee
# they are always sent.
# ---------------------------------------------------------------------------

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Deny embedding in frames (prevents clickjacking)
# Override per server block: app.nebutra.com uses DENY; others may use SAMEORIGIN
add_header X-Frame-Options "DENY" always;

# Legacy XSS filter for older browsers
add_header X-XSS-Protection "1; mode=block" always;

# Control referrer information sent with requests
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict browser feature access
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# ---------------------------------------------------------------------------
# Content Security Policy (CSP)
#
# This is a TEMPLATE. Adjust each directive for your actual asset origins.
#
# Placeholders to replace before production:
#   <CDN_DOMAIN>       — your CDN hostname, e.g. cdn.nebutra.com
#   <ANALYTICS_DOMAIN> — analytics script host, e.g. plausible.io or us.posthog.com
#   <MAPS_DOMAIN>      — if using maps (remove if not applicable)
#
# Start with report-only mode during rollout:
#   Content-Security-Policy-Report-Only "..."
# Then switch to enforcing once violations are resolved.
# ---------------------------------------------------------------------------
# add_header Content-Security-Policy "
#     default-src 'self';
#     script-src 'self' 'unsafe-inline' 'unsafe-eval'
#         https://<CDN_DOMAIN>
#         https://<ANALYTICS_DOMAIN>;
#     style-src 'self' 'unsafe-inline'
#         https://<CDN_DOMAIN>
#         https://fonts.googleapis.com;
#     font-src 'self'
#         https://<CDN_DOMAIN>
#         https://fonts.gstatic.com;
#     img-src 'self' data: blob:
#         https://<CDN_DOMAIN>;
#     connect-src 'self'
#         https://api.nebutra.com
#         wss://app.nebutra.com
#         https://<ANALYTICS_DOMAIN>;
#     frame-ancestors 'none';
#     base-uri 'self';
#     form-action 'self';
#     upgrade-insecure-requests;
# " always;

# ---------------------------------------------------------------------------
# Cross-Origin policies (modern browser isolation)
# ---------------------------------------------------------------------------
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# ---------------------------------------------------------------------------
# DNS prefetch control
# Prevent leaking navigation to third parties via prefetch
# ---------------------------------------------------------------------------
add_header X-DNS-Prefetch-Control "off" always;

# ---------------------------------------------------------------------------
# Cloudflare origin protection.
#
# origin.nebutra.com is a grey-cloud A record — it has to be, or the edge
# Worker forwarding to it would loop back through Cloudflare. That publishes
# the origin address, so anything that knows it can reach this server directly
# and skip the WAF, the rate limits and the bot rules entirely.
#
# Two parts:
#   1. real_ip — recover the actual client address from CF-Connecting-IP, so
#      logs and per-IP limits see the caller instead of a Cloudflare edge node.
#   2. $from_cloudflare — 1 when the connection itself came from Cloudflare.
#      Deliberately a variable rather than allow/deny, because one location
#      must stay open to the whole internet: ACME HTTP-01 validation. Denying
#      it would silently stop certificate renewal and expire TLS ~60 days
#      later, which is a worse outage than the one this prevents.
#
# Ranges are Cloudflare's published list (cloudflare.com/ips-v4, ips-v6),
# fetched 2026-07-28. Worker subrequests egress from these too — verified
# against this deployment: 172.64.215.19 in 172.64.0.0/13 and
# 2a06:98c0:3600::103 in 2a06:98c0::/29.
# ---------------------------------------------------------------------------
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# $realip_remote_addr is the address that actually opened the connection,
# before real_ip rewrote $remote_addr — checking $remote_addr instead would
# compare against a header the client controls.
geo $realip_remote_addr $from_cloudflare {
    default 0;
    127.0.0.1 1;
    ::1 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
