# status.nebutra.com — public status surface
#
# DNS: A → ECS (proxied). Without this server_name the default 443 block
# answers `301 → https://nebutra.com$request_uri` and the browser "flashes"
# back to the marketing home page.
#
# Content: reverse-proxy the landing status page on Vercel. Landing already
# implements /status + /status.json; we only need a host that does not 301.
# Root `/` maps to `/status` so the status host lands on the status UI.
#
# Long-term: CNAME status → cname.vercel-dns.com + bind on nebutra-landing
# (see point-status-dns-vercel.sh). Until Zone DNS Edit works on the CF
# token, this origin vhost is the production path.

# Resolver for dynamic upstream (Vercel anycast moves). Cloudflare 1.1.1.1
# is fine from the ECS VPC; override via host DNS if needed.
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name status.nebutra.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.nebutra.com;

    ssl_certificate     /etc/ssl/nebutra/fullchain.pem;
    ssl_certificate_key /etc/ssl/nebutra/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Do NOT redirect to nebutra.com — this host is the status origin.

    # Variable proxy_pass forces re-resolve of nebutra.com (Vercel).
    set $landing_upstream https://nebutra.com;

    location = / {
        proxy_pass $landing_upstream/status;
        proxy_ssl_server_name on;
        proxy_ssl_name nebutra.com;
        proxy_http_version 1.1;
        proxy_set_header Host nebutra.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        # Do not cache status HTML at the edge via origin headers.
        add_header Cache-Control "public, s-maxage=60, stale-while-revalidate=30" always;
    }

    location = /status.json {
        proxy_pass $landing_upstream/status.json;
        proxy_ssl_server_name on;
        proxy_ssl_name nebutra.com;
        proxy_http_version 1.1;
        proxy_set_header Host nebutra.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        add_header Cache-Control "public, s-maxage=30, stale-while-revalidate=15" always;
    }

    # Locale roots → /<locale>/status (landing multi-locale status pages)
    location ~ ^/(en|zh-Hans|zh-Hant|de|es|fr|ja|ko|pt|it|nl|sv|da|fi|no|pl|cs|ro|hu|el|ru|uk|tr|ar|he|fa|hi|bn|ur|th|vi|id|ms|sw)/?$ {
        proxy_pass $landing_upstream/$1/status;
        proxy_ssl_server_name on;
        proxy_ssl_name nebutra.com;
        proxy_http_version 1.1;
        proxy_set_header Host nebutra.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass $landing_upstream$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name nebutra.com;
        proxy_http_version 1.1;
        proxy_set_header Host nebutra.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
