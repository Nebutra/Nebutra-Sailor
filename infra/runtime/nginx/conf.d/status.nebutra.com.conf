# status.nebutra.com — public status surface
#
# DNS: A → ECS (proxied). Without this server_name the default 443 block
# answers `301 → https://nebutra.com$request_uri` and the browser "flashes"
# back to the marketing home page.
#
# Content: reverse-proxy the landing status page on Vercel. Landing already
# implements /status + /status.json. Root `/` maps to `/status`.
#
# Important: do NOT use `proxy_pass $var/path` — with a variable nginx does
# not rewrite the URI the way a literal proxy_pass does, and HTML upstreams
# end up 502 while small JSON sometimes still works. Use rewrite + bare
# `$upstream` (or a literal https://nebutra.com/…).

resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name status.nebutra.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.nebutra.com;

    ssl_certificate     /etc/ssl/nebutra/fullchain.pem;
    ssl_certificate_key /etc/ssl/nebutra/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Do NOT redirect to nebutra.com — this host is the status origin.

    # Dynamic resolve so Vercel anycast moves do not pin a stale IP.
    set $landing_upstream https://nebutra.com;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name nebutra.com;
    proxy_set_header Host nebutra.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    location = / {
        rewrite ^ /status break;
        proxy_pass $landing_upstream;
        add_header Cache-Control "public, s-maxage=60, stale-while-revalidate=30" always;
    }

    location = /status.json {
        rewrite ^ /status.json break;
        proxy_pass $landing_upstream;
        add_header Cache-Control "public, s-maxage=30, stale-while-revalidate=15" always;
    }

    # Locale roots → /<locale>/status
    location ~ ^/(en|zh-Hans|zh-Hant|de|es|fr|ja|ko|pt|it|nl|sv|da|fi|no|pl|cs|ro|hu|el|ru|uk|tr|ar|he|fa|hi|bn|ur|th|vi|id|ms|sw)/?$ {
        rewrite ^/([^/]+)/?$ /$1/status break;
        proxy_pass $landing_upstream;
        add_header Cache-Control "public, s-maxage=60, stale-while-revalidate=30" always;
    }

    location / {
        proxy_pass $landing_upstream;
        add_header Cache-Control "public, s-maxage=60, stale-while-revalidate=30" always;
    }
}
