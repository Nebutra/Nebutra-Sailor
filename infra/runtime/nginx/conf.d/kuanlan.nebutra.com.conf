# kuanlan.nebutra.com — 观澜 product edge (PM2 Next standalone, not Vercel)
# Origin: PM2 app `kuanlan` on 127.0.0.1:3120
#
# /api/moments/* holds SKU system prompts and calls router.nebutra.com/v1.
# Long-running Node — do not serve this host from Vercel functions.

upstream nebutra_kuanlan {
    server 127.0.0.1:3120;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name kuanlan.nebutra.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kuanlan.nebutra.com;

    ssl_certificate     /etc/ssl/nebutra/fullchain.pem;
    ssl_certificate_key /etc/ssl/nebutra/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://nebutra_kuanlan;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        client_max_body_size 20m;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://nebutra_kuanlan;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /_next/static/ {
        proxy_pass http://nebutra_kuanlan;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
