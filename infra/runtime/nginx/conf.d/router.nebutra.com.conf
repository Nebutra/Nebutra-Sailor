# Nebutra Router — product edge (model fabric / OpenAI-compatible UX)
# UI origin: PM2 app `router` on 127.0.0.1:3106
# Consume /v1: New-API sidecar on 127.0.0.1:3301 (localhost only; do not publish)

upstream nebutra_router {
    server 127.0.0.1:3106;
    keepalive 16;
}

upstream nebutra_new_api {
    server 127.0.0.1:3301;
    keepalive 8;
}

server {
    listen 80;
    server_name router.nebutra.com router-origin.nebutra.com;

    location ^~ /v1 {
        proxy_pass http://nebutra_new_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        client_max_body_size 32m;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://nebutra_router;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /_next/static/ {
        proxy_pass http://nebutra_router;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}

server {
    listen 443 ssl http2;
    server_name router.nebutra.com router-origin.nebutra.com;

    ssl_certificate     /etc/ssl/nebutra/fullchain.pem;
    ssl_certificate_key /etc/ssl/nebutra/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /v1 {
        proxy_pass http://nebutra_new_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        client_max_body_size 32m;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://nebutra_router;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store" always;
    }

    location /_next/static/ {
        proxy_pass http://nebutra_router;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
