app = "nebutra-ai"
primary_region = "sin"

# Two process groups from one image: the API answers the gateway over Fly private networking, the
# worker drains the task envelope. Nothing here is public — the gateway reaches it at
# http://nebutra-ai.internal:8000, the same shape New-API uses (docs/ops/nebutra/fly-origin.md).

[env]
  APP_ENV = "production"
  SERVICE_NAME = "python-ai"
  PORT = "8000"
  # Postgres task store; memory is refused in production by resolve_task_store().
  TASK_STORE_PROVIDER = "postgres"
  # verify-full needs a CA to verify against; point libpq at the system bundle rather than
  # weakening the connection to sslmode=require.
  PGSSLROOTCERT = "/etc/ssl/certs/ca-certificates.crt"
  TASK_DISPATCHER_PROVIDER = "celery"
  CELERY_QUEUES = "default,ai,document,maintenance,webhook"
  CELERY_WORKER_CONCURRENCY = "2"
  CELERY_PREFETCH_MULTIPLIER = "1"
  IMAGE_PROVIDER = "dashscope"
  UPLOAD_STORAGE_PROVIDER = "s3"

[processes]
  # `::` and not 0.0.0.0: Fly's private network is IPv6, so an IPv4-only bind is unreachable at
  # nebutra-ai.internal even while the machine looks healthy from inside itself.
  app = "uvicorn app.main:app --host :: --port 8000"
  worker = "celery -A app.workers.celery_app worker --loglevel=info --queues=default,ai,document,maintenance,webhook --concurrency=2 --prefetch-multiplier=1"

# No public service block: the origin has no public IP and is reached only over .internal.
# Fly still needs the internal port declared for private networking.
[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["worker"]
