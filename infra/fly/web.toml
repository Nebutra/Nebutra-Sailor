app = "nebutra-web"
primary_region = "sin"

[env]
  HOSTNAME = "0.0.0.0"
  PORT = "8080"
  # Gateway runs standalone (Cloudflare Workers + Fly nebutra-gateway) — do
  # not mount it in this process. See app/api/[[...route]]/route.ts and
  # docs/architecture/2026-09-24-sailor-convergence.md §6.
  GATEWAY_MODE = "external"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
