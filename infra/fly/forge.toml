app = "nebutra-forge"
primary_region = "sin"

# forge-dns-leak (the authoritative DNS leak-test zone, leak.nebutra.com) used
# to run as its own Fly app (nebutra-dns-leak) — merged in here to free a
# Machine slot under the org's 20-machine cap. It is not a second Fly process
# group: infra/runtime/docker/Dockerfile.standalone backgrounds the DNS/API
# process before exec'ing the Next server in the same container, so it shares
# this Machine and talks to it over localhost (apps/forge already defaulted
# FORGE_DNS_LEAK_URL to http://127.0.0.1:3953). ENABLE_FORGE_DNS_LEAK gates
# the Dockerfile CMD; ENABLE_NET_BIND_CAP is a build-arg (not set here) that
# grants the non-root node binary cap_net_bind_service so it can listen on
# :53 — set only for this app's deploy in deploy-fly.yml.
[env]
  HOSTNAME = "0.0.0.0"
  PORT = "8080"
  ENABLE_FORGE_DNS_LEAK = "true"
  FORGE_DNS_LEAK_ZONE = "leak.nebutra.com"
  FORGE_DNS_LEAK_NS = "ns1.leak.nebutra.com"
  FORGE_DNS_LEAK_ANSWER_IP = "127.0.0.1"
  FORGE_DNS_LEAK_DNS_HOST = "0.0.0.0"
  FORGE_DNS_LEAK_DNS_PORT = "53"
  # Control API stays loopback-only — same container as the Next app now, so
  # there is no 6PN hop and no reason to expose it beyond localhost.
  FORGE_DNS_LEAK_API_HOST = "127.0.0.1"
  FORGE_DNS_LEAK_API_PORT = "3953"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Authoritative UDP/TCP 53 for leak.nebutra.com. Needs a dedicated IPv4 (see
# the "Allocate dedicated IPv4 for the leak zone glue" step in deploy-fly.yml)
# — glue A must stay DNS-only, never orange-cloud.
[[services]]
  protocol = "udp"
  internal_port = 53
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 53

[[services]]
  protocol = "tcp"
  internal_port = 53
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 53

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
