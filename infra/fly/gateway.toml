app = "nebutra-gateway"
primary_region = "sin"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  # Router listens on IPv4 only (its HOSTNAME secret is 0.0.0.0) and
  # nebutra-router.internal resolves to IPv6, so the private address refuses the
  # connection. Reach it over its public host; every call carries a service token.
  NEBUTRA_ROUTER_INTERNAL_URL = "https://router.nebutra.com/api/internal/v1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "45s"
  interval = "15s"
  method = "GET"
  timeout = "8s"
  path = "/api/misc/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
