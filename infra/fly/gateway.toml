app = "nebutra-gateway"
primary_region = "sin"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  # PARA reference URLs (first-frame video, image edit) are accepted only on PARA's own
  # asset host — where nebutra-ai writes generated outputs (its UPLOAD_PUBLIC_BASE_URL, the same
  # value as Kuanlan's R2_PUBLIC_URL: cdn.nebutra.com). Not a secret. Unset fails closed.
  PARA_ASSET_BASE_URLS = "https://cdn.nebutra.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "45s"
  interval = "15s"
  method = "GET"
  timeout = "8s"
  path = "/api/misc/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
