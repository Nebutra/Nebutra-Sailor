limit_req_zone $binary_remote_addr zone=market:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=market_connections:10m;

# Real 404 bodies, one per locale (apps/kcq prerenders /404 and /zh/404); the docs ship their own
# (apps/kcq-docs: /docs/404.html and /zh/docs/404.html). The first matching regex wins.
map $uri $kcq_not_found {
    ~^/zh/docs(/|$) /zh/docs/404.html;
    ~^/docs(/|$) /docs/404.html;
    ~^/zh/ /zh/404.html;
    default /404.html;
}

# Connectors run in this Machine under kcq-supervisor (ports fixed there).
map $connector $connector_port {
    default 0;
    tdx 8081;
    python 8083;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Text responses declare UTF-8 (the docs' Chinese llms-full.txt, <page>.md, search.json).
    charset utf-8;
    charset_types text/plain text/markdown text/xml text/css application/json application/xml application/javascript;
    # Compress text the edge may not (the docs' RSC payloads, search index and stylesheets).
    # The streaming proxies below turn gzip off.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/markdown text/css text/xml application/json application/javascript application/xml image/svg+xml;
    include /etc/nginx/snippets/kcq-security-headers.conf;

    client_max_body_size 16k;
    limit_req_status 429;
    limit_conn_status 429;
    # Relative Location headers: behind Fly's TLS proxy an absolute one would carry http and :8080.
    absolute_redirect off;
    # Unknown paths keep their 404 status and get a page with a way into /app.
    error_page 404 $kcq_not_found;

    location ~ ^/market/(tdx|python)/api/v1/market-data/(sources/(gotdx|tradingview)/probe|instruments/search|bars|timeshare|timeshare/range|trading-calendar)$ {
        limit_except GET POST { deny all; }
        limit_req zone=market burst=30 nodelay;
        limit_conn market_connections 10;
        set $connector $1;
        set $market_path /api/v1/market-data/$2;
        set $backend 127.0.0.1:$connector_port;
        proxy_pass http://$backend$market_path$is_args$args;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    # Live K-line SSE (core BarsLiveSource). Each connector serves only its own source id.
    # Connectors ping every 15s, so a 35s read timeout only closes dead streams;
    # EventSource reconnects on its own.
    location ~ ^/market/(tdx/api/v1/market-data/sources/gotdx|python/api/v1/market-data/sources/tradingview)/stream$ {
        limit_except GET { deny all; }
        limit_req zone=market burst=10 nodelay;
        limit_conn market_connections 6;
        set $stream_target $1;
        if ($stream_target ~ ^(tdx|python)/(.*)$) { set $connector $1; set $stream_path /$2/stream; }
        set $backend 127.0.0.1:$connector_port;
        proxy_pass http://$backend$stream_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
        proxy_next_upstream off;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    location ~ ^/market/binance(/api/binance/(orderbook|depth-events))$ {
        # Save the path before the symbol validation regex replaces nginx captures.
        set $depth_path $1;
        if ($arg_symbol !~ ^(btcusdt|ethusdt)$) { return 400; }
        limit_except GET { deny all; }
        limit_req zone=market burst=10 nodelay;
        limit_conn market_connections 4;
        set $depth_backend 127.0.0.1:8082;
        proxy_pass http://$depth_backend$depth_path$is_args$args;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
        proxy_next_upstream off;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    # Authenticated customer keys live on the gateway, never on the static chart Machine.
    location /market/byok/ {
        limit_req zone=market burst=10 nodelay;
        limit_conn market_connections 6;
        resolver 1.1.1.1 1.0.0.1 valid=30s ipv6=off;
        set $byok_backend nebutra-gateway.fly.dev;
        rewrite ^/market/byok/(.*)$ /api/v1/kcq/$1 break;
        proxy_pass https://$byok_backend;
        proxy_set_header Host $byok_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name $byok_backend;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-KCQ-Workspace $http_x_kcq_workspace;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_next_upstream off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    # Managed AI (OpenAI-compatible, session-authenticated). The gateway decides
    # staff vs public routing from the session; nginx forwards identity cookies only.
    location /market/ai/ {
        limit_req zone=market burst=5 nodelay;
        limit_conn market_connections 4;
        resolver 1.1.1.1 1.0.0.1 valid=30s ipv6=off;
        set $ai_backend nebutra-gateway.fly.dev;
        rewrite ^/market/ai/(.*)$ /api/v1/kcq-ai/$1 break;
        proxy_pass https://$ai_backend;
        proxy_set_header Host $ai_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name $ai_backend;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        client_max_body_size 1m;
        proxy_next_upstream off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    # Unknown connector paths must never return the SPA HTML as a fake success.
    location /market/ { return 404; }

    # Docs OG images keep their URL when a page title changes, so they are not immutable.
    location ~ ^/docs/og/.+\.png$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
        access_log off;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/snippets/kcq-security-headers.conf;
        return 200 "healthy\n";
    }

    # Product surface (docs/architecture/2026-10-09-kcq-product-surface.md). The public paths
    # mirror apps/kcq/src/public/routes.ts; tests/architecture/seo-locale-closure.test.ts pins them.
    # HTML is revalidated on every load so it never references chunks a deploy removed.

    # `/` enters the workbench.
    location = / {
        return 302 /app$is_args$args;
    }

    # Public pages are prerendered files (/home -> /home.html), never the SPA shell.
    location ~ ^/(zh/)?(home|benchmark|investors)$ {
        try_files $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    # One URL per public page.
    location ~ ^/((?:zh/)?(?:home|benchmark|investors))(?:/|\.html)$ {
        return 301 /$1$is_args$args;
    }

    # The authenticated app: workbench under /app and account settings share the SPA shell.
    location ~ ^/app(/.*)?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    location ~ ^/settings/profile/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    # Documentation (apps/kcq-docs, a static Fumadocs export): English /docs, Chinese /zh/docs.
    # Pages are files without the extension (/docs/guides/themes -> docs/guides/themes.html); every
    # dotted path below /docs is a real file (assets, search.json, <page>.md, llms.txt, sitemap.xml)
    # served by `location /`. One URL per page: trailing slashes and .html redirect to the bare path.
    # Before the .html redirect: error_page re-enters location matching with this URI.
    location ~ ^/(zh/)?(docs/)?404\.html$ {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    location ~ ^/((?:zh/)?docs(?:/[^.]*?)?)/$ {
        return 301 /$1$is_args$args;
    }

    location ~ ^/((?:zh/)?docs(?:/[^.]*)?)\.html$ {
        return 301 /$1$is_args$args;
    }

    location ~ ^/(zh/)?docs(/[^.]*)?$ {
        try_files $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    # Markdown twins of the docs pages, for agents (/docs/guides/themes.md).
    location ~ ^/(zh/)?docs(/.*)?\.md$ {
        types { }
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    # Directories are not pages.
    location ~ /$ { return 404; }

    # Everything else is a real file (robots.txt, sitemap.xml) or a real 404, including
    # unknown .map/.xml/.webmanifest paths; it never falls back to the SPA shell.
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }
}
