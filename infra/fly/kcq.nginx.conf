limit_req_zone $binary_remote_addr zone=market:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=market_connections:10m;

# Connectors run in this Machine under kcq-supervisor (ports fixed there).
map $connector $connector_port {
    default 0;
    tdx 8081;
    python 8083;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/snippets/kcq-security-headers.conf;

    client_max_body_size 16k;
    limit_req_status 429;
    limit_conn_status 429;

    location ~ ^/market/(tdx|python)/api/v1/market-data/(sources/(gotdx|tradingview)/probe|instruments/search|bars|timeshare|timeshare/range|trading-calendar)$ {
        limit_except GET POST { deny all; }
        limit_req zone=market burst=30 nodelay;
        limit_conn market_connections 10;
        set $connector $1;
        set $market_path /api/v1/market-data/$2;
        set $backend 127.0.0.1:$connector_port;
        proxy_pass http://$backend$market_path$is_args$args;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    location ~ ^/market/binance(/api/binance/(orderbook|depth-events))$ {
        # Save the path before the symbol validation regex replaces nginx captures.
        set $depth_path $1;
        if ($arg_symbol !~ ^(btcusdt|ethusdt)$) { return 400; }
        limit_except GET { deny all; }
        limit_req zone=market burst=10 nodelay;
        limit_conn market_connections 4;
        set $depth_backend 127.0.0.1:8082;
        proxy_pass http://$depth_backend$depth_path$is_args$args;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
        proxy_next_upstream off;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    # Authenticated customer keys live on the gateway, never on the static chart Machine.
    location /market/byok/ {
        limit_req zone=market burst=10 nodelay;
        limit_conn market_connections 6;
        resolver 1.1.1.1 1.0.0.1 valid=30s ipv6=off;
        set $byok_backend nebutra-gateway.fly.dev;
        rewrite ^/market/byok/(.*)$ /api/v1/kcq/$1 break;
        proxy_pass https://$byok_backend;
        proxy_set_header Host $byok_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name $byok_backend;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-KCQ-Workspace $http_x_kcq_workspace;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_next_upstream off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    # Managed AI (OpenAI-compatible, session-authenticated). The gateway decides
    # staff vs public routing from the session; nginx forwards identity cookies only.
    location /market/ai/ {
        limit_req zone=market burst=5 nodelay;
        limit_conn market_connections 4;
        resolver 1.1.1.1 1.0.0.1 valid=30s ipv6=off;
        set $ai_backend nebutra-gateway.fly.dev;
        rewrite ^/market/ai/(.*)$ /api/v1/kcq-ai/$1 break;
        proxy_pass https://$ai_backend;
        proxy_set_header Host $ai_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name $ai_backend;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        client_max_body_size 1m;
        proxy_next_upstream off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }

    # Unknown connector paths must never return the SPA HTML as a fake success.
    location /market/ { return 404; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
        access_log off;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/snippets/kcq-security-headers.conf;
        return 200 "healthy\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Revalidate the shell on every load so it never references chunks a deploy removed.
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/kcq-security-headers.conf;
    }
}
