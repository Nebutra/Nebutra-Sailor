app = "nebutra-para"
primary_region = "sin"

[env]
  HOSTNAME = "0.0.0.0"
  PORT = "8080"
  NEXT_PUBLIC_SITE_URL = "https://para.nebutra.com"
  NEXT_PUBLIC_AUTH_PROVIDER = "better-auth"
  NEXT_PUBLIC_AUTH_URL = "https://auth.nebutra.com"
  BETTER_AUTH_URL = "https://auth.nebutra.com"
  # NEXT_PUBLIC_PARA_API_URL is a build-time value: deploy-fly.yml sets it on the build step.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
