app = "nebutra-para"
primary_region = "sin"

[env]
  HOSTNAME = "0.0.0.0"
  PORT = "8080"
  NEXT_PUBLIC_SITE_URL = "https://para.nebutra.com"
  NEXT_PUBLIC_AUTH_PROVIDER = "better-auth"
  NEXT_PUBLIC_AUTH_URL = "https://auth.nebutra.com"
  BETTER_AUTH_URL = "https://auth.nebutra.com"
  # Unset on purpose until the migration is applied and a session reaches the gateway.
  # With it unset the shell runs on mock data instead of 401-ing every call.
  # NEXT_PUBLIC_PARA_API_URL = "https://api.nebutra.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
