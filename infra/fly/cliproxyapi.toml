# Account relay (CLIProxyAPI). No public HTTP — New-API reaches it on 6PN only:
#   http://nebutra-cliproxyapi.internal:8317/v1
# OAuth JSON lives on the cliproxy_auths volume; add accounts with
#   FLY_APP=nebutra-cliproxyapi infra/nebutra-router/scripts/cliproxy-login.sh codex
app = "nebutra-cliproxyapi"
primary_region = "sin"

[build]
  image = "eceasy/cli-proxy-api:v7.2.156"

[env]
  TZ = "Asia/Shanghai"

# TCP without published ports = 6PN / .internal only.
[[services]]
  protocol = "tcp"
  internal_port = 8317
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "cliproxy_auths"
  destination = "/root/.cli-proxy-api"

[[files]]
  guest_path = "/CLIProxyAPI/config.yaml"
  secret_name = "CLIPROXY_CONFIG_YAML"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
