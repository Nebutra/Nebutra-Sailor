# Included in the server block and in every location that sets its own add_header:
# nginx drops inherited add_header directives as soon as a location declares one.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Enforced after a Playwright probe of the live workbench and profile pages with this exact policy:
# the only violation was Cloudflare's auto-injected Web Analytics beacon, now allowed.
# BYOK model hosts are user-configurable, so connect-src stays https:/wss:.
# The one inline script is the public pages' theme-init, admitted by hash (apps/kcq theme.test.ts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+TJT3dKFqA+dzvAGfo7i7bKUWwGv2gTuBRudYzSSl7g=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' https://auth.nebutra.com" always;
# Edge-only lifetime for prerendered public files (map $kcq_edge_cache in kcq.nginx.conf).
# Empty for everything else, and nginx omits a header whose value is empty.
add_header Cloudflare-CDN-Cache-Control $kcq_edge_cache always;
