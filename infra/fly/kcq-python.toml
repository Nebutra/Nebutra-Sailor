app = "nebutra-kcq-python"
primary_region = "sin"

[env]
  CONNECTOR = "python"
  STOCK_DIRECTORY_DB_PATH = "/app/data/stock-directory.db"

[checks.live]
  type = "http"
  port = 8080
  method = "GET"
  path = "/"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
