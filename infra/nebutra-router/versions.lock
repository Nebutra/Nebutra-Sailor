# Pinned supply-engine images for Nebutra Router.
# Bump only with changelog review + contract smoke tests.

new-api:
  image: calciumion/new-api
  tag: v0.8.7.4
  role: channel-hub
  notes: Official keys, peer New-API, model channels. Internal ops UI only.

sub2api:
  image: ghcr.io/wei-shaw/sub2api
  tag: latest
  role: subscription-pool
  notes: >
    B-class account/subscription relay. Compose profile "sub2api".
    Pin a digest in production; "latest" is for lab only.

cliproxyapi:
  image: eceasy/cli-proxy-api
  tag: v7.2.154
  role: account-relay
  notes: >
    B-class OAuth / CLI account reverse proxy (ChatGPT-Codex, Google via
    Antigravity, Claude, Kimi, xAI). Registered in New-API as an OpenAI-type
    channel; never a second Router upstream. Auth JSON lives on a volume.
    Management API stays off. Bump with the login runbook re-tested.

redis:
  image: redis
  tag: 7.4-alpine

postgres:
  image: postgres
  tag: 16-alpine

policy:
  public_ingress: false
  customer_entry: https://router.nebutra.com
  upgrade_requires:
    - contract tests against chat completions stream
    - balance debit reconciliation sample
