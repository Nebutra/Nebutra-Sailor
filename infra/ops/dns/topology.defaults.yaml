# Pebble brand front is ECS (same A pattern as app/api) — owner topology 2026-07-30.
# Brand product fronts on ECS (same A pattern as app/api) — owner 2026-07-30.
# pebble: PM2 Next; carina: nginx static Astro from Nebutra/carina apps/docs.
# design: PM2 design :3109 + nginx conf.d/design.nebutra.com.conf
#
# status: A → ECS. nginx conf.d/status.nebutra.com.conf reverse-proxies the
# landing status surface (nebutra.com/status) so the host no longer falls
# through to the default 443 block's 301 → nebutra.com. Long-term cutover to
# pure Vercel (CNAME + nebutra-landing domain) is scripted in
# point-status-dns-vercel.sh once CLOUDFLARE_API_TOKEN has Zone DNS Edit and
# landing production deploys are green.
#
# open: Vercel CNAME on the landing project (`point-open-dns-vercel.sh`).
# Host alias — landing `/` on open.nebutra.com rewrites to `/open`.
# Console stays on app `/settings/developers`. Do not add an ECS A or a
# second Vercel project.
ecs_surfaces: [app, auth, api, sso, router, forge, design, status, admin, pebble, carina]
vercel_surfaces: [open]
proxy:
  proxied:
    [
      "@",
      www,
      app,
      auth,
      api,
      sso,
      router,
      forge,
      design,
      status,
      open,
      admin,
      pebble,
      carina,
      mail,
      imap,
      pop3,
      smtp,
    ]
  dns_only: [docs]
